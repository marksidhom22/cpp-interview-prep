- id: '12.10'
  topic: Standard Template Library (STL)
  question: What are the main iterator categories?
  answer: |-
    ## Short answer

    Input, output, forward, bidirectional, random-access, and contiguous. Each category adds capabilities, and algorithms state the minimum category they require.

    ## Detailed answer

    Classic hierarchy:

    ```text
    Input / Output
        -> Forward
            -> Bidirectional
                -> Random Access
                    -> Contiguous (C++20 concept)
    ```

    ### Input iterator

    Single-pass reading.

    ### Output iterator

    Writes through traversal.

    ### Forward iterator

    Multi-pass forward traversal.

    ### Bidirectional iterator

    Adds decrement; used by list/set/map iterators.

    ### Random-access iterator

    Adds arithmetic, difference, ordering, indexing; vector/deque iterators.

    ### Contiguous iterator

    Random-access plus contiguous element layout; vector/array/string pointers/iterators under relevant rules.

    Algorithms require capabilities:

    ```text
    find          -> input iterator
    reverse       -> bidirectional iterator
    sort          -> random-access iterator
    ```

    C++20 iterator concepts refine the model and ranges may use different sentinel types for end.
  source: 12_cpp_standard_template_library_stl.md
