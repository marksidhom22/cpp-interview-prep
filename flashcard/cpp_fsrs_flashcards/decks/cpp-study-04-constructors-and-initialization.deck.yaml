cards:
- id: '04.1'
  topic: Constructors, Destructors, and Initialization
  question: What is the difference between allocation and construction?
  answer: |-
    Allocation obtains raw storage. Construction establishes a live object in that storage by initializing bases and members and executing the constructor when required.

    **More detail:** Storage can exist before an object lifetime begins, for example in raw storage; construction establishes the object's valid state.
  source: 04_constructors_destructors_initialization.md
- id: '04.2'
  topic: Constructors, Destructors, and Initialization
  question: What is the difference between initialization and assignment?
  answer: |-
    Initialization establishes an object’s first state as its lifetime begins. Assignment replaces the state of an already-live object.

    **More detail:** Initialization is part of object creation and may invoke a constructor; assignment operates on an already-live destination.
  source: 04_constructors_destructors_initialization.md
- id: '04.3'
  topic: Constructors, Destructors, and Initialization
  question: What does `Widget w = other;` mean?
  answer: |-
    It is copy-initialization of a new object, not assignment. `w = other;` is assignment only if `w` already exists.

    **More detail:** The declaration creates `w` by invoking copy initialization; only a later assignment expression targets an existing `w`.
  source: 04_constructors_destructors_initialization.md
- id: '04.4'
  topic: Constructors, Destructors, and Initialization
  question: Why prefer member initializer lists?
  answer: |-
    They directly initialize members and are required for bases, references, const members, and members without suitable default constructors. Assignment in the body happens too late for these cases.

    **More detail:** Direct member initialization avoids constructing a default value and then assigning, and it supports members that cannot be default-constructed.
  source: 04_constructors_destructors_initialization.md
- id: '04.5'
  topic: Constructors, Destructors, and Initialization
  question: What determines data-member initialization order?
  answer: |-
    Declaration order inside the class, not the textual order in the constructor’s initializer list.

    **More detail:** The compiler initializes members in declaration order even if the initializer list is written differently; matching the order avoids bugs and warnings.
  source: 04_constructors_destructors_initialization.md
- id: '04.6'
  topic: Constructors, Destructors, and Initialization
  question: What is the construction order in inheritance?
  answer: |-
    Virtual bases, direct bases, data members in declaration order, then the constructor body. Destruction reverses the completed construction order.

    **More detail:** The destructor runs in reverse order, so each subobject is torn down while the subobjects it may depend on are still alive.
  source: 04_constructors_destructors_initialization.md
- id: '04.7'
  topic: Constructors, Destructors, and Initialization
  question: What happens to an in-class member initializer?
  answer: |-
    It supplies a default when a constructor does not explicitly initialize that member. A constructor’s member initializer overrides it.

    **More detail:** An explicit member initializer in a constructor takes precedence over the in-class default for that constructor.
  source: 04_constructors_destructors_initialization.md
- id: '04.8'
  topic: Constructors, Destructors, and Initialization
  question: What is a delegating constructor?
  answer: |-
    A constructor that invokes another constructor of the same class, centralizing common initialization and reducing duplicated logic.

    **More detail:** The delegating target constructor completes initialization first, after which the delegating constructor body runs.
  source: 04_constructors_destructors_initialization.md
- id: '04.9'
  topic: Constructors, Destructors, and Initialization
  question: Why mark a single-argument constructor `explicit` by default?
  answer: |-
    To prevent surprising implicit conversions. Leave it implicit only when conversion is intentional and natural for the type.

    **More detail:** An implicit converting constructor can make overload resolution accept unintended argument conversions; `explicit` keeps that choice visible.
  source: 04_constructors_destructors_initialization.md
- id: '04.10'
  topic: Constructors, Destructors, and Initialization
  question: Why do `initializer_list` constructors require care?
  answer: |-
    Brace initialization strongly prefers matching `initializer_list` overloads, which can select a different constructor than parentheses and can reject narrowing conversions.

    **More detail:** For example, a brace expression may select an `initializer_list` overload instead of a count-and-value constructor.
  source: 04_constructors_destructors_initialization.md
- id: '04.11'
  topic: Constructors, Destructors, and Initialization
  question: When does an object’s destructor run?
  answer: |-
    At lifetime end: scope exit, owner deletion, container destruction, exception unwinding, or destruction of the containing object.

    **More detail:** RAII makes these lifetime endpoints predictable, including cleanup during stack unwinding after an exception.
  source: 04_constructors_destructors_initialization.md
- id: '04.12'
  topic: Constructors, Destructors, and Initialization
  question: When does a base class need a virtual destructor?
  answer: |-
    When objects may be deleted through a base pointer. Without a virtual destructor, such deletion has undefined behavior. A protected non-virtual destructor can intentionally forbid base-pointer deletion.

    **More detail:** A virtual destructor ensures destruction dispatches through the dynamic type when deleting a derived object via a base pointer.
  source: 04_constructors_destructors_initialization.md
- id: '04.13'
  topic: Constructors, Destructors, and Initialization
  question: What happens if construction throws?
  answer: |-
    Already-constructed bases and members are destroyed automatically in reverse order. The incomplete object’s own destructor is not called.

    **More detail:** Only fully constructed subobjects are cleaned up; the constructor's own destructor cannot run because the complete object never finished construction.
  source: 04_constructors_destructors_initialization.md
- id: '04.14'
  topic: Constructors, Destructors, and Initialization
  question: How does virtual dispatch behave in constructors and destructors?
  answer: |-
    Dispatch is limited to the class currently under construction or destruction; it does not call overrides in a more-derived portion whose lifetime has not begun or has already ended.

    **More detail:** Calling a virtual function from a constructor or destructor does not dispatch into a derived portion that is not currently alive.
  source: 04_constructors_destructors_initialization.md
