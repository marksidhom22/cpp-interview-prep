    public:
        Foo(const Foo& other);
    };
    ```

    Examples:

    ```cpp
    Foo a;
    Foo b = a; // copy-initialization
    Foo c(a);  // direct-initialization
    Foo d{a};  // direct-list-initialization
    ```

    All three target objects are new.

    ### Why the parameter is usually `const Foo&`

    - Passing by value would itself require copying, creating recursion.
    - Passing by reference avoids another copy.
    - Const allows copying from const objects and ordinary lvalues.
    - A copy operation should not normally change the source.

    A rare legacy type may have `Foo(Foo&)`, but that cannot copy from const sources and behaves poorly with modern containers.

    ### Explicit copy constructor

    A copy constructor may be marked explicit:

    ```cpp
    explicit Foo(const Foo&);
    ```

    Then direct initialization can use it:

    ```cpp
    Foo c(a);
    ```

    but copy-initialization cannot:

    ```cpp
    // Foo b = a;
    ```

    This is unusual; copy constructors normally model natural copying and are not explicit.

    ### Other contexts that may copy

    Depending on optimization and overloads:

    - Passing an object by value.
    - Returning an object by value.
    - Throwing/catching by value.
    - Inserting an lvalue into a container.
    - Capturing an object by value in a lambda.
  source: 05_copy_constructor_and_copy_assignment.md
- id: '05.3'
  topic: Copy Construction and Copy Assignment
  question: What does compiler-generated copying do?
  answer: |-
    ## Short answer

    It copies each direct base and non-static data member using that subobject’s copy operation.

    ## Detailed answer

    If you do not declare copy operations, the compiler often implicitly declares them. When used and valid, they copy:

    - Direct base-class subobjects.
    - Non-static data members.
    - Array elements member by member.

    Example:

    ```cpp
    class Report {
    public:
        std::string title;
        std::vector<int> values;
    };
    ```

    Compiler-generated copying is correct:

    ```cpp
    Report first;
    Report second = first;
    ```

    `std::string` and `std::vector` implement value semantics, so the copied object receives independent logical contents.

    ### Explicitly defaulting

    You can state the intent:

    ```cpp
    class Report {
    public:
        Report(const Report&) = default;
        Report& operator=(const Report&) = default;
    };
    ```

    Do this when it improves interface clarity. Avoid declaring special members without a reason, because declarations can affect move generation and triviality.

    ### When generated copy is deleted

    Copy operations may be implicitly deleted when a base or member cannot be copied:

    ```cpp
    class Owner {
    private:
        std::unique_ptr<int> value_;
    };

    Owner a;
    // Owner b = a; // error
    ```

    A `unique_ptr` is intentionally non-copyable, so the containing type's implicit copy constructor is deleted.

    User-declared move operations also affect implicit copy generation. Exact implicit-generation rules are worth knowing conceptually, but the design rule is simpler: explicitly default or delete special members when ownership semantics are not obvious.
  source: 05_copy_constructor_and_copy_assignment.md
- id: '05.4'
  topic: Copy Construction and Copy Assignment
  question: When is memberwise copy correct?
  answer: |-
    ## Short answer

    When every base and member already has the desired copy semantics—for example, value-like members such as `string`, `vector`, and other Rule-of-Zero types.

    ## Detailed answer

    Memberwise copy is desirable when members express the intended semantics:

    ```cpp
    class TelemetryPacket {
    public:
        std::uint64_t timestamp{};
        std::string source;
        std::vector<std::byte> payload;
    };
    ```

    The generated copy:

    - Copies the timestamp.
    - Copies the string contents.
    - Copies the vector elements.

    This provides independent value semantics.

    ### Pointers that are non-owning

    A raw pointer can be correct under memberwise copying if it is explicitly non-owning:

    ```cpp
    class SensorView {
    public:
        explicit SensorView(const Sensor* sensor)
            : sensor_{sensor} {}

    private:
        const Sensor* sensor_; // borrowed, optional
    };
    ```

    Copying the view should normally copy the pointer so both views refer to the same external sensor. The lifetime contract must ensure the sensor outlives both views.

    ### References

    A reference member is copied by binding the new object's reference to the same referred-to object:

    ```cpp
    class SensorRef {
        Sensor& sensor_;
    };
    ```

    Reference members also make ordinary copy assignment problematic because a reference cannot be reseated. The compiler-generated copy assignment is typically deleted.
  source: 05_copy_constructor_and_copy_assignment.md
- id: '05.5'
  topic: Copy Construction and Copy Assignment
  question: Why is generated copying dangerous for an owning raw pointer?
  answer: |-
    ## Short answer

    It copies only the address, so two objects may believe they own the same allocation, causing aliasing, double deletion, use-after-free, or leaks.

    ## Detailed answer

    Consider:

    ```cpp
    class Buffer {
    public:
        explicit Buffer(std::size_t size)
            : size_{size},
              data_{new int[size]{}} {}

        ~Buffer() {
            delete[] data_;
        }

    private:
        std::size_t size_;
        int* data_; // owning pointer
    };
    ```

    The class compiles and works for a single object. The problem appears when copying:

    ```cpp
    Buffer first{10};
    Buffer second = first;
    ```

    The generated copy constructor performs a shallow copy:

    ```text
    first.data_  ----+
                     +---- one allocated array
    second.data_ ----+
    ```

    Both destructors later execute `delete[]` on the same address: undefined behavior.

    ### Generated copy assignment is worse

    ```cpp
    Buffer first{10};
    Buffer second{20};

    second = first;
    ```

    Memberwise assignment overwrites `second.data_`:

    - The original 20-element allocation becomes unreachable: memory leak.
    - Both objects point to the same 10-element allocation: later double deletion.

    ### Terminology

    - **Shallow copy:** copy handles/addresses without duplicating owned resource contents.
    - **Deep copy:** create a distinct resource and copy the contents.
    - Shallow copy is not inherently bad; it is wrong when it contradicts ownership semantics.

    ### Concept diagram

    ```mermaid
    flowchart LR
        A[Object A] --> P[Same allocation]
        B[Shallow-copied Object B] --> P
        A --> D1[Destructor deletes allocation]
        B --> D2[Second delete: undefined behavior]
    ```
  source: 05_copy_constructor_and_copy_assignment.md
- id: '05.6'
  topic: Copy Construction and Copy Assignment
  question: What is a deep copy?
  answer: |-
    ## Short answer

    It creates a distinct owned resource and copies the resource’s contents, so the two objects can be modified and destroyed independently.

    ## Detailed answer

    A complete C++11-era example:

    ```cpp
    #include <algorithm>
    #include <cstddef>
    #include <utility>

    class Buffer {
    public:
        explicit Buffer(std::size_t size)
            : size_{size},
              data_{new int[size]{}} {}

        ~Buffer() {
            delete[] data_;
        }

        Buffer(const Buffer& other)
            : size_{other.size_},
              data_{new int[other.size_]} {
            std::copy_n(other.data_, size_, data_);
        }

        Buffer& operator=(const Buffer& other) {
            if (this == &other) {
                return *this;
            }

            int* replacement = new int[other.size_];
            std::copy_n(other.data_, other.size_, replacement);

            delete[] data_;
            data_ = replacement;
            size_ = other.size_;

            return *this;
        }

        int& operator[](std::size_t index) {
            return data_[index];
        }

        const int& operator[](std::size_t index) const {
            return data_[index];
        }

    private:
        std::size_t size_{};
        int* data_{};
    };
    ```

    The copy constructor allocates independent storage:

    ```cpp
    Buffer first{10};
    first[0] = 42;

    Buffer second = first;
    second[0] = 100;
    ```

    Now:

    ```text
    first.data_  -> [42, ...]
    second.data_ -> [100, ...]
    ```

    ### Why allocate before deleting in assignment?

    ```cpp
    int* replacement = new int[other.size_];
    ```

    If allocation fails, the original object remains unchanged. Only after the replacement is successfully prepared does the implementation release old state.

    For `int`, copying cannot throw. For general element types, stronger exception-safety techniques are needed.

    ### Rule of Three

    If a class manually manages a resource and needs any of:

    - Destructor.
    - Copy constructor.
    - Copy assignment.

    it often needs to consider all three.
  source: 05_copy_constructor_and_copy_assignment.md
- id: '05.7'
  topic: Copy Construction and Copy Assignment
  question: What must copy assignment handle?
  answer: |-
    ## Short answer

    Existing owned state, self-assignment, exception safety, and a valid result if resource acquisition fails. It conventionally returns `*this` by reference.

    ## Detailed answer

    Copy assignment must handle several cases.

    ### Self-assignment

    ```cpp
    buffer = buffer;
    ```

    A naive implementation might delete the resource and then attempt to copy from the same deleted resource.

    An identity check handles it:

    ```cpp
    if (this == &other) {
        return *this;
    }
    ```

    A well-designed algorithm such as copy-and-swap can be naturally self-assignment safe without a separate check.

    ### Exception safety

    Common guarantees are:

    - **No-throw guarantee:** operation never throws.
    - **Strong guarantee:** if it fails, the target remains unchanged.
    - **Basic guarantee:** invariants remain valid, but state may change.
    - **No guarantee:** even invariants may be lost.

    Preparing a full replacement before modifying `*this` is a common strong-guarantee strategy.

    ### Copy-and-swap

    ```cpp
    class Buffer {
    public:
        Buffer& operator=(Buffer other) {
            swap(other);
            return *this;
        }

        void swap(Buffer& other) noexcept {
            using std::swap;
            swap(size_, other.size_);
            swap(data_, other.data_);
        }

        // constructors and destructor omitted
    };
    ```

    The parameter `other` is a copy for lvalue arguments or a move for rvalues when move construction exists. Swapping cannot fail, and `other` destroys the old state when the function returns.

    #### Tradeoffs

    - Clear strong exception safety.
    - Naturally handles self-assignment.
    - May do an allocation even when existing capacity could be reused.
    - A carefully optimized assignment may perform less work.
  source: 05_copy_constructor_and_copy_assignment.md
- id: '05.8'
  topic: Copy Construction and Copy Assignment
  question: What does the copy-and-swap idiom provide?
  answer: |-
    ## Short answer

    Construct a safe copy first, then swap it with the target. This naturally handles self-assignment and can provide the strong exception guarantee, at a possible extra-allocation or performance cost.

    ## Detailed answer

    Copy assignment must handle several cases.

    ### Self-assignment

    ```cpp
    buffer = buffer;
    ```

    A naive implementation might delete the resource and then attempt to copy from the same deleted resource.

    An identity check handles it:

    ```cpp
    if (this == &other) {
        return *this;
    }
    ```

    A well-designed algorithm such as copy-and-swap can be naturally self-assignment safe without a separate check.

    ### Exception safety

    Common guarantees are:

    - **No-throw guarantee:** operation never throws.
    - **Strong guarantee:** if it fails, the target remains unchanged.
    - **Basic guarantee:** invariants remain valid, but state may change.
    - **No guarantee:** even invariants may be lost.

    Preparing a full replacement before modifying `*this` is a common strong-guarantee strategy.

    ### Copy-and-swap

    ```cpp
    class Buffer {
    public:
        Buffer& operator=(Buffer other) {
            swap(other);
            return *this;
        }

        void swap(Buffer& other) noexcept {
            using std::swap;
            swap(size_, other.size_);
            swap(data_, other.data_);
        }

        // constructors and destructor omitted
    };
    ```

    The parameter `other` is a copy for lvalue arguments or a move for rvalues when move construction exists. Swapping cannot fail, and `other` destroys the old state when the function returns.

    #### Tradeoffs

    - Clear strong exception safety.
    - Naturally handles self-assignment.
    - May do an allocation even when existing capacity could be reused.
    - A carefully optimized assignment may perform less work.
  source: 05_copy_constructor_and_copy_assignment.md
- id: '05.9'
  topic: Copy Construction and Copy Assignment
  question: When should copying be deleted?
  answer: |-
    ## Short answer

    When a resource has unique identity or cannot be meaningfully duplicated, such as many mutexes, threads, hardware channels, or unique OS handles.

    ## Detailed answer

    Delete copy operations when an object represents exclusive ownership or identity:

    ```cpp
    class DeviceSession {
    public:
        DeviceSession(const DeviceSession&) = delete;
        DeviceSession& operator=(const DeviceSession&) = delete;

        DeviceSession(DeviceSession&&) noexcept = default;
        DeviceSession& operator=(DeviceSession&&) noexcept = default;
    };
    ```

    Common non-copyable types include:

    - `std::unique_ptr`.
    - `std::mutex`.
    - `std::thread` and `std::jthread` in relevant respects.
    - Unique OS handles.
    - Exclusive hardware registrations.
    - Objects whose address is part of an external invariant.

    ### Why not hide copy operations privately?

    Old code used private undeclared functions. `= delete` is clearer, provides better diagnostics, and makes the intent visible to type traits and templates.
  source: 05_copy_constructor_and_copy_assignment.md
- id: '05.10'
  topic: Copy Construction and Copy Assignment
  question: How can declaring special members affect moves?
  answer: |-
    ## Short answer

    User-declared copy operations or a destructor can suppress implicit move generation. Explicitly default, delete, or implement operations according to the intended ownership model.

    ## Detailed answer

    A move operation transfers state from an object that is about to be discarded or explicitly treated as movable:

    ```cpp
    Buffer destination = std::move(source);
    ```

    `std::move` is a cast that allows move overloads to be selected; it does not itself transfer anything.

    A user-declared destructor prevents implicit move generation in common cases. The same object may then fall back to copying if a copy operation is available, sometimes unexpectedly.

    ### Default moves with owning raw pointers

    Blindly defaulting move operations for a raw owning pointer is unsafe:

    ```cpp
    Buffer(Buffer&&) = default; // copies pointer bits; source still owns it
    ```

    Both objects would still delete the address. A manual move must empty the source, or better, ownership should use `std::unique_ptr`/`std::vector`.

    ### `noexcept`

    Standard containers prefer moving during reallocation when a move constructor is `noexcept`; otherwise they may copy to preserve exception guarantees.
  source: 05_copy_constructor_and_copy_assignment.md
- id: '05.11'
  topic: Copy Construction and Copy Assignment
  question: What is object slicing?
  answer: |-
    ## Short answer

    Copying a derived object into a base object by value discards the derived portion. For polymorphic copying, consider an explicit virtual `clone()` interface.

    ## Detailed answer

    Copying by base value slices derived state:

    ```cpp
    Derived derived;
    Base base = derived;
    ```

    Only the `Base` subobject is copied into `base`.

    Polymorphic objects are normally handled through references or pointers:

    ```cpp
    void process(const Base& object);
    ```

    If an independent polymorphic copy is required, use a virtual clone pattern:

    ```cpp
    class Base {
    public:
        virtual ~Base() = default;
        virtual std::unique_ptr<Base> clone() const = 0;
    };

    class Derived : public Base {
    public:
        std::unique_ptr<Base> clone() const override {
            return std::make_unique<Derived>(*this);
        }
    };
    ```

    ### Tradeoff

    Cloning supports value-like polymorphism but requires each derived type to implement correct copying. Sometimes a non-polymorphic value type or type-erasure wrapper is cleaner.
  source: 05_copy_constructor_and_copy_assignment.md
- id: '05.12'
  topic: Copy Construction and Copy Assignment
  question: What is the preferred modern copy-design rule?
  answer: |-
    ## Short answer

    Rule of Zero: compose the type from members whose ownership, copy, move, and destruction behavior are already correct.

    ## Detailed answer

    Prefer composing resource-managing members:

    ```cpp
    class Buffer {
    public:
        explicit Buffer(std::size_t size)
            : data_(size) {}

        int& operator[](std::size_t index) {
            return data_[index];
        }

        const int& operator[](std::size_t index) const {
            return data_[index];
        }

    private:
        std::vector<int> data_;
    };
    ```

    No destructor, copy constructor, copy assignment, move constructor, or move assignment is needed.

    `std::vector` already supplies:

    - Destruction.
    - Deep copying.
    - Efficient moving.
    - Exception-safe assignment.
    - Size tracking.

    ### Rule of Zero benefit

    Fewer handwritten special members mean:

    - Fewer ownership bugs.
    - Better exception safety.
    - Easier maintenance.
    - Correct behavior when new members are added.
    - Better compatibility with standard containers.

    ### Pimpl nuance

    A class owning an incomplete implementation through `std::unique_ptr<Impl>` may need an out-of-line destructor where `Impl` is complete:

    ```cpp
    class Widget {
    public:
        Widget();
        ~Widget();

    private:
        class Impl;
        std::unique_ptr<Impl> impl_;
    };
    ```

    This is still RAII design, even though a destructor declaration is needed for completeness/ABI structure.

    ### Rule of Three

    Manual resource management in pre-move C++ often requires:

    ```cpp
    ~T();
    T(const T&);
    T& operator=(const T&);
    ```

    ### Rule of Five

    Modern C++ adds:

    ```cpp
    T(T&&) noexcept;
    T& operator=(T&&) noexcept;
    ```

    A manual resource owner should consider all five operations.

    ### Rule of Zero

    Prefer needing none by composing standard RAII types.

    ### These are design heuristics, not compiler laws

    Defining one function does not mechanically mean every other one must be handwritten. It means the ownership design requires deliberate review of the full set.

    For example, a polymorphic base may need only:

    ```cpp
    virtual ~Base() = default;
    ```

    and explicitly defaulted copy/move behavior may or may not fit its intended semantics.
  source: 05_copy_constructor_and_copy_assignment.md
- id: '06.1'
  topic: Namespaces and Overloading
  question: What problem do namespaces solve?
  answer: |-
    ## Short answer

    They organize names and prevent collisions between components without creating objects or runtime overhead.

    ## Detailed answer

    Namespaces create named scopes:

    ```cpp
    namespace vehicle {
        class Controller {};
        void initialize();
    }
    ```

    Use the scope-resolution operator:

    ```cpp
    vehicle::Controller controller;
    vehicle::initialize();
    ```

    Two namespaces may contain identical unqualified names:

    ```cpp
    namespace can_bus {
        void send();
    }

    namespace ethernet {
        void send();
    }
    ```

    Qualified calls are unambiguous:

    ```cpp
    can_bus::send();
    ethernet::send();
    ```

    ### Reopening a namespace

    A namespace can be defined in multiple places:

    ```cpp
    namespace vehicle {
        class Controller;
    }

    namespace vehicle {
        void start(Controller&);
    }
    ```

    This supports declaring related API components across headers and source files.

    ### Namespaces do not allocate objects

    A namespace is a compile-time naming scope, not an object and not a class. It has no instances or `this` pointer.
  source: 06_namespaces_and_overloading.md
- id: '06.2'
  topic: Namespaces and Overloading
  question: Why avoid `using namespace ...` in a header?
  answer: |-
    ## Short answer

    It imports names into every including translation unit, potentially creating collisions, ambiguities, and changed overload sets far from the header.

    ## Detailed answer

    ### Using-declaration

    ```cpp
    using std::string;

    string name;
    ```

    It introduces a selected name.

    ### Using-directive

    ```cpp
    using namespace std;
    ```

    It makes all namespace members available for unqualified lookup in that scope.

    ### Header rule

    Do not place broad using-directives in headers:

    ```cpp
    // public_header.hpp
    using namespace std; // avoid
    ```

    Every source file including the header inherits the directive, which can cause:

    - Name collisions.
    - Ambiguous overloads.
    - Behavior changes when a library adds a new name.
    - Confusing diagnostics.

    A local using-declaration inside a function is often fine:

    ```cpp
    void f() {
        using std::swap;
        swap(a, b);
    }
    ```

    That pattern deliberately supports ADL.
  source: 06_namespaces_and_overloading.md
- id: '06.3'
  topic: Namespaces and Overloading
  question: What does an unnamed namespace provide?
  answer: |-
    ## Short answer

    Internal linkage for names within one translation unit. It is generally preferred to namespace-scope `static` for C++ implementation-only names.

    ## Detailed answer

    ```cpp
    namespace {
        void helper() {}
        int local_counter{};
    }
    ```

    Names in an unnamed namespace have internal linkage: each translation unit gets its own distinct entities.

    This is useful in `.cpp` files for implementation details that should not create externally visible symbols.

    Older C-style code often uses:

    ```cpp
    static void helper();
    ```

    at namespace scope for internal linkage. Unnamed namespaces generalize cleanly to types, variables, and functions.

    ### Header warning

    An unnamed namespace in a header creates a separate entity in every translation unit that includes it. That may be intended for certain constants/templates, but often wastes space or creates surprising identity differences.
  source: 06_namespaces_and_overloading.md
- id: '06.4'
  topic: Namespaces and Overloading
  question: What is argument-dependent lookup (ADL)?
  answer: |-
    ## Short answer

    For an unqualified function call, ADL also searches namespaces and classes associated with the argument types. It is important for operators, customization functions, and swap-style calls.

    ## Detailed answer

    ADL adds namespaces and classes associated with function arguments to function lookup.

    ```cpp
    namespace geometry {
        struct Point {
            int x{};
            int y{};
        };

        bool equal(const Point& a, const Point& b) {
            return a.x == b.x && a.y == b.y;
        }
    }

    geometry::Point a;
    geometry::Point b;

    bool same = equal(a, b); // ADL finds geometry::equal
    ```

    No `using geometry::equal` is required because the argument type is associated with `geometry`.

    ### The `swap` pattern

    ```cpp
    using std::swap;
    swap(a, b);
    ```

    Ordinary lookup provides `std::swap`; ADL can find a more specialized `swap` in the type's namespace.

    ### Tradeoff

    ADL enables natural non-member APIs and operators, but it makes lookup less obvious. Place non-member functions intended as part of a type's interface in the same namespace as the type.
  source: 06_namespaces_and_overloading.md
- id: '06.5'
  topic: Namespaces and Overloading
  question: What makes two function declarations overloads?
  answer: |-
    ## Short answer

    They share a name in the relevant scope but have distinct parameter-type lists or, for members, distinct qualifying forms such as trailing const or reference qualification.

    ## Detailed answer

    Overloading lets functions share a name when their parameter declarations distinguish them:

    ```cpp
    void print(int value);
    void print(double value);
    void print(const std::string& value);
    ```

    Calls:

    ```cpp
    print(10);          // print(int)
    print(3.14);        // print(double)
    print(std::string{"status"}); // string overload
    ```

    Overloads should represent one conceptual operation across different types or parameter forms. Unrelated behaviors under one name make code harder to understand.

    ### Member-function overloads

    Member functions can differ by:

    - Parameter types/count.
    - Member-function cv-qualification.
    - Ref-qualification.

    ```cpp
    class Buffer {
    public:
        int& data() &;
        const int& data() const &;
        int data() &&;
    };
    ```
  source: 06_namespaces_and_overloading.md
- id: '06.6'
  topic: Namespaces and Overloading
  question: Can return type alone distinguish overloads?
  answer: |-
    ## Short answer

    No, because a call must be resolved before its return value can select a function.

    ## Detailed answer

    ### Return type alone

    ```cpp
    int read();
    double read(); // error
    ```

    A call may ignore the result:

    ```cpp
    read();
    ```

    so there is no return context that could choose uniquely.

    ### Top-level const on by-value parameters

    ```cpp
    void f(int value);
    void f(const int value); // same function type
    ```

    The parameter is a local copy. Its internal mutability is not part of the caller-facing overload.

    Low-level const does distinguish pointer/reference interfaces:

    ```cpp
    void inspect(Device*);
    void inspect(const Device*);
    ```

    ### Parameter names

    ```cpp
    void set(int left);
    void set(int right); // same declaration shape
    ```

    Names are not part of a function signature.

    ### Default arguments

    ```cpp
    void log(int level);
    void log(int level = 1); // redeclaration, not an overload
    ```

    ### `noexcept`

    Functions cannot generally be overloaded solely on different exception specifications.
  source: 06_namespaces_and_overloading.md
- id: '06.7'
  topic: Namespaces and Overloading
  question: What are the main steps of overload resolution?
  answer: |-
    ## Short answer

    Build the candidate set, keep viable functions, rank required conversions, and select one unique best match. Otherwise the call is ill-formed.

    ## Detailed answer

    For a call, the compiler conceptually:

    1. Performs name lookup to build candidate functions.
    2. Applies template argument deduction where relevant.
    3. Removes candidates whose arguments cannot form valid calls.
    4. Ranks the conversions for viable candidates.
    5. Selects one unique best viable function.
    6. Reports ambiguity if no unique best exists.

    Example:

    ```cpp
    void process(int);
    void process(double);

    process(10);   // exact match to int
    process(10.0); // exact match to double
    ```

    ### Ambiguity

    ```cpp
    void process(long);
    void process(double);

    process(10); // potentially ambiguous: two standard conversions
    ```

    Neither candidate is strictly better in the required way.

    ### Context can matter for templates and conversions

    Overload resolution includes detailed rules for reference binding, qualification conversions, user-defined conversions, templates, initializer lists, and rewritten comparison candidates in modern standards.

    For interviews, explain the ranking model correctly before diving into rare tie-breakers.

    ### Concept diagram

    ```mermaid
    flowchart LR
        A[Name lookup] --> B[Build candidate set]
        B --> C[Discard non-viable functions]
        C --> D[Rank implicit conversions]
        D --> E{Unique best candidate?}
        E -->|Yes| F[Call it]
        E -->|No| G[Compile-time ambiguity/error]
    ```
  source: 06_namespaces_and_overloading.md
- id: '06.8'
  topic: Namespaces and Overloading
  question: How are common implicit conversions ranked?
  answer: |-
    ## Short answer

    Exact matches beat promotions; promotions beat other standard conversions; standard conversions generally beat user-defined conversions.

    ## Detailed answer

    A simplified useful order is:

    ```text
    Exact match
        better than
    Promotion
        better than
    Other standard conversion
        better than
    User-defined conversion
        better than
    Ellipsis
    ```

    ### Exact match

    ```cpp
    void f(int);
    f(10);
    ```

    Qualification and certain reference adjustments are included in exact-match categories.

    ### Promotion

    ```cpp
    void f(int);
    short value = 1;
    f(value); // short promotes to int
    ```

    ### Standard conversion

    ```cpp
    void f(double);
    int value = 1;
    f(value); // int converts to double
    ```

    ### User-defined conversion

    ```cpp
    class Distance {
    public:
        Distance(int);
    };

    void f(Distance);
    f(10);
    ```

    ### Avoid relying on intricate overload sets

    Overloads with many integral types, implicit constructors, and templates can become ambiguous or platform-dependent because fundamental type widths differ.
  source: 06_namespaces_and_overloading.md
- id: '06.9'
  topic: Namespaces and Overloading
  question: How can a derived declaration hide base overloads?
  answer: |-
    ## Short answer

    Declaring any function with the same name in the derived class can hide the entire base overload set. Use `using Base::function;` to restore it when intended.

    ## Detailed answer

    A derived declaration with a name hides base declarations of the same name:

    ```cpp
    class Base {
    public:
        void configure(int);
        void configure(double);
    };

    class Derived : public Base {
    public:
        void configure(const std::string&);
    };

    Derived d;
    // d.configure(10); // base overloads hidden
    ```

    Restore the overload set:

    ```cpp
    class Derived : public Base {
    public:
        using Base::configure;
        void configure(const std::string&);
    };
    ```

    Now all three overloads participate.

    This is name hiding, not overriding. Overriding specifically concerns virtual functions with matching signatures.
  source: 06_namespaces_and_overloading.md
- id: '06.10'
  topic: Namespaces and Overloading
  question: What can operator overloading not change?
  answer: |-
    ## Short answer

    It cannot invent new operators or change an operator’s precedence, associativity, arity, or evaluation rules.

    ## Detailed answer

    The keyword `operator` forms special function names:

    ```cpp
    class Buffer {
    public:
        int& operator[](std::size_t index);
    };
    ```

    This expression:

    ```cpp
    buffer[3]
    ```

    corresponds to:

    ```cpp
    buffer.operator[](3)
    ```

    A binary non-member operator:

    ```cpp
    Point operator+(const Point& left, const Point& right);
    ```

    allows:

    ```cpp
    Point result = a + b;
    ```

    ### Fixed language properties

    Operator overloading cannot:

    - Create a new symbol such as `**`.
    - Change precedence.
    - Change associativity.
    - Change the number of operands.
    - Redefine behavior when every operand is a built-in type.

    At least one operand normally must be a user-defined class or enum type.

    ### Operators that cannot be overloaded

    Important examples include:

    ```text
    .
    .*
    ::
    ?:
    sizeof
    typeid
    alignof
    ```

    ### Surprising meaning

    Do not make `operator+` mutate its left operand or perform unrelated I/O.

    ### Incorrect return type

    Assignment and compound assignment conventionally return `T&`. Prefix increment normally returns `T&`; postfix returns the old value.

    ### Missing const

    Read-only operators should be const:

    ```cpp
    bool operator==(const T& other) const;
    ```

    ### Broken laws

    If `a == b`, callers expect consistent hashing and ordering relationships. If `<` is used for ordered containers, it must provide strict weak ordering.

    ### Short-circuit assumptions

    Overloaded `operator&&` and `operator||` are function calls and historically do not behave exactly like built-in short-circuit operators in all relevant semantic respects. Avoid overloading them for ordinary domain types.

    ### Address-of and comma

    Overloading operators with fundamental language roles can make generic code surprising.
  source: 06_namespaces_and_overloading.md
- id: '06.11'
  topic: Namespaces and Overloading
  question: When should an operator be a non-member?
  answer: |-
    ## Short answer

    Use a non-member for symmetric binary operations when the left operand need not be the class type, often implemented as a hidden friend when private access is appropriate.

    ## Detailed answer

    ### Must be members

    Operators including assignment, subscript, call, and member access arrow are defined as members:

    ```cpp
    T& operator=(const T&);
    Element& operator[](std::size_t);
    Result operator()(Arguments...);
    T* operator->();
    ```

    ### Symmetric binary operators

    Prefer a non-member for symmetric operations so conversions can apply to both operands:

    ```cpp
    class Distance {
    public:
        explicit Distance(int meters) : meters_{meters} {}

        Distance& operator+=(const Distance& other) {
            meters_ += other.meters_;
            return *this;
        }

    private:
        int meters_;

        friend Distance operator+(Distance left, const Distance& right) {
            left += right;
            return left;
        }
    };
    ```

    Taking the left operand by value reuses `+=` and permits efficient move/copy behavior.

    ### Stream insertion

    ```cpp
    std::ostream& operator<<(std::ostream& out, const Device& device);
    ```

    It must be a non-member because the left operand is an `std::ostream`, which you do not modify by adding a member.
  source: 06_namespaces_and_overloading.md
- id: '06.12'
  topic: Namespaces and Overloading
  question: What is the main operator-design rule?
  answer: |-
    ## Short answer

    Define an operator only when its meaning is natural, unsurprising, and consistent with the built-in operator’s conceptual behavior.

    ## Detailed answer

    Before adding an overload, ask:

    1. Does the operator have an obvious conventional meaning for this type?
    2. Will its complexity surprise users?
    3. Should it be a member or symmetric non-member?
    4. Does it preserve const correctness?
    5. Are related operators consistent?
    6. Would a named function be clearer?
    7. Can implicit conversions create ambiguity?
    8. Does it preserve required ordering or equality laws?

    Named functions are better when multiple interpretations are plausible:

    ```cpp
    matrix.concatenate(other);
    matrix.multiply(other);
    ```

    instead of assigning an arbitrary meaning to an operator.
  source: 06_namespaces_and_overloading.md
- id: '07.1'
  topic: '`static`, `explicit`, and `friend`'
  question: What three separate concepts are often confused around `static`?
  answer: |-
    ## Short answer

    Storage duration answers how long storage exists; scope answers where a name is visible; linkage answers whether declarations in different places name the same entity.

    ## Detailed answer

    The meaning of `static` depends on where it appears.

    | Context | Main effect |
    |---|---|
    | Local variable | Static storage duration, block scope |
    | Class data member | One shared member associated with the class |
    | Class member function | No implicit object/`this` |
    | Namespace-scope name | Internal linkage |
    | Function declaration at namespace scope | Function visible only within translation unit |

    These meanings are related historically but should be reasoned about separately.

    ### Storage duration, scope, and linkage

    - **Storage duration** answers when storage exists.
    - **Scope** answers where a name can be used.
    - **Linkage** answers whether declarations in different scopes/translation units name the same entity.

    A local static demonstrates why these are distinct: its name has block scope, but the object exists for the program's duration.
  source: 07_static_explicit_friend.md
- id: '07.2'
  topic: '`static`, `explicit`, and `friend`'
  question: What does a function-local static mean?
  answer: |-
    ## Short answer

    It has block scope, is initialized once when control first reaches the declaration, and has static storage duration, so it persists across calls.

    ## Detailed answer

    ```cpp
    int next_id() {
        static int id{};
        return ++id;
    }
    ```

    `id`:

    - Is initialized once, when control first reaches the declaration.
    - Retains its value across calls.
    - Has block scope.
    - Has static storage duration.
    - Is destroyed during program termination if it has non-trivial destruction.

    ### Initialization timing

    ```cpp
    Configuration& configuration() {
        static Configuration config = load_configuration();
        return config;
    }
    ```

    Initialization happens on first call, not necessarily at program startup. This is the construct-on-first-use idiom.

    Since C++11, if multiple threads race to initialize the same function-local static, initialization occurs exactly once. Other threads wait.

    ### Later access still needs synchronization

    ```cpp
    void increment() {
        static int count{};
        ++count; // data race if called concurrently without synchronization
    }
    ```

    Only initialization is protected. The object does not become atomic or thread-safe.

    ### Recursive initialization

    If initialization recursively re-enters the same declaration before completion, behavior is problematic/undefined under the relevant rules. Avoid initialization dependencies that call back into themselves.

    ### Costs

    Implementations may use a guard check on each entry. It is often tiny and optimized, but real-time code should measure and review it.
  source: 07_static_explicit_friend.md
- id: '07.3'
  topic: '`static`, `explicit`, and `friend`'
  question: Is function-local static initialization thread-safe?
  answer: |-
    ## Short answer

    Since C++11, initialization is thread-safe. Later reads and writes to the object are not automatically synchronized.

    ## Detailed answer

    Objects with static storage duration undergo:

    1. Static initialization, including zero initialization and constant initialization where possible.
    2. Dynamic initialization when required.

    ### Cross-translation-unit order problem

    ```cpp
    // a.cpp
    Logger logger{configuration()};

    // b.cpp
    Configuration global_configuration{load()};
    ```

    The dynamic initialization order of non-local objects across translation units can be unspecified or only partially ordered. `logger` may access configuration before it is dynamically initialized.

    ### Construct on first use

    ```cpp
    Configuration& configuration() {
        static Configuration value = load();
        return value;
    }
    ```

    This delays construction until first use and gives a clear dependency at the call site.

    ### Destruction order

    Function-local statics are destroyed in reverse order of completed initialization within the relevant rules. Dependencies during program shutdown can still fail if one static uses another that has already been destroyed.

    Some process-lifetime services are intentionally never destroyed, but leaking by design needs documentation and may be unacceptable for test isolation or analysis tools.

    ### Embedded implications

    Static initialization can:

    - Increase startup time before `main`.
    - Access hardware before clocks/peripherals are ready.
    - Consume RAM for the program's entire execution.
    - Introduce hidden guards or locking.
    - Create initialization-order dependencies.

    Explicit platform startup sequencing is often clearer in firmware.
  source: 07_static_explicit_friend.md
- id: '07.4'
  topic: '`static`, `explicit`, and `friend`'
  question: What is a static data member?
  answer: |-
    ## Short answer

    One class-associated object shared by all instances rather than a separate member inside each instance.

    ## Detailed answer

    ```cpp
    class Device {
    public:
        static std::size_t count;

        Device() {
            ++count;
        }

        ~Device() {
            --count;
        }
    };

    std::size_t Device::count = 0;
    ```

    There is one `count` associated with the class, not one per `Device`.

    Access it as:

    ```cpp
    Device::count
    ```

    Access through an object is permitted but less clear:

    ```cpp
    device.count
    ```

    ### Definition requirements

    Traditional static data members need one out-of-class definition in a source file:

    ```cpp
    std::size_t Device::count = 0;
    ```

    C++17 inline variables allow definition in the class/header:

    ```cpp
    class Device {
    public:
        inline static std::size_t count{};
    };
    ```

    `inline` here permits identical definitions across translation units while referring to one entity.

    ### `constexpr` static members

    ```cpp
    class Protocol {
    public:
        inline static constexpr std::uint32_t magic = 0xCAFEu;
    };
    ```

    Modern inline constexpr members are convenient compile-time class constants.

    ### Object-count caveats

    A manual counter must consider:

    - Copies and moves.
    - Construction exceptions.
    - Destruction order.
    - Concurrency.
    - Whether derived objects count.
    - Static objects during startup/shutdown.

    Use `std::atomic<std::size_t>` if concurrent increments must be safe.
  source: 07_static_explicit_friend.md
- id: '07.5'
  topic: '`static`, `explicit`, and `friend`'
  question: What restriction does a static member function have?
  answer: |-
    ## Short answer

    It has no implicit object and no `this` pointer, so it directly accesses only static members unless given an object explicitly.

    ## Detailed answer

    ```cpp
    class Device {
    public:
        static std::size_t active_count() {
            return count_;
        }

    private:
        inline static std::size_t count_{};
    };
    ```

    A static member function:

    - Has no implicit object parameter.
    - Has no `this` pointer.
    - Can be called as `Device::active_count()`.
    - Directly accesses static class members.
    - Can access ordinary members only through an explicit object.

    ```cpp
    static int read_id(const Device& device) {
        return device.id_;
    }
    ```

    Because it is a class member, it still has access to private members when given an object.

    ### Cannot be const or virtual

    Trailing const qualifies `this`, but a static member has no `this`:

    ```cpp
    // static int count() const; // invalid
    ```

    Virtual dispatch also requires an object, so static members cannot be virtual.

    ### Use cases

    - Factory functions.
    - Class-wide queries.
    - Utilities tightly associated with the class's private representation.
    - Callbacks requiring plain function-pointer compatibility, if the signature and ABI match.

    Do not use a static member merely as a namespace substitute when no class-private access or semantic association exists.
  source: 07_static_explicit_friend.md
- id: '07.6'
  topic: '`static`, `explicit`, and `friend`'
  question: What does namespace-scope `static` mean?
  answer: |-
    ## Short answer

    It gives the declared name internal linkage, restricting it to the translation unit. An unnamed namespace is generally the more idiomatic C++ choice.

    ## Detailed answer

    ```cpp
    // device.cpp
    static void reset_hardware() {
    }
    ```

    At namespace scope, `static` gives `reset_hardware` internal linkage. Other translation units cannot refer to that entity by an external declaration.

    Modern C++ often prefers an unnamed namespace:

    ```cpp
    namespace {
        void reset_hardware() {
        }

        class Helper {};
    }
    ```

    An unnamed namespace works naturally for functions, variables, and types.

    ### Do not confuse with static storage duration

    A namespace-scope object already has static storage duration even without `static`:

    ```cpp
    int global_counter;        // static storage duration, external linkage
    static int local_counter;  // static storage duration, internal linkage
    ```

    Here `static` changes linkage, not lifetime.

    ### Header caution

    A namespace-scope internal-linkage variable in a header may create one copy per translation unit. Use `inline` variables or other appropriate patterns when one program-wide entity is required.
  source: 07_static_explicit_friend.md
- id: '07.7'
  topic: '`static`, `explicit`, and `friend`'
  question: What problem does construct-on-first-use address?
  answer: |-
    ## Short answer

    A function-local static delays construction until first use, helping avoid cross-translation-unit static initialization-order problems.

    ## Detailed answer

    Objects with static storage duration undergo:

    1. Static initialization, including zero initialization and constant initialization where possible.
    2. Dynamic initialization when required.

    ### Cross-translation-unit order problem

    ```cpp
    // a.cpp
    Logger logger{configuration()};

    // b.cpp
    Configuration global_configuration{load()};
    ```

    The dynamic initialization order of non-local objects across translation units can be unspecified or only partially ordered. `logger` may access configuration before it is dynamically initialized.

    ### Construct on first use

    ```cpp
    Configuration& configuration() {
        static Configuration value = load();
        return value;
    }
    ```

    This delays construction until first use and gives a clear dependency at the call site.

    ### Destruction order

    Function-local statics are destroyed in reverse order of completed initialization within the relevant rules. Dependencies during program shutdown can still fail if one static uses another that has already been destroyed.

    Some process-lifetime services are intentionally never destroyed, but leaking by design needs documentation and may be unacceptable for test isolation or analysis tools.

    ### Embedded implications

    Static initialization can:

    - Increase startup time before `main`.
    - Access hardware before clocks/peripherals are ready.
    - Consume RAM for the program's entire execution.
    - Introduce hidden guards or locking.
    - Create initialization-order dependencies.

    Explicit platform startup sequencing is often clearer in firmware.
  source: 07_static_explicit_friend.md
- id: '07.8'
  topic: '`static`, `explicit`, and `friend`'
  question: What does `explicit` prevent?
  answer: |-
    ## Short answer

    It prevents the constructor or conversion operator from participating in unintended implicit conversions while still allowing appropriate direct or explicit use.

    ## Detailed answer

    A constructor that can be called with one argument may define a conversion:

    ```cpp
    class Temperature {
    public:
        Temperature(double celsius)
            : celsius_{celsius} {}

    private:
        double celsius_;
    };

    void log(Temperature temperature);

    log(25.0); // implicit conversion
    ```

    This conversion may be natural, but it also lets unrelated overloads accept values unexpectedly.

    Mark it explicit:

    ```cpp
    explicit Temperature(double celsius);
    ```

    Now:

    ```cpp
    log(Temperature{25.0});
    // log(25.0); // rejected
    ```

    ### More than one declared parameter

    This can still be a converting constructor:

    ```cpp
    explicit Range(int low, int high = 100);
    ```

    Only one argument is required at the call site.

    ### Multi-argument list conversion

    Modern C++ also permits list-based conversions involving constructors with multiple arguments in some contexts:

    ```cpp
    void draw(Point point);
    // draw({1, 2}); // allowed if Point(int, int) is not explicit
    ```
  source: 07_static_explicit_friend.md
- id: '07.9'
  topic: '`static`, `explicit`, and `friend`'
  question: Does `explicit` reject direct initialization?
  answer: |-
    ## Short answer

    No. `Type x{arg};` may call an explicit constructor; copy-initialization such as `Type x = arg;` may not use it as an implicit conversion.

    ## Detailed answer

    ```cpp
    class DeviceId {
    public:
        explicit DeviceId(int value);
    };
    ```

    Allowed:

    ```cpp
    DeviceId a(42);
    DeviceId b{42};
    auto c = DeviceId{42};
    ```

    Rejected:

    ```cpp
    // DeviceId d = 42;
    ```

    Copy-initialization considers conversion differently and cannot use an explicit constructor as an implicit conversion.

    ### Function calls

    ```cpp
    void connect(DeviceId id);

    // connect(42);             // rejected
    connect(DeviceId{42});      // valid
    ```

    ### Return statements

    ```cpp
    DeviceId make_id() {
        return DeviceId{42};
    }
    ```

    A bare `return 42;` would require an implicit conversion and is rejected when the constructor is explicit.
  source: 07_static_explicit_friend.md
- id: '07.10'
  topic: '`static`, `explicit`, and `friend`'
  question: What is a friend function?
  answer: |-
    ## Short answer

    A non-member function granted access to a class’s private and protected members.

    ## Detailed answer

    ```cpp
    class Box {
    public:
        explicit Box(int value) : value_{value} {}

        friend bool same_value(const Box& left, const Box& right);

    private:
        int value_;
    };

    bool same_value(const Box& left, const Box& right) {
        return left.value_ == right.value_;
    }
    ```

    `same_value` is not a member:

    ```cpp
    same_value(a, b);
    // a.same_value(b); // not implied
    ```

    It receives access permission to `Box`'s private and protected members.

    ### Declaration and definition

    A friend can be declared inside and defined outside, or defined inline inside the class:

    ```cpp
    class Box {
        friend bool operator==(const Box& a, const Box& b) {
            return a.value_ == b.value_;
        }

        int value_{};
    };
    ```

    The inline definition is a non-member function.
  source: 07_static_explicit_friend.md
- id: '07.11'
  topic: '`static`, `explicit`, and `friend`'
  question: Is friendship inherited, transitive, or reciprocal?
  answer: |-
    ## Short answer

    No. Each friendship grant is explicit and limited to the named friend.

    ## Detailed answer

    Friendship is:

    - **Not reciprocal:** if `A` befriends `B`, `A` does not automatically access `B`.
    - **Not transitive:** a friend of a friend gains nothing.
    - **Not inherited:** friends of a base are not automatically friends of derived-private state, and friends of a derived class do not automatically access base-private state beyond normal rules.
    - **Explicit:** the granting class controls access.

    ```cpp
    class A {
        friend class B;
    };

    // B can access A.
    // A cannot access B merely because of this.
    // Friends of B cannot access A.
    ```

    Access control and inheritance interactions can be subtle, but these four rules answer the common interview question.
  source: 07_static_explicit_friend.md
- id: '07.12'
  topic: '`static`, `explicit`, and `friend`'
  question: What is a hidden friend?
  answer: |-
    ## Short answer

    A friend function defined or declared inside a class and primarily found through ADL. It is useful for symmetric operators without broadly polluting ordinary lookup.

    ## Detailed answer

    A function declared and defined as a friend inside a class may be found primarily through ADL:

    ```cpp
    namespace units {
    class Distance {
    public:
        explicit Distance(int meters) : meters_{meters} {}

        friend bool operator==(const Distance& left,
                               const Distance& right) {
            return left.meters_ == right.meters_;
        }

    private:
        int meters_;
    };
    }
    ```

    Usage:

    ```cpp
    units::Distance a{10};
    units::Distance b{10};

    bool equal = (a == b);
    ```

    ADL associates the operands with namespace `units` and finds the hidden friend.

    ### Benefits

    - The function is closely documented with the type.
    - It gets symmetric access to both operands.
    - It does not broadly participate in unrelated unqualified lookup.
    - It can avoid public getters added only for operator implementation.

    ### Tradeoff

    Hidden-friend lookup surprises developers unfamiliar with ADL. Keep the pattern conventional and document important operations.
  source: 07_static_explicit_friend.md
- id: '08.1'
  topic: Storage, Scope, Lifetime, Ownership, and Temporaries
  question: How do scope, storage duration, lifetime, and ownership differ?
  answer: |-
    ## Short answer

    Scope is name visibility; storage duration is how long storage exists; lifetime is when a valid object exists in that storage; ownership identifies responsibility for releasing a resource.

    ## Detailed answer

    Consider:

    ```cpp
    std::unique_ptr<Device> make_device() {
        auto device = std::make_unique<Device>();
        return device;
    }
    ```

    There are two objects:

    1. The local `unique_ptr` object, whose name `device` has block scope and whose storage is automatic.
    2. The `Device` object, whose storage is dynamic and whose ownership is transferred to the returned `unique_ptr`.

    Returning transfers ownership; it does not move the local stack bytes into the caller.

    ### Another separation example

    ```cpp
    Device* observer = nullptr;

    {
        Device device;
        observer = &device;
    }
    ```

    After the block:

    - The name `device` is out of scope.
    - The automatic storage for its object is no longer active.
    - The `Device` lifetime has ended.
    - `observer` still exists.
    - `observer` is dangling and must not be dereferenced.

    The pointer's lifetime and the pointee's lifetime are independent.

    ### Concept diagram

    ```mermaid
    flowchart TD
        S[Scope: where a name is visible] --> O[Object]
        D[Storage duration: how long storage exists] --> O
        L[Lifetime: when an object exists in that storage] --> O
        W[Ownership: who releases or controls the resource] --> O
    ```
  source: 08_stack_heap_lifetime_scope_temporaries.md
- id: '08.2'
  topic: Storage, Scope, Lifetime, Ownership, and Temporaries
  question: What are C++’s four storage-duration categories?
  answer: |-
    ## Short answer

    Automatic, static, thread, and dynamic storage duration.

    ## Detailed answer

    C++ defines four storage-duration categories.

    ### Automatic storage duration

    Most local variables and parameters:

    ```cpp
    void process(int parameter) {
        Frame frame;
    }
    ```

    Their storage normally lasts until the enclosing block/function exits.

    ### Static storage duration

    Namespace-scope variables and objects declared static:

    ```cpp
    DeviceRegistry registry;

    void f() {
        static int calls{};
    }
    ```

    Their storage lasts for the program's execution.

    ### Thread storage duration

    ```cpp
    thread_local Error last_error;
    ```

    One object exists per thread for that thread's lifetime.

    ### Dynamic storage duration

    Storage obtained through allocation facilities:

    ```cpp
    auto device = std::make_unique<Device>();
    ```

    The pointee's storage lasts until the owning mechanism deallocates it.

    ### Subobjects

    A data member or base subobject normally has the storage duration of its complete containing object.
  source: 08_stack_heap_lifetime_scope_temporaries.md
- id: '08.3'
  topic: Storage, Scope, Lifetime, Ownership, and Temporaries
  question: Can a name be out of scope while its object remains alive?
  answer: |-
    ## Short answer

    Yes. A local static object persists after leaving its block, and a dynamic object can outlive the local pointer that originally referred to it.

    ## Detailed answer

    Scope controls name visibility, not necessarily lifetime.

    ```cpp
    int value = 1;

    void f() {
        int value = 2; // hides outer value
        {
            int value = 3; // hides function-local value
        }
    }
    ```

    Common scopes:

    - Block scope.
    - Function parameter scope.
    - Class scope.
    - Namespace scope.
    - Template parameter scope.
    - Enumeration scope for scoped enums.

    ### Name out of scope, object still alive

    ```cpp
    Device& device() {
        static Device instance;
        return instance;
    }
    ```

    The local name `instance` is visible only inside the function, while the object persists.

    ### Object dead while pointer name remains visible

    ```cpp
    Device* pointer;

    {
        Device local;
        pointer = &local;
    }

    // pointer is visible but dangles
    ```
  source: 08_stack_heap_lifetime_scope_temporaries.md
- id: '08.4'
  topic: Storage, Scope, Lifetime, Ownership, and Temporaries
  question: Where does a `unique_ptr` live?
  answer: |-
    ## Short answer

    The `unique_ptr` object may have automatic storage while the object it owns has dynamic storage. They are separate objects with linked ownership lifetimes.

    ## Detailed answer

    The smart-pointer object and its pointee have independent storage durations. A local `std::unique_ptr<T>` usually has automatic storage, while the object created by `std::make_unique<T>()` has dynamic storage. Moving the `unique_ptr` transfers ownership of that same pointee; it does not move the allocation itself.

    ```cpp
    auto p = std::make_unique<Device>(); // p: automatic; Device: dynamic
    auto q = std::move(p);               // q now owns the Device
    ```

    A `unique_ptr` can itself be a data member, a static object, or dynamically allocated, so saying that it “lives on the stack” is not generally correct.
  source: 08_stack_heap_lifetime_scope_temporaries.md
- id: '08.5'
  topic: Storage, Scope, Lifetime, Ownership, and Temporaries
  question: Why should `new`/`delete` not be mixed with `malloc`/`free`?
  answer: |-
    ## Short answer

    They use different allocation/lifetime mechanisms. `new` constructs and `delete` destroys; `malloc` and `free` only manage raw storage. Mismatching them is undefined behavior.

    ## Detailed answer

    ### `new`

    ```cpp
    Widget* widget = new Widget{arguments};
    ```

    Conceptually:

    1. Obtain suitably sized/aligned storage.
    2. Construct `Widget`.
    3. Return a typed pointer.

    ### `delete`

    ```cpp
    delete widget;
    ```

    Conceptually:

    1. Run the destructor.
    2. Deallocate storage.

    Arrays must use matching syntax:

    ```cpp
    Widget* widgets = new Widget[count];
    delete[] widgets;
    ```

    Mismatching `delete` and `delete[]` is undefined behavior.

    ### `malloc` and `free`

    ```cpp
    void* storage = std::malloc(sizeof(Widget));
    std::free(storage);
    ```

    `malloc` obtains raw storage but does not ordinarily construct a C++ class object. `free` does not run a destructor.

    Do not mix families:

    ```cpp
    // free(new Widget);        // wrong
    // delete malloc_storage;   // wrong
    ```

    ### Prefer higher-level RAII

    ```cpp
    auto widget = std::make_unique<Widget>();
    std::vector<Widget> widgets(count);
    ```

    Direct manual allocation is mainly needed when implementing containers, allocators, pools, low-level runtimes, or placement/lifetime facilities.
  source: 08_stack_heap_lifetime_scope_temporaries.md
- id: '08.6'
  topic: Storage, Scope, Lifetime, Ownership, and Temporaries
  question: Does a raw pointer, reference, iterator, span, or view extend lifetime?
  answer: |-
    ## Short answer

    No. These are borrowed handles; their source object must remain alive and valid.

    ## Detailed answer

    Non-owning handles include:

    - Raw pointers.
    - References.
    - Iterators.
    - `std::span`.
    - `std::string_view`.
    - Reference wrappers.
    - Many library-specific views.

    They do not keep the source alive.

    ### Dangling pointer

    ```cpp
    int* pointer;
    {
        int value = 10;
        pointer = &value;
    }
    // *pointer is invalid
    ```

    ### Dangling reference

    ```cpp
    const int& bad_reference() {
        int value = 10;
        return value;
    }
    ```

    ### Dangling view

    ```cpp
    std::string_view view = std::string{"temporary"};
    // temporary string is already destroyed after the statement
    ```

    The view may still hold an address and length, but the characters no longer exist.

    ### Use-after-free

    ```cpp
    int* pointer = new int{10};
    delete pointer;
    // *pointer is invalid
    ```

    Setting one pointer to null does not repair other aliases:

    ```cpp
    int* alias = pointer;
    pointer = nullptr;
    // alias still dangles
    ```
  source: 08_stack_heap_lifetime_scope_temporaries.md
- id: '08.7'
  topic: Storage, Scope, Lifetime, Ownership, and Temporaries
  question: Why is returning a reference to a local object wrong?
  answer: |-
    ## Short answer

    The local object’s lifetime ends when the function returns, leaving the returned reference dangling.

    ## Detailed answer

    ### Invalid local return

    ```cpp
    const std::string& name() {
        std::string local = "sensor";
        return local; // dangling
    }
    ```

    The local dies when the function returns.

    ### Valid member return with contract

    ```cpp
    class Device {
    public:
        const std::string& name() const {
            return name_;
        }

    private:
        std::string name_;
    };
    ```

    The reference remains valid only while:

    - The `Device` remains alive.
    - The member is not replaced or invalidated in a way that ends that referenced state.
    - Concurrent mutation does not introduce a race.

    ### Return by value

    ```cpp
    std::string name() const {
        return name_;
    }
    ```

    This gives the caller independent ownership and often uses efficient copy/move/elision. Prefer it when lifetime independence and encapsulation outweigh copy cost.

    ### Static return

    A reference to a static object can remain valid until program termination, but global shared state and destruction-order concerns remain.
  source: 08_stack_heap_lifetime_scope_temporaries.md
- id: '08.8'
  topic: Storage, Scope, Lifetime, Ownership, and Temporaries
  question: How long do most temporaries live?
  answer: |-
    ## Short answer

    Until the end of the full expression in which they were created, unless a specific lifetime-extension rule applies.

    ## Detailed answer

    A temporary is often created as an intermediate result:

    ```cpp
    std::string text = make_prefix() + make_suffix();
    ```

    The addition may produce a temporary string used to initialize `text`.

    Most temporaries are destroyed at the end of the **full expression**, usually the statement:

    ```cpp
    consume(Widget{}); // temporary survives through consume, then is destroyed
    ```

    ### Parameter binding

    ```cpp
    void print(const std::string& text);

    print("hello");
    ```

    A temporary `std::string` can be constructed and bound to the const reference. It survives until the full expression containing the call ends.

    The callee must not store a reference for later:

    ```cpp
    const std::string* saved{};

    void save(const std::string& text) {
        saved = &text;
    }

    save(std::string{"temporary"});
    // saved now dangles
    ```

    ### Materialization and optimization

    Modern C++ prvalue rules can construct results directly in their final destination. Even when no temporary object is materialized at runtime, source-level lifetime semantics remain important.
  source: 08_stack_heap_lifetime_scope_temporaries.md
- id: '08.9'
  topic: Storage, Scope, Lifetime, Ownership, and Temporaries
  question: When can a reference extend a temporary’s lifetime?
  answer: |-
    ## Short answer

    Certain direct bindings, such as a local `const T&` bound directly to a temporary, extend it to the reference’s lifetime. Passing through or returning another reference does not re-extend it.

    ## Detailed answer

    Directly binding a local reference can extend a temporary's lifetime:

    ```cpp
    const std::string& text = std::string{"hello"};
    ```

    The temporary string lives as long as `text`.

    Rvalue references can also extend lifetime in direct local binding:

    ```cpp
    std::string&& text = std::string{"hello"};
    ```

    ### No re-extension through another reference

    ```cpp
    const std::string& identity(const std::string& value) {
        return value;
    }

    const std::string& ref = identity(std::string{"hello"});
    ```

    The temporary is bound to the function parameter only for the call's full expression. Returning the reference does not extend the temporary again. `ref` dangles after the initialization statement.

    ### Returning a temporary by reference

    ```cpp
    const std::string& bad() {
        return std::string{"hello"};
    }
    ```

    The temporary does not survive as a valid returned object. Return by value instead.

    ### Prefer ownership over memorizing edge cases

    When a reference or view may escape a full expression, use an owning value unless lifetime is unambiguous.
  source: 08_stack_heap_lifetime_scope_temporaries.md
- id: '08.10'
  topic: Storage, Scope, Lifetime, Ownership, and Temporaries
  question: What commonly invalidates container handles?
  answer: |-
    ## Short answer

    Reallocation, erasure, and container-specific structural changes. The exact rules differ by container and operation and must be checked.

    ## Detailed answer

    A live container does not guarantee that every pointer/reference/iterator into it remains valid.

    ### Vector reallocation

    ```cpp
    std::vector<int> values;
    values.reserve(1);
    values.push_back(10);

    int& first = values[0];
    values.push_back(20); // may reallocate

    // first may now dangle
    ```

    Reallocation moves/copies elements to new storage and invalidates pointers, references, and iterators to old elements.

    ### Erasure

    Erasing from a vector invalidates iterators/references at or after the erased position. Other containers have different rules.

    ### `reserve` versus `resize`

    - `reserve(n)` changes capacity without changing element count.
    - `resize(n)` changes size and constructs/destroys elements.

    Reserving sufficient capacity can prevent reallocation until capacity is exceeded, but it is not a universal lifetime guarantee.

    ### Unordered containers

    Rehashing invalidates iterators, while references/pointers to elements have different standard guarantees. Always check the specific operation/container rules rather than generalizing.
  source: 08_stack_heap_lifetime_scope_temporaries.md
- id: '08.11'
  topic: Storage, Scope, Lifetime, Ownership, and Temporaries
  question: Why are reference-capturing lambdas dangerous asynchronously?
  answer: |-
    ## Short answer

    The closure may execute after captured local objects have died, leaving dangling references. Capture owned values or establish an explicit shared-lifetime strategy.

    ## Detailed answer

    ### Reference capture

    ```cpp
    std::function<void()> make_callback() {
        int count = 0;

        return [&count] {
            ++count;
        }; // returned lambda holds dangling reference
    }
    ```

    Capture by value when the callback must own independent state:

    ```cpp
    return [count]() mutable {
        ++count;
    };
    ```

    ### Capturing `this`

    ```cpp
    class Device {
    public:
        auto callback() {
            return [this] {
                poll();
            };
        }
    };
    ```

    The lambda does not keep the object alive. Calling it after `Device` destruction is invalid.

    Shared lifetime can be explicit:

    ```cpp
    auto self = shared_from_this();
    return [self] {
        self->poll();
    };
    ```

    This requires an appropriate shared-ownership design and can create cycles if callbacks are stored by the same object. A `weak_ptr` may be better.

    ### Detached/asynchronous work

    A thread or asynchronous operation can easily outlive locals:

    ```cpp
    std::thread worker([&local] {
        use(local);
    });
    ```

    Joining before local destruction may make it safe. `std::jthread` helps tie joining to scope, but captured object lifetimes still require review.
  source: 08_stack_heap_lifetime_scope_temporaries.md
- id: '08.12'
  topic: Storage, Scope, Lifetime, Ownership, and Temporaries
  question: What are the major ownership models?
  answer: |-
    ## Short answer

    Value ownership, exclusive ownership, shared ownership, and non-owning borrowing. The type system should make the chosen model visible.

    ## Detailed answer

    ### Direct value ownership

    ```cpp
    Device device;
    ```

    The containing scope/object owns the value directly.

    ### Exclusive dynamic ownership

    ```cpp
    std::unique_ptr<Device> device;
    ```

    One owner; movable, not copyable.

    ### Shared ownership

    ```cpp
    std::shared_ptr<Device> device;
    ```

    Reference-counted ownership. The object dies when the last owning shared pointer dies.

    Costs include allocation/control block, reference-count updates, and cycle risk.

    ### Weak observation

    ```cpp
    std::weak_ptr<Device> observer;
    ```

    Does not extend lifetime. Call `lock()` to obtain temporary shared ownership if the object still exists.

    ### Borrowing

    ```cpp
    Device& required;
    Device* optional;
    std::span<const std::byte> bytes;
    ```

    No ownership. The source must outlive every use.

    ### Concept diagram

    ```mermaid
    flowchart TD
        A[Resource] --> B[Value ownership]
        A --> C[Exclusive ownership: unique_ptr]
        A --> D[Shared ownership: shared_ptr]
        A --> E[Non-owning observation: reference pointer span view]
        D --> F[weak_ptr observes without extending lifetime]
    ```
  source: 08_stack_heap_lifetime_scope_temporaries.md
- id: '09.1'
  topic: Modern C++ Language Features and Iteration
  question: Does `auto` mean dynamic typing?
  answer: |-
    ## Short answer

    No. The compiler deduces one static type at compile time.

    ## Detailed answer

    `auto` asks the compiler to deduce a static type from the initializer:

    ```cpp
    auto count = 10;        // int
    auto voltage = 3.3;     // double
    auto name = std::string{"imu"}; // std::string
    ```

    The variable does not change type later:

    ```cpp
    auto value = 10; // int
    value = 20;      // valid
    // value = "text"; // error
    ```

    ### Why use it?

    `auto` is valuable when:

    - The type is obvious from the initializer.
    - The exact type is verbose.
    - The type is an iterator or lambda closure.
    - Template types may change while the intended operation remains the same.
    - Repeating the type creates opportunities for accidental conversions.

    ```cpp
    auto iterator = devices.find(id);
    auto owner = std::make_unique<Device>();
    auto callback = [](int value) { return value * 2; };
    ```

    ### Avoid obscuring important semantics

    This may hide too much:

    ```cpp
    auto result = perform_operation();
    ```

    If ownership, units, precision, or cost are not obvious, an explicit type or clearer function name may communicate more.

    ```cpp
    std::unique_ptr<Device> device = create_device();
    Milliseconds timeout = read_timeout();
    ```

    ### Avoid accidental conversion from repeated types

    ```cpp
    std::vector<std::uint64_t> values;
    auto size = values.size(); // correct container size_type
    ```

    An explicit `int` could narrow or create signed/unsigned issues:

    ```cpp
    int size = values.size(); // possible narrowing
    ```
  source: 09_modern_cpp_language_features_and_iteration.md
- id: '09.2'
  topic: Modern C++ Language Features and Iteration
  question: What does plain `auto` usually discard?
  answer: |-
    ## Short answer

    References and top-level const. Add `&`, `const &`, `*`, or `&&` when those semantics are required.

    ## Detailed answer

    Plain `auto` normally drops references and top-level const:

    ```cpp
    const int original = 42;
    const int& reference = original;

    auto a = original;  // int
    auto b = reference; // int
    ```

    Both `a` and `b` are independent mutable integers.

    ### Preserve reference semantics

    ```cpp
    auto& c = reference;       // const int&
    const auto& d = original;  // const int&
    ```

    `auto&` preserves reference binding, and low-level/referred-to const participates in deduction.

    ### Mutable reference

    ```cpp
    std::vector<int> values{1, 2, 3};

    for (auto& value : values) {
        value *= 2;
    }
    ```

    ### Pointer deduction

    ```cpp
    const int* pointer = &original;

    auto p1 = pointer;  // const int*
    auto* p2 = pointer; // const int*
    ```

    `auto*` documents that a pointer is expected and rejects a non-pointer initializer.

    ### `auto&&`

    Outside template discussions, `auto&&` uses forwarding-reference deduction:

    ```cpp
    int value = 10;

    auto&& a = value; // int&
    auto&& b = 20;    // int&&
    ```

    Reference collapsing produces:

    ```text
    T&  + &  -> T&
    T&  + && -> T&
    T&& + &  -> T&
    T&& + && -> T&&
    ```

    This makes `auto&&` useful when generic code should bind whatever category an expression provides.
  source: 09_modern_cpp_language_features_and_iteration.md
- id: '09.3'
  topic: Modern C++ Language Features and Iteration
  question: What is the brace-deduction trap with `auto`?
  answer: |-
    ## Short answer

    `auto x{1}` deduces `int`, while `auto x = {1}` normally deduces `std::initializer_list<int>`.

    ## Detailed answer

    These forms are different:

    ```cpp
    auto a{1};    // int
    auto b = {1}; // std::initializer_list<int>
    auto c = {1, 2, 3}; // std::initializer_list<int>
    ```

    This is invalid:

    ```cpp
    // auto d{1, 2}; // direct-list auto requires one element
    ```

    Elements of an initializer list must have a compatible deduced type:

    ```cpp
    // auto values = {1, 2.5}; // cannot deduce one element type
    ```

    ### Accidental copies

    ```cpp
    const auto item = container.front(); // copy
    const auto& item_ref = container.front(); // borrow
    ```

    A copy may be correct if the element must remain valid after container mutation. A reference may be correct if avoiding the copy matters and lifetime is safe.

    ### Proxy types

    Some APIs return proxy objects rather than real references:

    ```cpp
    std::vector<bool> bits{true, false};

    auto bit = bits[0]; // proxy type, not necessarily bool
    ```

    `auto` accurately preserves the returned proxy type, which can surprise code expecting a value. Request the semantic value explicitly when desired:

    ```cpp
    bool bit_value = bits[0];
    ```

    ### `auto` can hide narrowing or precision decisions

    ```cpp
    auto duration = 1s; // good if chrono literal and type are known
    auto number = calculate(); // inspect whether float/double/integer matters
    ```

    Use strong types and meaningful names rather than relying on `auto` to solve semantic ambiguity.
  source: 09_modern_cpp_language_features_and_iteration.md
- id: '09.4'
  topic: Modern C++ Language Features and Iteration
  question: When should `decltype` or `decltype(auto)` be used?
  answer: |-
    ## Short answer

    When exact declaration/expression type rules matter, especially preserving references in generic forwarding or wrapper code. Parenthesization can change `decltype` results.

    ## Detailed answer

    `decltype` obtains a type without evaluating the expression.

    ```cpp
    int value = 10;
    const int& reference = value;

    decltype(value) a = 20;     // int
    decltype(reference) b = value; // const int&
    ```

    ### Special rule for unparenthesized names

    For an unparenthesized identifier/member access, `decltype(name)` produces the declared type.

    For other expressions, value category affects the result:

    ```cpp
    decltype((value)) c = value; // int&
    ```

    Because `(value)` is an lvalue expression, `decltype((value))` is `int&`.

    A useful summary:

    ```text
    decltype(expression)
    lvalue expression  -> T&
    xvalue expression  -> T&&
    prvalue expression -> T
    ```

    except for the special unparenthesized-name rule.

    ### `decltype(auto)`

    `decltype(auto)` uses `decltype` rules for deduction:

    ```cpp
    decltype(auto) get_reference(int& value) {
        return (value); // returns int&
    }
    ```

    Without parentheses:

    ```cpp
    decltype(auto) get_value_member() {
        return object.member; // special declared-type rule may apply
    }
    ```

    This power can accidentally return dangling references. Use it only when exact propagation is intended and reviewed.

    ### `auto` return type

    ```cpp
    auto get_value() {
        return object.member; // deduces by value
    }
    ```

    Plain `auto` return deduction generally drops references similarly to variable deduction.

    ### Trailing return type

    ```cpp
    template<class A, class B>
    auto add(const A& a, const B& b) -> decltype(a + b) {
        return a + b;
    }
    ```

    This was especially important before C++14 return deduction and remains useful when the return type needs explicit expression-dependent documentation.
  source: 09_modern_cpp_language_features_and_iteration.md
- id: '09.5'
  topic: Modern C++ Language Features and Iteration
  question: How do common range-for declarations differ?
  answer: |-
    ## Short answer

    `auto x` copies; `auto& x` mutates the element; `const auto& x` reads without copying; `auto&& x` is a generic binding useful for proxy and range element types.

    ## Detailed answer

    A range-based loop iterates through elements:

    ```cpp
    std::vector<int> values{10, 20, 30};

    for (int value : values) {
        std::cout << value << '\n';
    }
    ```

    The syntax is:

    ```cpp
    for (item_declaration : range_expression) {
        body
    }
    ```

    Examples of ranges include:

    - Built-in arrays.
    - Standard containers.
    - Types with suitable `begin()` and `end()`.
    - Types with free `begin`/`end` found through lookup.
    - C++20 range views.

    ### Why use it?

    It expresses “for every element” without exposing irrelevant iterator/index mechanics.

    ```cpp
    for (const auto& sensor : sensors) {
        sensor.poll();
    }
    ```

    This is clearer than:

    ```cpp
    for (std::size_t i = 0; i < sensors.size(); ++i) {
        sensors[i].poll();
    }
    ```

    when the index is never used.

    ### It is not always superior

    Use another loop when you need:

    - The numeric index.
    - A stride other than one.
    - Simultaneous traversal of multiple ranges.
    - Manual iterator control.
    - Erasure during traversal.
    - Reverse iteration without a range adaptor.
    - Early manipulation of begin/end positions.

    This choice controls copying, mutation, constness, and proxy behavior.

    ### By value

    ```cpp
    for (auto value : values) {
        process(value);
    }
    ```

    Each iteration initializes a local value. Use this when:

    - Elements are cheap to copy.
    - You intentionally need an independent copy.
    - The algorithm modifies only the copy.
    - A stable local value is needed despite later container changes.

    ### Mutable reference

    ```cpp
    for (auto& value : values) {
        value.normalize();
    }
    ```

    Use when modifying actual elements.

    ### Const reference

    ```cpp
    for (const auto& value : values) {
        inspect(value);
    }
    ```

    This is the common default for large read-only elements.

    ### Forwarding/generic reference

    ```cpp
    for (auto&& value : range) {
        process(value);
    }
    ```

    This adapts to the range's element reference type and handles proxy/reference-like results. It is common in generic range code. It does not automatically mean the function should move from every element.

    ### Const by value

    ```cpp
    for (const auto value : values) {
    }
    ```

    This still copies each element; const only prevents changing the local copy. It rarely provides an advantage over `auto value` or `const auto& value`.

    ### Explicit type danger

    ```cpp
    std::map<std::string, int> counts;

    for (const std::pair<std::string, int>& item : counts) {
    }
    ```

    The map's actual value type is:

    ```cpp
    std::pair<const std::string, int>
    ```

    The mismatched explicit type may cause a temporary conversion and copy each iteration. Prefer:

    ```cpp
    for (const auto& item : counts) {
    }
    ```
  source: 09_modern_cpp_language_features_and_iteration.md
- id: '09.6'
  topic: Modern C++ Language Features and Iteration
  question: When is an index loop preferable to a range-for?
  answer: |-
    ## Short answer

    When the index, a stride, coordinated traversal of multiple ranges, or precise mutation/erasure control is part of the algorithm.

    ## Detailed answer

    Each form communicates different needs.

    ### Index loop

    ```cpp
    for (std::size_t index = 0; index < values.size(); ++index) {
        use(index, values[index]);
    }
    ```

    Best when:

    - The index is part of the operation.
    - Random access is required.
    - Traversing multiple indexed arrays.
    - Applying a stride or neighborhood.
    - Interfacing with index-based APIs.

    For reverse loops, unsigned underflow is a common bug:

    ```cpp
    // for (std::size_t i = values.size() - 1; i >= 0; --i) // wrong
    ```

    Use reverse iterators, reverse views, or a safe pattern.

    C++20 provides `std::ssize` for a signed size when signed arithmetic is appropriate.

    ### Iterator loop

    ```cpp
    for (auto iterator = values.begin(); iterator != values.end();) {
        if (should_remove(*iterator)) {
            iterator = values.erase(iterator);
        } else {
            ++iterator;
        }
    }
    ```

    Best for explicit iterator operations, erasure, subranges, and non-indexable containers.

    ### Range loop

    ```cpp
    for (const auto& value : values) {
        process(value);
    }
    ```

    Best for direct element traversal.

    ### Algorithm

    ```cpp
    std::ranges::for_each(values, process);
    ```

    Best when the operation composes with other algorithms or the algorithm name communicates intent.
  source: 09_modern_cpp_language_features_and_iteration.md
- id: '09.7'
  topic: Modern C++ Language Features and Iteration
  question: What can structured bindings decompose?
  answer: |-
    ## Short answer

    Arrays, tuple-like types, and eligible class objects. Use `auto&` or `const auto&` when you need references rather than copies.

    ## Detailed answer

    Structured bindings decompose an object:

    ```cpp
    std::pair<int, std::string> entry{42, "camera"};

    auto [id, name] = entry;
    ```

    This creates value-like bindings according to the declaration.

    ### Avoid copies with references

    ```cpp
    auto& [id, name] = entry;
    name = "imu"; // modifies entry.second
    ```

    Read-only borrowing:

    ```cpp
    const auto& [id, name] = entry;
    ```

    ### Maps

    ```cpp
    for (const auto& [key, value] : counts) {
        std::cout << key << ": " << value << '\n';
    }
    ```

    For a map, `key` is effectively const because keys cannot be modified in place without breaking ordering/hash invariants.

    To modify mapped values:

    ```cpp
    for (auto& [key, value] : counts) {
        ++value;
    }
    ```

    ### Arrays and tuple-like types

    ```cpp
    int coordinates[2]{10, 20};
    auto [x, y] = coordinates;
    ```

    `std::tuple`, `std::pair`, `std::array`, and user-defined tuple-like types can participate.

    ### `if` with structured binding

    ```cpp
    if (auto [iterator, inserted] = map.insert({key, value}); inserted) {
        // inserted successfully
    }
    ```

    The bindings remain scoped to the `if` statement.
  source: 09_modern_cpp_language_features_and_iteration.md
- id: '09.8'
  topic: Modern C++ Language Features and Iteration
  question: What lifetime risk exists with lambda captures?
  answer: |-
    ## Short answer

    Reference captures and captured `this` can dangle if the closure outlives the referenced object. Capturing `this` does not copy the whole object unless explicitly requested through an appropriate capture.

    ## Detailed answer

    A lambda may outlive captured references:

    ```cpp
    std::function<void()> make_callback() {
        int value = 10;

        return [&value] {
            std::cout << value;
        }; // dangling reference after return
    }
    ```

    Capture by value for independent lifetime:

    ```cpp
    return [value] {
        std::cout << value;
    };
    ```

    ### Capturing `this`

    ```cpp
    class Device {
    public:
        auto callback() {
            return [this] {
                poll();
            };
        }

    private:
        void poll();
    };
    ```

    `[this]` stores a pointer; it does not copy or own the `Device`. The callback dangles after the object dies.

    `[*this]` captures an object copy:

    ```cpp
    return [*this] {
        poll();
    };
    ```

    This requires the object to be copyable and gives snapshot-like semantics that may still be inappropriate for resource owners.

    ### Shared and weak lifetime

    An asynchronous callback can capture shared ownership:

    ```cpp
    auto self = shared_from_this();

    return [self] {
        self->poll();
    };
    ```

    This keeps the object alive but can create ownership cycles. A `weak_ptr` capture plus `lock()` often represents observation more accurately.
  source: 09_modern_cpp_language_features_and_iteration.md
- id: '09.9'
  topic: Modern C++ Language Features and Iteration
  question: Why prefer a named algorithm over a handwritten loop?
  answer: |-
    ## Short answer

    When it directly expresses intent—such as find, sort, transform, or count—it reduces indexing errors and communicates the operation more clearly.

    ## Detailed answer

    The standard library often names the intent:

    ```cpp
    auto iterator = std::find(values.begin(), values.end(), target);
    std::sort(values.begin(), values.end());
    auto total = std::accumulate(values.begin(), values.end(), 0);
    ```

    C++20 ranges reduce iterator pairs:

    ```cpp
    auto iterator = std::ranges::find(values, target);
    std::ranges::sort(values);
    ```

    ### Why algorithms help

    - They communicate intent.
    - Iterator/range boundaries are centralized.
    - They reduce indexing errors.
    - Library implementations may optimize well.
    - They compose with predicates and projections.

    ### When a loop is clearer

    Use a loop when:

    - Control flow is complex.
    - Multiple effects occur.
    - Early exits have domain meaning.
    - State transitions are clearer procedurally.
    - Algorithm composition becomes harder to read than the operation.

    Do not replace readable loops with an opaque chain merely because ranges are newer.

    ### Projection example

    ```cpp
    std::ranges::sort(devices, {}, &Device::id);
    ```

    This sorts using each device's ID without a custom comparison lambda.
  source: 09_modern_cpp_language_features_and_iteration.md
- id: '09.10'
  topic: Modern C++ Language Features and Iteration
  question: What are the main benefits and risks of C++20 views?
  answer: |-
    ## Short answer

    Views are lazy and composable with little copying, but many are non-owning. Their source range and captured state must outlive use.

    ## Detailed answer

    Views provide lazy transformations:

    ```cpp
    auto even_squares =
        values
        | std::views::filter([](int value) { return value % 2 == 0; })
        | std::views::transform([](int value) { return value * value; });

    for (int value : even_squares) {
        process(value);
    }
    ```

    ### Lazy evaluation

    The filter and transform usually run as elements are requested. They do not necessarily allocate a new container.

    ### Views often borrow

    A view may refer to an existing range:

    ```cpp
    auto filtered = values | std::views::filter(predicate);
    ```

    If `values` dies, `filtered` may dangle.

    Some adaptors own/move an rvalue range depending on the adaptor and standard version, but never assume lifetime without inspecting the view type and construction.

    ### Mutation

    A view can expose mutable elements if the underlying range and view permit it. "View" does not inherently mean const.

    ### Complexity

    Lazy composition can avoid temporary allocations, but repeated traversal may repeat predicate/transformation work. Document single-pass versus multi-pass expectations.
  source: 09_modern_cpp_language_features_and_iteration.md
- id: '09.11'
  topic: Modern C++ Language Features and Iteration
  question: Why is `nullptr` better than `0` or `NULL`?
  answer: |-
    ## Short answer

    It has a dedicated null-pointer type, avoids integer-overload ambiguity, and expresses pointer intent.

    ## Detailed answer

    Before C++11, code used `0` or `NULL`:

    ```cpp
    void select(int);
    void select(Device*);

    select(0); // selects int
    ```

    `nullptr` has type `std::nullptr_t` and expresses pointer intent:

    ```cpp
    select(nullptr); // selects Device*
    ```

    It converts to pointer and pointer-to-member types, but not to arbitrary integer parameters.

    ### Generic code

    ```cpp
    auto pointer = nullptr; // std::nullptr_t
    ```

    This is not `Device*`. If the pointer type matters:

    ```cpp
    Device* pointer = nullptr;
    ```

    ### Avoid C-style null macros in C++ APIs

    Use `nullptr` consistently for:

    - Initialization.
    - Resetting non-owning pointers.
    - Null comparisons.
    - Optional pointer arguments.

    Smart pointers usually compare/reset naturally:

    ```cpp
    std::unique_ptr<Device> device;
    if (!device) {
    }
    ```
  source: 09_modern_cpp_language_features_and_iteration.md
- id: '09.12'
  topic: Modern C++ Language Features and Iteration
  question: What does `enum class` improve?
  answer: |-
    ## Short answer

    It scopes enumerator names and prevents unintended implicit conversion to integers, improving type safety.

    ## Detailed answer

    Unscoped enum values enter the surrounding scope and convert implicitly to integers:

    ```cpp
    enum Color {
        Red,
        Green
    };
    ```

    Scoped enumeration:

    ```cpp
    enum class Color : std::uint8_t {
        Red,
        Green
    };
    ```

    Usage requires qualification:

    ```cpp
    Color color = Color::Red;
    ```

    There is no ordinary implicit integer conversion:

    ```cpp
    // int value = Color::Red; // error
    ```

    Use an explicit cast when needed:

    ```cpp
    auto raw = static_cast<std::uint8_t>(color);
    ```

    ### Benefits

    - Prevents enumerator name collisions.
    - Prevents accidental arithmetic/comparison with integers.
    - Allows explicit underlying type.
    - Improves overload type safety.

    ### Flags

    Bitmask enums need explicitly defined operators:

    ```cpp
    enum class Permission : unsigned {
        Read  = 1u << 0,
        Write = 1u << 1
    };

    constexpr Permission operator|(Permission left, Permission right) {
        return static_cast<Permission>(
            static_cast<unsigned>(left) |
            static_cast<unsigned>(right));
    }
    ```

    Do not assume every enum should permit bitwise operations.
  source: 09_modern_cpp_language_features_and_iteration.md
- id: '09.13'
  topic: Modern C++ Language Features and Iteration
  question: How do `constexpr`, `consteval`, and `constinit` differ?
  answer: |-
    ## Short answer

    `constexpr` permits compile-time evaluation when requirements are met; `consteval` requires compile-time calls; `constinit` requires static initialization of a static/thread object but does not make it const.

    ## Detailed answer

    ### `constexpr`

    A constexpr object is a constant-expression value:

    ```cpp
    constexpr std::size_t buffer_size = 128;
    std::array<std::byte, buffer_size> buffer;
    ```

    A constexpr function can execute at compile time when used with suitable inputs/context:

    ```cpp
    constexpr int square(int value) {
        return value * value;
    }

    constexpr int compile_time = square(5);

    int runtime_input = read_input();
    int runtime_result = square(runtime_input);
    ```

    The second call can execute at runtime.

    ### `consteval`

    ```cpp
    consteval std::uint32_t make_id(unsigned major, unsigned minor) {
        return major * 1000u + minor;
    }

    constexpr auto id = make_id(2, 5);
    ```

    Every potentially evaluated call must produce a compile-time result.

    ### `constinit`

    ```cpp
    constinit int startup_state = 0;
    ```

    `constinit` applies to static/thread storage and requires static initialization, helping avoid dynamic initialization-order problems. It does not make the object immutable:

    ```cpp
    startup_state = 1; // allowed
    ```

    ### Comparison

    | Keyword | Main guarantee |
    |---|---|
    | `const` | No mutation through this object/access path |
    | `constexpr` object | Constant-expression value |
    | `constexpr` function | May run at compile time |
    | `consteval` function | Must run at compile time |
    | `constinit` variable | Must be statically initialized |
  source: 09_modern_cpp_language_features_and_iteration.md
- id: '09.14'
  topic: Modern C++ Language Features and Iteration
  question: What does `noexcept` communicate?
  answer: |-
    ## Short answer

    The function promises not to let exceptions escape. Violating the promise calls `std::terminate`; accurate `noexcept` can also enable safer/faster container moves.

    ## Detailed answer

    A function can promise not to let exceptions escape:

    ```cpp
    void reset() noexcept {
    }
    ```

    If an exception escapes a `noexcept` function, the program calls `std::terminate`.

    ### Query form

    ```cpp
    static_assert(noexcept(reset()));
    ```

    Conditional specification:

    ```cpp
    template<class T>
    void swap_values(T& a, T& b)
        noexcept(noexcept(std::swap(a, b))) {
        std::swap(a, b);
    }
    ```

    ### Move operations

    Containers often prefer a `noexcept` move constructor during reallocation:

    ```cpp
    Widget(Widget&&) noexcept;
    ```

    If moving might throw and copying is available, a vector may copy to preserve its strong exception guarantee.

    ### Destructors

    Destructors are normally non-throwing. Allowing an exception to escape during stack unwinding can terminate the process.

    ### Embedded code

    `noexcept` does not mean:

    - No failure.
    - No blocking.
    - Constant-time behavior.
    - No allocation.
    - No error code.

    It only concerns exception escape.
  source: 09_modern_cpp_language_features_and_iteration.md
- id: '09.15'
  topic: Modern C++ Language Features and Iteration
  question: What do `optional`, `variant`, `span`, and `string_view` express?
  answer: |-
    ## Short answer

    `optional` expresses possible absence; `variant` a closed set of alternatives; `span` a borrowed contiguous range; `string_view` a borrowed character sequence. The view types do not own their data.

    ## Detailed answer

    ### `std::optional`

    Represents a value that may be absent:

    ```cpp
    std::optional<Device> find_device(DeviceId id);
    ```

    Usage:

    ```cpp
    if (auto device = find_device(id)) {
        device->start();
    }
    ```

    Tradeoffs:

    - Expresses absence without sentinel values.
    - Stores the value inline in the optional object.
    - Does not itself explain why the value is absent.
    - Copy/move cost follows the contained type.

    ### `std::variant`

    Represents one of a fixed set of types:

    ```cpp
    using Message = std::variant<Status, Command, Error>;
    ```

    Visit safely:

    ```cpp
    std::visit([](const auto& message) {
        process(message);
    }, value);
    ```

    It is a type-safe alternative to untagged unions and some inheritance designs.

    ### `std::any`

    Stores a value of almost any copyable type with runtime type checking. It trades compile-time exhaustiveness for flexibility and is less common in performance-sensitive interfaces.

    ### `std::expected` (C++23)

    Represents either a success value or an error value:

    ```cpp
    std::expected<Device, Error> create_device();
    ```

    It communicates failure reasons more directly than `optional`.

    ### `std::span`

    A non-owning view over contiguous elements:

    ```cpp
    void transmit(std::span<const std::byte> bytes);
    ```

    It carries pointer and size together and accepts compatible arrays/vectors.

    Mutable view:

    ```cpp
    void clear(std::span<std::byte> bytes);
    ```

    ### `std::string_view`

    A non-owning character sequence:

    ```cpp
    void log(std::string_view message);
    ```

    It can avoid allocation/copying when observing strings.

    ### Lifetime risk

    Neither owns or extends data lifetime:

    ```cpp
    std::string_view bad() {
        std::string local = "temporary";
        return local; // dangling view
    }
    ```

    A string view is not guaranteed null-terminated. Do not pass `.data()` to a C string API unless termination is established.

    ### Const handle versus const elements

    ```cpp
    const std::span<int> span = values;
    span[0] = 42; // allowed: handle constness does not make elements const
    ```

    For read-only elements:

    ```cpp
    std::span<const int> span = values;
    ```
  source: 09_modern_cpp_language_features_and_iteration.md
- id: '09.16'
  topic: Modern C++ Language Features and Iteration
  question: Why use `override`, `= default`, and `= delete`?
  answer: |-
    ## Short answer

    They make intent compiler-checkable: verify an override, request the generated operation, or explicitly forbid an operation.

    ## Detailed answer

    ### `override`

    ```cpp
    class Device {
    public:
        virtual ~Device() = default;
        virtual void start() = 0;
    };

    class Camera : public Device {
    public:
        void start() override;
    };
    ```

    The compiler verifies that `Camera::start` actually overrides a virtual base function. A signature mismatch becomes an error rather than silently creating a new function.

    ### `final`

    ```cpp
    class FixedDevice final : public Device {
    };
    ```

    Or:

    ```cpp
    void start() final;
    ```

    It prevents further derivation or overriding where the design requires closure.

    ### Defaulted functions

    ```cpp
    Device() = default;
    ~Device() = default;
    ```

    Explicitly request compiler-generated behavior.

    ### Deleted functions

    ```cpp
    Device(const Device&) = delete;
    Device& operator=(const Device&) = delete;
    ```

    Express that an operation is prohibited and obtain clear diagnostics.
  source: 09_modern_cpp_language_features_and_iteration.md
- id: '10.1'
  topic: C++ Standards and Version Comparison
  question: What does a C++ standard specify?
  answer: |-
    ## Short answer

    Core language semantics, standard-library interfaces and behavior, implementation requirements, and categories such as undefined or implementation-defined behavior. It does not specify one compiler, ABI, OS, or build system.

    ## Detailed answer

    A C++ standard specifies:

    - Core language grammar and semantics.
    - Standard-library interfaces and behavior.
    - Requirements on conforming implementations.
    - Undefined, unspecified, implementation-defined, and conditionally supported behavior.
    - Compatibility and defect-resolution rules.

    The standard does not specify one compiler, ABI, build system, or operating system.

    ### Language support versus library support

    A compiler may implement a language feature while its paired standard library lacks a facility:

    ```cpp
    // Language feature
    if constexpr (condition) {
    }

    // Library feature
    std::filesystem::path path;
    ```

    `if constexpr` depends on the compiler front end. `std::filesystem` depends heavily on library implementation and linkage/runtime support.

    ### Published standard versus working draft

    A working draft contains changes under committee development. Vendors may implement draft features early, but:

    - Syntax or behavior can change.
    - Feature-test macros may change.
    - Different compilers may implement different revisions.
    - Shipping ABI/API based on a draft can create maintenance risk.
  source: 10_cpp_standards_and_version_comparison.md
- id: '10.2'
  topic: C++ Standards and Version Comparison
  question: Why does `-std=c++20` not guarantee complete C++20 support?
  answer: |-
    ## Short answer

    Compiler front-end and standard-library support are separate, implementations may be incomplete, and platform/linkage/runtime support may also be required.

    ## Detailed answer

    Common compiler flags:

    ```text
    GCC/Clang: -std=c++17, -std=c++20, -std=c++23
    MSVC:      /std:c++17, /std:c++20, /std:c++latest
    ```

    Use build-system target properties rather than scattered flags when possible.

    CMake example:

    ```cmake
    target_compile_features(vehicle_controller PRIVATE cxx_std_20)
    ```

    Or set explicit standard properties according to project policy.

    ### Avoid “latest” for reproducible production builds

    A `latest` mode can change behavior when the compiler updates. Pin:

    - Compiler version.
    - Standard-library version.
    - Language mode.
    - Build flags.
    - Dependency versions.

    ### GNU extensions

    `-std=gnu++20` enables GNU extensions in addition to standard C++20, while `-std=c++20` aims for the standard dialect. Extensions can reduce portability.
  source: 10_cpp_standards_and_version_comparison.md
- id: '10.3'
  topic: C++ Standards and Version Comparison
  question: What established C++98/03?
  answer: |-
    ## Short answer

    The original ISO foundation: classes, inheritance, virtual functions, templates, exceptions, namespaces, RTTI, and the standardized STL, followed by corrections and refinements in C++03.

    ## Detailed answer

    C++98 established the standardized foundation.

    ### Major language facilities

    - Classes and inheritance.
    - Virtual functions and runtime polymorphism.
    - Function and operator overloading.
    - Templates.
    - Exceptions.
    - Namespaces.
    - References.
    - RTTI (`dynamic_cast`, `typeid`).
    - `bool`.
    - C++ casts.
    - Const correctness.
    - Dynamic allocation with `new` and `delete`.

    ### Standard library and STL

    The standard library included:

    - `std::string`.
    - I/O streams.
    - Containers such as `vector`, `list`, `deque`, `map`, and `set`.
    - Iterators.
    - Algorithms such as `sort`, `find`, and `copy`.
    - Function objects.
    - Allocators.
    - Numeric facilities.

    The STL's central idea was generic algorithms working through iterator abstractions.

    ### Typical C++98 style

    ```cpp
    std::vector<int> values;

    for (std::vector<int>::iterator iterator = values.begin();
         iterator != values.end();
         ++iterator) {
        std::cout << *iterator << '\n';
    }
    ```

    No language-level `auto` deduction, range-for, lambdas, move semantics, or standard smart-pointer ownership model comparable to `unique_ptr`.

    C++03 was primarily a correction/revision of C++98 rather than a redesign.

    Notable areas included:

    - Defect fixes and wording clarification.
    - Value-initialization rules.
    - Library corrections.
    - Improved consistency for templates and standard-library behavior.

    Typical source code looks essentially like C++98.

    ### Why the version still matters

    Legacy embedded and enterprise code may identify itself as “C++03” to mean:

    - No move semantics.
    - No lambdas.
    - No standard threading library.
    - No `unique_ptr`.
    - No `constexpr`.
    - No variadic templates.
    - Heavy use of Boost or proprietary facilities.

    ### `auto_ptr`

    C++03 used `std::auto_ptr` as an ownership type, but its copy-transfers-ownership behavior was surprising. It was deprecated in C++11 and removed in C++17. Modern code uses `std::unique_ptr`.
  source: 10_cpp_standards_and_version_comparison.md
- id: '10.4'
  topic: C++ Standards and Version Comparison
  question: Why is C++11 considered the modern-C++ boundary?
  answer: |-
    ## Short answer

    It introduced move semantics, smart pointers, lambdas, expanded `auto`, range-for, `nullptr`, `enum class`, uniform initialization, and a standard concurrency model.

    ## Detailed answer

    C++11 is commonly treated as the boundary between “classic” and “modern” C++ because it changed routine design.

    ### Pre-C++11 limitations

    - Copies were the primary value-transfer mechanism.
    - Ownership types were weaker or library-specific.
    - Threading was platform-specific.
    - Anonymous callbacks required function objects or function pointers.
    - Iterator types were verbose.
    - Compile-time computation facilities were limited.
    - Variadic generic code relied on macros or generated overloads.

    ### Modern approach

    ```cpp
    auto device = std::make_unique<Device>();

    std::thread worker([device = device.get()] {
        device->run();
    });

    for (const auto& reading : readings) {
        process(reading);
    }
    ```

    Modern features improve expression, but they also introduce new responsibilities: moved-from states, lambda capture lifetime, concurrency, and deduction rules.

    ### Move semantics

    ```cpp
    std::vector<int> source{1, 2, 3};
    std::vector<int> destination = std::move(source);
    ```

    Rvalue references, move constructors, and move assignment allow resource transfer instead of expensive deep copying.

    ### Type deduction

    ```cpp
    auto iterator = values.begin();
    decltype(values.size()) count{};
    ```

    ### Lambdas

    ```cpp
    auto predicate = [](int value) {
        return value > 0;
    };
    ```

    ### Range-based loops

    ```cpp
    for (const auto& value : values) {
    }
    ```

    ### Safer core-language tools

    ```cpp
    nullptr
    enum class State { Idle, Running };
    static_assert(sizeof(int) >= 4);
    ```

    Also:

    - Brace/list initialization.
    - `constexpr`.
    - `noexcept`.
    - Delegating and inherited constructors.
    - `= default` and `= delete`.
    - `override` and `final`.
    - Strongly typed enums.
    - User-defined literals.
    - Variadic templates.
    - Alias templates.
    - Thread-local storage.
    - Alignments (`alignas`, `alignof`).

    ### Library additions

    - `std::unique_ptr`, `std::shared_ptr`, `std::weak_ptr`.
    - `std::array`.
    - `std::tuple`.
    - `std::unordered_map` and related unordered containers.
    - `std::thread`, mutexes, condition variables, futures, atomics.
    - `std::chrono`.
    - Type traits.
    - Random-number facilities.
    - Regular expressions.
    - `std::function` and `std::bind`.
    - `std::initializer_list`.

    ### Tradeoffs

    C++11 compatibility can still be attractive for older toolchains, but it lacks many readability and library improvements from C++14/17/20.

    ### Concept diagram

    ```mermaid
    timeline
        title Modern C++ evolution
        1998 : First ISO C++ standard
        2011 : Move semantics, RAII vocabulary, lambdas, concurrency
        2014 : Refinement
        2017 : Practical library and language improvements
        2020 : Concepts, ranges, coroutines, modules
        2023 : Further language and library refinement
    ```
  source: 10_cpp_standards_and_version_comparison.md
- id: '10.5'
  topic: C++ Standards and Version Comparison
  question: What are notable C++14 additions?
  answer: |-
    ## Short answer

    Generic lambdas, relaxed `constexpr`, return-type deduction refinements, and `std::make_unique`.

    ## Detailed answer

    C++14 made C++11 easier to use.

    ### Generic lambdas

    ```cpp
    auto add = [](auto left, auto right) {
        return left + right;
    };
    ```

    ### Function return-type deduction

    ```cpp
    auto square(int value) {
        return value * value;
    }
    ```

    ### Relaxed `constexpr`

    C++14 allowed more ordinary statements in constexpr functions:

    ```cpp
    constexpr int sum_to(int n) {
        int result = 0;
        for (int i = 1; i <= n; ++i) {
            result += i;
        }
        return result;
    }
    ```

    ### Variable templates

    ```cpp
    template<class T>
    constexpr T pi = T{3.1415926535897932385L};
    ```

    ### Language conveniences

    - Binary literals: `0b1010`.
    - Digit separators: `1'000'000`.
    - Generalized lambda capture/init-capture.
    - Improved aggregate/member initialization rules.
    - `decltype(auto)`.

    ### Library additions

    - `std::make_unique`.
    - `std::integer_sequence`.
    - Shared timed mutex facilities.
    - Additional user-defined literal and tuple/type-trait helpers.
  source: 10_cpp_standards_and_version_comparison.md
- id: '10.6'
  topic: C++ Standards and Version Comparison
  question: What are notable C++17 additions?
  answer: |-
    ## Short answer

    Structured bindings, `if constexpr`, CTAD, inline variables, guaranteed copy-elision cases, filesystem, and vocabulary types such as `optional`, `variant`, and `string_view`.

    ## Detailed answer

    C++17 is a widely used production baseline because it adds expressive features without requiring every major C++20 subsystem.

    ### Structured bindings

    ```cpp
    auto [iterator, inserted] = map.insert({key, value});
    ```

    ### `if constexpr`

    ```cpp
    template<class T>
    void process(const T& value) {
        if constexpr (std::is_integral_v<T>) {
            process_integer(value);
        } else {
            process_object(value);
        }
    }
    ```

    ### Initialization in `if` and `switch`

    ```cpp
    if (auto iterator = map.find(key); iterator != map.end()) {
    }
    ```

    ### Class template argument deduction

    ```cpp
    std::pair pair{1, 2.0};
    std::lock_guard lock{mutex};
    ```

    ### Guaranteed copy elision in specified cases

    ```cpp
    Widget make_widget() {
        return Widget{};
    }
    ```

    The result object can be initialized directly under the new prvalue model.

    ### Other language additions

    - Inline variables.
    - Fold expressions.
    - Nested namespace syntax.
    - `constexpr` lambdas.
    - `[[nodiscard]]`, `[[maybe_unused]]`, `[[fallthrough]]`.
    - New deduction and evaluation rules.

    ### Library additions

    - `std::optional`.
    - `std::variant`.
    - `std::any`.
    - `std::string_view`.
    - `std::filesystem`.
    - Parallel algorithm overloads/execution policies.
    - `std::byte`.
    - `std::pmr` polymorphic memory resources.
    - `std::shared_mutex`.
    - `std::scoped_lock`.
    - `std::from_chars` / `std::to_chars`.
    - Searchers and numerous algorithm/type-trait additions.

    ### Removed/deprecated legacy facilities

    C++17 removed facilities including `std::auto_ptr` and some old function-object adapters.
  source: 10_cpp_standards_and_version_comparison.md
- id: '10.7'
  topic: C++ Standards and Version Comparison
  question: What are the headline C++20 features?
  answer: |-
    ## Short answer

    Concepts, ranges, coroutines, and modules, plus facilities such as `span`, `jthread`, `format`, and new synchronization primitives.

    ## Detailed answer

    C++20 is another major release.

    ### Concepts

    ```cpp
    template<std::integral T>
    T add(T left, T right);
    ```

    Concepts make template constraints part of interfaces and overload resolution.

    ### Ranges

    ```cpp
    auto even =
        values | std::views::filter([](int value) {
            return value % 2 == 0;
        });

    std::ranges::sort(values);
    ```

    Ranges introduce range-based algorithms, views, projections, sentinels, and a formal range model.

    ### Coroutines

    Functions can suspend and resume using:

    ```cpp
    co_await
    co_yield
    co_return
    ```

    C++20 provides language machinery but relatively little high-level coroutine library infrastructure; frameworks define task/generator/event-loop types.

    ### Modules

    ```cpp
    export module geometry;

    export struct Point {
        int x;
        int y;
    };
    ```

    Modules aim to improve encapsulation and build scalability compared with textual headers, but build-system/compiler integration varies.

    ### Three-way comparison

    ```cpp
    auto operator<=>(const Version&) const = default;
    ```

    This can synthesize consistent comparison operations when memberwise semantics are appropriate.

    ### Compile-time features

    - `consteval`.
    - `constinit`.
    - Expanded `constexpr`.
    - `std::is_constant_evaluated`.
    - Designated initialization for aggregates.
    - Template lambdas.
    - Abbreviated function templates.
    - `using enum`.

    ### Library additions

    - `std::span`.
    - `std::format`.
    - `std::source_location`.
    - `std::jthread` and `std::stop_token`.
    - Semaphores, latches, and barriers.
    - Atomic wait/notify and `atomic_ref`.
    - Calendar/time-zone chrono support.
    - `std::bit_cast` and `<bit>` utilities.
    - String `starts_with`/`ends_with`.
    - More constexpr containers/algorithms.

    ### Implementation reality

    C++20 support is not one Boolean. Modules, format, ranges, and library components matured at different speeds across vendors.
  source: 10_cpp_standards_and_version_comparison.md
- id: '10.8'
  topic: C++ Standards and Version Comparison
  question: What are notable C++23 additions?
  answer: |-
    ## Short answer

    Facilities such as `expected`, `print`, and `mdspan`, explicit object parameters, and continued ranges and library refinements. Actual compiler/library support must still be verified.

    ## Detailed answer

    C++23 is the current published standard as of August 18, 2026. The formal ISO publication is ISO/IEC 14882:2024 because publication followed completion of the C++23 technical work.

    ### Explicit object parameters (“deducing this”)

    ```cpp
    struct Buffer {
        template<class Self>
        auto&& data(this Self&& self) {
            return std::forward<Self>(self).data_;
        }

    private:
        std::vector<int> data_;
    };
    ```

    This can unify const/value-category overload patterns and supports new generic techniques.

    ### `if consteval`

    ```cpp
    constexpr int evaluate(int value) {
        if consteval {
            return compile_time_path(value);
        } else {
            return runtime_path(value);
        }
    }
    ```

    ### Language refinements

    Examples include:

    - Multidimensional subscript support.
    - Static call/subscript operators.
    - Additional constexpr capabilities.
    - Simpler implicit move rules.
    - More portable assumptions and preprocessing/literal improvements.

    ### Library additions

    High-value examples include:

    - `std::expected`.
    - `std::print` / `std::println`.
    - `std::mdspan`.
    - `std::move_only_function`.
    - `std::stacktrace`.
    - `std::flat_map` and `std::flat_set`.
    - `std::generator`.
    - `std::byteswap`.
    - `std::unreachable`.
    - Span-based streams.
    - Monadic operations for `optional` and `expected`.
    - `ranges::to` and additional range views/algorithms.

    ### Adoption tradeoff

    C++23 availability varies across:

    - Compiler parsing.
    - Standard-library implementation.
    - Operating-system/runtime packaging.
    - IDE/build-system recognition.
    - Embedded vendor support.

    Use feature-test macros and a compatibility matrix before choosing facilities.
  source: 10_cpp_standards_and_version_comparison.md
- id: '10.9'
  topic: C++ Standards and Version Comparison
  question: How should an in-progress standard such as C++26 be treated?
  answer: |-
    ## Short answer

    As a draft target whose features and implementation status must be verified, not as a universally portable published baseline.

    ## Detailed answer

    As of August 18, 2026, C++26 is not a published ISO standard. Committee work and compiler experiments exist, but this chapter intentionally does not present a draft feature list as final.

    ### How to discuss draft features responsibly

    Say:

    - “This feature is in the current C++26 working draft,” if verified.
    - “Compiler X implements an experimental revision,” when implementation-specific.
    - “The syntax/semantics may still change.”
    - “This is not part of the current published C++23 standard.”

    Do not say:

    - “C++26 guarantees this” before publication.
    - “All C++26 compilers support it.”
    - “Draft support is portable.”

    ### When to experiment

    Draft features can be useful for:

    - Library/toolchain research.
    - Non-production experiments.
    - Evaluating upcoming design directions.
    - Providing committee/implementation feedback.

    They are risky for long-lived ABI, safety-certified code, or multi-vendor portability.
  source: 10_cpp_standards_and_version_comparison.md
- id: '10.10'
  topic: C++ Standards and Version Comparison
  question: What are feature-test macros for?
  answer: |-
    ## Short answer

    They let code test whether a specific language or library feature is available instead of assuming support from a broad version mode alone.

    ## Detailed answer

    Do not infer support only from compiler version.

    ### Language-version macro

    ```cpp
    #if __cplusplus >= 202002L
        // C++20-or-later language mode
    #endif
    ```

    Common values:

    | Mode | `__cplusplus` value |
    |---|---:|
    | C++98/03 | `199711L` |
    | C++11 | `201103L` |
    | C++14 | `201402L` |
    | C++17 | `201703L` |
    | C++20 | `202002L` |
    | C++23 | `202302L` |

    Do not hard-code an assumed final C++26 value before standardization/toolchain documentation confirms it.

    Microsoft compilers historically required `/Zc:__cplusplus` for an accurate standard value in some configurations.

    ### Feature-test macros

    ```cpp
    #include <version>

    #if defined(__cpp_lib_expected) && __cpp_lib_expected >= 202202L
        // expected support at required revision
    #endif
    ```

    Language macros often begin `__cpp_`; library macros often begin `__cpp_lib_`.

    ### Why macros matter

    A toolchain may be in C++20 mode but lack a particular library component. Check the exact feature, not just the umbrella mode.
  source: 10_cpp_standards_and_version_comparison.md
- id: '10.11'
  topic: C++ Standards and Version Comparison
  question: How do source compatibility and ABI compatibility differ?
  answer: |-
    ## Short answer

    Source compatibility means code can be recompiled. ABI compatibility means separately built binaries agree on calling conventions, object layout, symbol naming, library contracts, and related binary details.

    ## Detailed answer

    These are different.

    ### Source compatibility

    Old source compiles under a newer mode. It can fail because:

    - Removed facilities.
    - New keywords.
    - Changed overload resolution.
    - Stricter rules.
    - Library API changes.
    - Previously accepted extensions are rejected.

    ### Binary compatibility

    Already compiled components can link and work together. It depends on:

    - Name mangling.
    - Object layout.
    - Calling conventions.
    - Exception/runtime model.
    - Standard-library ABI.
    - Compiler flags.
    - Debug/release modes.
    - Allocator ownership across boundaries.

    Selecting a newer language standard does not automatically break ABI, but compiler/library choices might.

    ### API compatibility

    Source may compile while behavior changes because overload sets or defaults differ.

    ### Dynamic libraries/plugins

    Expose a stable boundary deliberately. A C ABI entry point is often safer:

    ```cpp
    extern "C" PluginApi* create_plugin(std::uint32_t abi_version);
    ```

    Internal implementation can use any agreed C++ version, but objects crossing the boundary require precise ABI and ownership rules.
  source: 10_cpp_standards_and_version_comparison.md
- id: '10.12'
  topic: C++ Standards and Version Comparison
  question: How should a project choose its C++ baseline?
  answer: |-
    ## Short answer

    Balance needed features against compiler/library availability, target platforms, consumers, ABI constraints, certification/tooling, embedded limitations, and maintenance cost—then enforce and test the decision consistently.

    ## Detailed answer

    Evaluate:

    - Target compiler versions.
    - Standard-library versions.
    - Embedded/vendor toolchains.
    - Operating-system packaging.
    - Safety certification.
    - Third-party dependencies.
    - ABI requirements.
    - Team experience.
    - Required features.
    - Maintenance lifespan.

    ### Common choices

    **C++17:** mature support and many modern vocabulary types.

    **C++20:** strong choice when concepts/ranges/coroutines/modules or modern synchronization are valuable and toolchain support is verified.

    **C++23:** appropriate when required components are implemented across every supported toolchain.

    ### Lowest common denominator tradeoff

    A conservative baseline improves reach but may require custom versions of standard facilities and more boilerplate. A newer baseline improves expression but can reduce platform coverage.
  source: 10_cpp_standards_and_version_comparison.md
- id: '11.1'
  topic: Templates and Generic Programming
  question: What is a template?
  answer: |-
    ## Short answer

    A compile-time pattern for producing type-safe functions, classes, aliases, or variables for concrete type or value arguments.

    ## Detailed answer

    ```cpp
    template<class T>
    T square(T value) {
        return value * value;
    }
    ```

    Using it:

    ```cpp
    int i = square(4);
    double d = square(1.5);
    ```

    creates/uses specializations conceptually like:

    ```cpp
    int square<int>(int);
    double square<double>(double);
    ```

    The compiler may inline, merge, or eliminate emitted code, but the language reasons about distinct specializations.

    `T` becomes one concrete static type for each specialization. A template does not store an arbitrary runtime type.

    The selected `T` must support multiplication and conversion to the result:

    ```cpp
    struct Device {};
    // square(Device{}); // error: required operation does not exist
    ```
  source: 11_cpp_templates_and_generic_programming.md
- id: '11.2'
  topic: Templates and Generic Programming
  question: What kinds of template parameters exist?
  answer: |-
    ## Short answer

    Type parameters, non-type parameters, and template-template parameters, each of which may have defaults where allowed.

    ## Detailed answer

    ### Type parameter

    ```cpp
    template<class T>
    class Box {};
    ```

    Equivalent:

    ```cpp
    template<typename T>
    class Box {};
    ```

    ### Non-type parameter

    ```cpp
    template<class T, std::size_t N>
    class FixedBuffer {};
    ```

    `N` is a compile-time value and part of the type.

    ### Template-template parameter

    ```cpp
    template<class T, template<class...> class Container>
    class Collection {
        Container<T> values_;
    };
    ```

    ### Defaults

    ```cpp
    template<class T, class Allocator = std::allocator<T>>
    class Buffer {};
    ```

    Caller:

    ```cpp
    Buffer<int> buffer;
    ```
  source: 11_cpp_templates_and_generic_programming.md
- id: '11.3'
  topic: Templates and Generic Programming
  question: What is template instantiation?
  answer: |-
    ## Short answer

    The process of forming a concrete specialization from a template and specific arguments. Separate arguments may produce distinct specializations and code.

    ## Detailed answer

    Implicit use requests the needed specialization:

    ```cpp
    Box<int> box{42};
    ```

    A class layout must be formed, while unused member function bodies are often not instantiated until required.

    ```cpp
    template<class T>
    class Wrapper {
    public:
        void sort() {
            value_.sort();
        }

    private:
        T value_;
    };

    Wrapper<int> wrapper; // can be valid if sort() is never instantiated
    ```

    Explicit definition:

    ```cpp
    template class Box<int>;
    ```

    Explicit declaration:

    ```cpp
    extern template class Box<int>;
    ```

    The latter tells a translation unit that a definition is provided elsewhere.

    ### Concept diagram

    ```mermaid
    flowchart LR
        A[Template definition] --> B[Use with concrete arguments]
        B --> C[Substitution and constraint checking]
        C --> D[Instantiate specialization]
        D --> E[Compile generated function or class]
    ```
  source: 11_cpp_templates_and_generic_programming.md
- id: '11.4'
  topic: Templates and Generic Programming
  question: What must a substituted template type support?
  answer: |-
    ## Short answer

    Every operation required by the selected code path. Before concepts, these requirements were often implicit compile-time duck typing.

    ## Detailed answer

    ```cpp
    template<class T>
    T combine(const T& left, const T& right) {
        return left + right;
    }
    ```

    Any `T` with a suitable `+` and result can work. It need not inherit from a designated base class.

    This is sometimes called compile-time duck typing: capability comes from supported operations.

    Unconstrained failures can produce deep diagnostics. Pre-C++20 code used documentation, traits, SFINAE, and static assertions. C++20 concepts place requirements in the declaration.

    Syntax is not the whole contract. A sort comparator must obey strict weak ordering; the compiler generally cannot prove that semantic law.
  source: 11_cpp_templates_and_generic_programming.md
- id: '11.5'
  topic: Templates and Generic Programming
  question: Why do template definitions usually live in headers?
  answer: |-
    ## Short answer

    The translation unit performing implicit instantiation must see the complete template definition, not only a declaration.

    ## Detailed answer

    An ordinary function caller can compile from a declaration and link one precompiled definition.

    A template caller needs the definition to instantiate a new specialization:

    ```cpp
    template<class T>
    T add(T left, T right) {
        return left + right;
    }
    ```

    If only a declaration is visible and no matching explicit instantiation is linked, the result is often an undefined-reference link error.

    Options:

    - Define in the header.
    - Put implementation in a `.tpp`/`.ipp` included by the header.
    - Explicitly instantiate a closed supported type set in a `.cpp`.
    - Use a suitable modules/toolchain model.
  source: 11_cpp_templates_and_generic_programming.md
- id: '11.6'
  topic: Templates and Generic Programming
  question: What is the difference between full and partial specialization?
  answer: |-
    ## Short answer

    Full specialization replaces one exact argument set. Partial specialization matches a family of arguments and is available for class and variable templates, not function templates.

    ## Detailed answer

    Primary template:

    ```cpp
    template<class T>
    struct TypeName {
        static constexpr std::string_view value = "unknown";
    };
    ```

    Full specialization:

    ```cpp
    template<>
    struct TypeName<int> {
        static constexpr std::string_view value = "int";
    };
    ```

    Partial specialization:

    ```cpp
    template<class T>
    struct TypeName<T*> {
        static constexpr std::string_view value = "pointer";
    };
    ```

    Partial specialization matches a family and is available for class and variable templates.

    Function templates cannot be partially specialized. Use overloading:

    ```cpp
    template<class T>
    void process(T value);

    template<class T>
    void process(T* value);
    ```
  source: 11_cpp_templates_and_generic_programming.md
- id: '11.7'
  topic: Templates and Generic Programming
  question: What should be used instead of partial specialization for function templates?
  answer: |-
    ## Short answer

    Overloading, constraints/concepts, or a helper class that can be partially specialized.

    ## Detailed answer

    Function templates cannot be partially specialized. Use function overloading—often constrained with concepts—because overload resolution is the language mechanism designed to choose among function implementations.

    ```cpp
    template<class T>
    void encode(const T& value);

    template<std::integral T>
    void encode(T value);

    template<class T>
    void encode(const std::vector<T>& values);
    ```

    Full specialization of a function template is legal, but overloads usually interact more predictably with overload resolution and are easier to extend. For type-dependent implementation details, another option is to delegate to a class template, because class templates do support partial specialization.
  source: 11_cpp_templates_and_generic_programming.md
- id: '11.8'
  topic: Templates and Generic Programming
  question: What are variadic templates and fold expressions?
  answer: |-
    ## Short answer

    Variadic templates accept parameter packs. Fold expressions reduce a pack over a binary operator, such as `(args + ...)`, with unary/binary and left/right forms.

    ## Detailed answer

    ```cpp
    template<class... Types>
    struct TypeList {};
    ```

    `Types...` declares a template parameter pack.

    ```cpp
    template<class... Args>
    void log(Args&&... args);
    ```

    Pack expansion:

    ```cpp
    template<class... Args>
    auto make_device(Args&&... args) {
        return Device(std::forward<Args>(args)...);
    }
    ```

    Pack size:

    ```cpp
    sizeof...(Args)
    ```

    Recursive expansion style:

    ```cpp
    void print_all() {}

    template<class First, class... Rest>
    void print_all(const First& first, const Rest&... rest) {
        std::cout << first;
        print_all(rest...);
    }
    ```

    C++17:

    ```cpp
    template<class... Values>
    auto sum(Values... values) {
        return (0 + ... + values);
    }
    ```

    Forms include:

    ```cpp
    (args + ...)
    (... + args)
    (initial + ... + args)
    (args + ... + initial)
    ```

    Left and right folds group operations differently; this matters for non-associative/user-defined operations.

    Comma fold for effects:

    ```cpp
    ((std::cout << values << '\n'), ...);
    ```

    Empty-pack validity depends on fold form/operator; an explicit initial value often clarifies identity.
  source: 11_cpp_templates_and_generic_programming.md
- id: '11.9'
  topic: Templates and Generic Programming
  question: What is SFINAE?
  answer: |-
    ## Short answer

    Substitution Failure Is Not An Error: failure while substituting into certain immediate template contexts removes that candidate from overload resolution instead of producing a hard error.

    ## Detailed answer

    SFINAE means “Substitution Failure Is Not An Error.”

    ```cpp
    template<class T,
             std::enable_if_t<std::is_integral_v<T>, int> = 0>
    T twice(T value) {
        return value * 2;
    }
    ```

    If substitution fails in a specified immediate context, the candidate is removed rather than making the whole program immediately ill-formed.

    Detection idiom:

    ```cpp
    template<class, class = void>
    struct has_size : std::false_type {};

    template<class T>
    struct has_size<T,
        std::void_t<decltype(std::declval<T&>().size())>>
        : std::true_type {};
    ```

    Not every template error is SFINAE. Body-instantiation failures can be hard errors.
  source: 11_cpp_templates_and_generic_programming.md
- id: '11.10'
  topic: Templates and Generic Programming
  question: Why prefer C++20 concepts over complex SFINAE?
  answer: |-
    ## Short answer

    Concepts place requirements in the interface, participate clearly in overload ordering, and usually produce better diagnostics and more maintainable code.

    ## Detailed answer

    ```cpp
    template<class T>
    concept Addable = requires(T left, T right) {
        left + right;
    };

    template<Addable T>
    T add(T left, T right) {
        return left + right;
    }
    ```

    Standard concept:

    ```cpp
    template<std::integral T>
    T saturating_add(T left, T right);
    ```

    Requires expression with return constraint:

    ```cpp
    template<class T>
    concept Sized = requires(const T& value) {
        { value.size() } -> std::convertible_to<std::size_t>;
    };
    ```

    Concepts state requirements in interfaces, affect viability/specialization, and improve diagnostics. They cannot generally prove semantic laws.
  source: 11_cpp_templates_and_generic_programming.md
- id: '11.11'
  topic: Templates and Generic Programming
  question: What is a forwarding reference?
  answer: |-
    ## Short answer

    `T&&` where `T` is deduced under forwarding-reference rules. Combined with `std::forward<T>`, it preserves whether the caller supplied an lvalue or rvalue.

    ## Detailed answer

    ```cpp
    template<class T>
    void wrapper(T&& value) {
        target(std::forward<T>(value));
    }
    ```

    With an lvalue `Widget`:

    ```text
    T = Widget&
    T&& collapses to Widget&
    ```

    With an rvalue:

    ```text
    T = Widget
    T&& remains Widget&&
    ```

    The named variable `value` is always an lvalue expression. `std::forward<T>` restores the caller's original category.

    Not every `T&&` is forwarding:

    ```cpp
    void consume(Widget&&); // ordinary rvalue reference
    ```

    Forwarding can steal overloads, increase instantiations, and produce lifetime problems. Constrain it.
  source: 11_cpp_templates_and_generic_programming.md
- id: '11.12'
  topic: Templates and Generic Programming
  question: What does `if constexpr` do in a template?
  answer: |-
    ## Short answer

    It selects a branch at compile time, and the discarded branch is not instantiated in the same way, allowing type-dependent implementations without requiring every branch to be valid for every type.

    ## Detailed answer

    ```cpp
    template<class T>
    void encode(const T& value) {
        if constexpr (std::is_integral_v<T>) {
            encode_integer(value);
        } else {
            encode_object(value);
        }
    }
    ```

    The non-selected branch is discarded for that instantiation.

    An ordinary `if` is a runtime branch and both branches normally must be valid after instantiation.

    Use `if constexpr` when implementation largely overlaps. Use overloads/specialization when interfaces or algorithms differ substantially.
  source: 11_cpp_templates_and_generic_programming.md
- id: '11.13'
  topic: Templates and Generic Programming
  question: How do static and runtime polymorphism differ?
  answer: |-
    ## Short answer

    Templates choose behavior at compile time and can inline but require concrete types and may grow code. Virtual functions choose at runtime and support open runtime substitution with indirection and object-model costs.

    ## Detailed answer

    Template:

    ```cpp
    template<class Device>
    void start(Device& device) {
        device.start();
    }
    ```

    Use when types are compile-time known and static optimization/value semantics matter.

    Virtual interface: use for runtime-selected/open implementation sets and stable non-template boundaries.

    Variant: use for a closed set with value semantics and exhaustive visitation.

    Type erasure: use to hide concrete types behind a runtime wrapper such as `std::function`.
  source: 11_cpp_templates_and_generic_programming.md
- id: '11.14'
  topic: Templates and Generic Programming
  question: What is CRTP?
  answer: |-
    ## Short answer

    The Curiously Recurring Template Pattern makes a derived type a template argument of its base, enabling forms of static polymorphism and mixin behavior without virtual dispatch.

    ## Detailed answer

    ```cpp
    template<class Derived>
    class DeviceBase {
    public:
        void start() {
            static_cast<Derived&>(*this).start_impl();
        }
    };

    class Camera : public DeviceBase<Camera> {
    public:
        void start_impl() {}
    };
    ```

    Benefits:

    - Compile-time dispatch/inlining.
    - No required vtable.
    - Mixin/policy composition.

    Costs:

    - Tight coupling and code duplication.
    - No simple heterogeneous runtime base collection.
    - More complex diagnostics.
    - Unsafe relationship if misused.
  source: 11_cpp_templates_and_generic_programming.md
- id: '11.15'
  topic: Templates and Generic Programming
  question: What are the main template costs?
  answer: |-
    ## Short answer

    Longer builds, verbose diagnostics, implementation exposure in headers, possible code bloat, and more complex interfaces. Use templates when genericity and static guarantees justify those costs.

    ## Detailed answer

    Templates trade runtime abstraction cost for compile-time work and per-specialization code. The main costs are longer builds, larger binaries from repeated instantiations, complex diagnostics, more implementation exposed in headers, and accidental coupling to compile-time details.

    Mitigations include explicit instantiation for common types, small non-template implementation functions behind template front ends, concepts that fail early with clear contracts, and avoiding unnecessary combinations of template parameters.

    The runtime benefit can be substantial: types and operations are known statically, enabling inlining, constant propagation, and zero-overhead abstraction. But “compile-time” does not automatically mean “free”—inspect build time, object size, final binary size, and generated code when those constraints matter.
  source: 11_cpp_templates_and_generic_programming.md
- id: '12.1'
  topic: Standard Template Library (STL)
  question: What is a container, and what are the major STL components?
  answer: |-
    ## Short answer

    A container is an object that stores a collection of other objects. The STL’s generic architecture combines containers, iterators/ranges, algorithms, callables/policies, and allocators.

    ## Detailed answer

    ### Container

    Owns and organizes elements:

    ```cpp
    std::vector<Device> devices;
    ```

    ### Iterator

    Represents a traversal position:

    ```cpp
    auto first = devices.begin();
    auto last = devices.end();
    ```

    `end()` is a past-the-end sentinel/iterator and cannot be dereferenced.

    ### Algorithm

    Operates on iterator/range abstractions:

    ```cpp
    std::sort(first, last);
    ```

    ### Callable/policy

    Customizes behavior:

    ```cpp
    std::sort(first, last,
              [](const Device& left, const Device& right) {
                  return left.priority() < right.priority();
              });
    ```

    ### Allocator

    Controls storage allocation/deallocation mechanics:

    ```cpp
    std::vector<Device, CustomAllocator<Device>> devices;
    ```

    ### Separation benefit

    An algorithm can work with many containers when iterator capabilities match. `std::find` works with vector, list, arrays, and many custom ranges. `std::sort` needs random access, so it is more restrictive.

    ### Concept diagram

    ```mermaid
    flowchart LR
        C[Container owns elements] --> I[Iterators describe a range]
        I --> A[Algorithms operate on the range]
        P[Callables and policies customize behavior] --> A
        M[Allocator controls storage mechanics] --> C
    ```
  source: 12_cpp_standard_template_library_stl.md
- id: '12.2'
  topic: Standard Template Library (STL)
  question: What is the default sequence container?
  answer: |-
    ## Short answer

    `std::vector`, because it provides contiguous storage, cache locality, random access, and amortized constant-time append. Choose another container only for specific required semantics.

    ## Detailed answer

    ```cpp
    std::vector<int> values;
    values.push_back(10);
    ```

    Properties:

    - Contiguous element storage.
    - O(1) random access.
    - Dynamic size.
    - Amortized O(1) `push_back`.
    - O(n) insertion/erase except near the end.
    - Excellent cache locality.
    - Compatible with C APIs through `data()` when element representation/API rules match.

    Conceptual state:

    ```text
    size     = number of live elements
    capacity = number of elements storage can currently hold
    ```

    Reallocation allocates a larger block, moves/copies elements, destroys old elements, and releases old storage.

    ### Why vector is the default

    - Low per-element overhead.
    - Few allocations.
    - Locality and prefetching.
    - Fast iteration.
    - Random access.
    - Broad algorithm compatibility.

    ### `vector<bool>`

    `std::vector<bool>` is a space-optimized specialization whose element access uses proxy objects rather than ordinary `bool&`. Generic code must not assume `operator[]` returns a real reference.
  source: 12_cpp_standard_template_library_stl.md
- id: '12.3'
  topic: Standard Template Library (STL)
  question: When should you choose `array`, `deque`, or `list`?
  answer: |-
    ## Short answer

    Use `array` for compile-time fixed contiguous storage, `deque` for efficient operations at both ends, and `list` only when stable nodes and frequent known-position splicing justify allocation and locality costs.

    ## Detailed answer

    ```cpp
    std::array<int, 4> values{1, 2, 3, 4};
    ```

    Properties:

    - Fixed element count in the type.
    - Contiguous storage.
    - Usually stored directly inside its containing object.
    - Standard container interface (`begin`, `end`, `size`, `data`).
    - No dynamic resizing.
    - Supports aggregate-like initialization and value semantics.

    Compared with a built-in array:

    ```cpp
    int raw[4]{};
    ```

    `std::array` is assignable as a whole, works directly with algorithms, and reports size.

    ```cpp
    std::array<int, 4> other = values;
    ```

    `std::array<int, 4>` and `std::array<int, 8>` are different types.

    Zero-size arrays are supported through `std::array<T, 0>`, with special front/back rules.

    ```cpp
    std::deque<int> values;
    values.push_front(1);
    values.push_back(2);
    ```

    Properties:

    - Efficient insertion/removal at both ends.
    - O(1) random access.
    - Usually segmented/non-contiguous storage.
    - No guarantee that all elements occupy one continuous block.
    - Different invalidation rules from vector.

    Use when:

    - Both front and back operations are frequent.
    - Random access remains useful.
    - Stable contiguous storage is not required.

    Do not pass deque element storage as one C-style contiguous array.

    ### Tradeoff versus vector

    Deque avoids moving all elements for front insertion, but has more indirection and often poorer locality. Vector remains preferable for simple append-and-iterate workloads.

    ### Doubly linked list

    ```cpp
    std::list<int> values;
    ```

    Properties:

    - Bidirectional iterators.
    - O(1) insertion/erase given a valid position.
    - Stable iterators/references to other nodes.
    - O(1) splicing between compatible lists.
    - No random access.
    - Node allocation and pointer overhead per element.
    - Poor locality.

    ### Singly linked list

    ```cpp
    std::forward_list<int> values;
    ```

    Properties:

    - Forward iteration only.
    - Smaller node linkage.
    - Operations often use “before” positions (`insert_after`, `erase_after`).
    - No ordinary `size()` requirement historically due complexity/design goals.

    ### Why O(1) insertion may still be slower

    You must first reach the position, often O(n), and allocate a node. Vector's bulk memory movement can outperform lists due to locality.

    ### List-specific algorithms

    Because list iterators are not random-access:

    ```cpp
    values.sort();
    values.merge(other);
    values.unique();
    values.remove_if(predicate);
    ```
  source: 12_cpp_standard_template_library_stl.md
- id: '12.4'
  topic: Standard Template Library (STL)
  question: How do `map` and `unordered_map` differ?
  answer: |-
    ## Short answer

    `map` is ordered with logarithmic operations and predictable worst-case behavior. `unordered_map` uses hashing for average constant-time operations but has rehash costs and worst-case linear behavior.

    ## Detailed answer

    ```cpp
    std::set<Key> keys;
    std::map<Key, Value> values;
    std::multiset<Key> duplicate_keys;
    std::multimap<Key, Value> duplicate_pairs;
    ```

    Typically implemented as balanced search trees, though the standard specifies behavior/complexity rather than exact structure.

    Properties:

    - Ordered iteration.
    - O(log n) lookup/insertion/erase.
    - Stable references/iterators except erased elements.
    - Key equivalence based on comparator, not necessarily `operator==`.
    - Node allocation overhead.

    ### `map::operator[]`

    ```cpp
    counts[key]++;
    ```

    If `key` is absent, `operator[]` inserts a default-constructed mapped value.

    For lookup without insertion:

    ```cpp
    auto iterator = counts.find(key);
    ```

    C++20:

    ```cpp
    if (counts.contains(key)) {
    }
    ```

    For insertion without requiring default construction:

    ```cpp
    counts.try_emplace(key, arguments...);
    counts.insert_or_assign(key, value);
    ```

    ### Comparator equivalence

    Keys `a` and `b` are equivalent when:

    ```cpp
    !compare(a, b) && !compare(b, a)
    ```

    Comparator must provide strict weak ordering.

    ```cpp
    std::unordered_set<Key> keys;
    std::unordered_map<Key, Value> values;
    ```

    Hash-table properties:

    - Average O(1) lookup/insertion/erase.
    - Worst-case O(n).
    - No sorted iteration.
    - Buckets, load factor, and rehashing.
    - Requires compatible hash and equality.
    - Often significant memory overhead.
    - Iterator invalidation on rehash.

    ### Hash/equality contract

    If keys are equal under the equality predicate, they must produce the same hash value.

    A custom key:

    ```cpp
    struct Key {
        int bus;
        int address;

        bool operator==(const Key&) const = default;
    };

    struct KeyHash {
        std::size_t operator()(const Key& key) const noexcept {
            // combine fields with an appropriate hash strategy
        }
    };
    ```

    ### Reserve and load factor

    ```cpp
    values.reserve(expected_count);
    values.max_load_factor(0.8f);
    ```

    Reserving can avoid repeated rehashing and reduce latency spikes.

    ### Security/determinism

    Adversarial collisions can degrade to linear behavior. Ordered maps provide logarithmic worst-case guarantees and often more predictable iteration.
  source: 12_cpp_standard_template_library_stl.md
- id: '12.5'
  topic: Standard Template Library (STL)
  question: What are the complexities of common operations?
  answer: |-
    ## Short answer

    `vector[index]`: O(1); `vector::push_back`: amortized O(1); vector middle insertion: O(n); `map::find`: O(log n); `unordered_map::find`: average O(1), worst O(n); `sort`: O(n log n).

    ## Detailed answer

    ### Big-O describes growth

    O(log n) map lookup and average O(1) hash lookup do not tell the complete constant factors, allocation cost, locality, or worst-case latency.

    ### Amortized complexity

    `vector::push_back` is amortized O(1):

    - Most pushes construct one element.
    - Occasional growth moves/copies all existing elements.
    - Total cost across many pushes remains linear under the growth strategy.

    One individual push can be O(n).

    ### Iterator effects

    `std::lower_bound` uses O(log n) comparisons, but on forward iterators it may require O(n) iterator increments. A tree container's member `lower_bound` navigates its tree in O(log n).

    Prefer:

    ```cpp
    map.lower_bound(key);
    ```

    over generic `std::lower_bound(map.begin(), map.end(), ...)`.

    ### Worst-case requirements

    Real-time code may reject average/amortized guarantees even if throughput is excellent.
  source: 12_cpp_standard_template_library_stl.md
- id: '12.6'
  topic: Standard Template Library (STL)
  question: What is amortized complexity?
  answer: |-
    ## Short answer

    An expensive operation may occur occasionally, but the cost averaged across a sequence of operations has the stated bound—for example, vector growth makes repeated `push_back` amortized O(1).

    ## Detailed answer

    ### Big-O describes growth

    O(log n) map lookup and average O(1) hash lookup do not tell the complete constant factors, allocation cost, locality, or worst-case latency.

    ### Amortized complexity

    `vector::push_back` is amortized O(1):

    - Most pushes construct one element.
    - Occasional growth moves/copies all existing elements.
    - Total cost across many pushes remains linear under the growth strategy.

    One individual push can be O(n).

    ### Iterator effects

    `std::lower_bound` uses O(log n) comparisons, but on forward iterators it may require O(n) iterator increments. A tree container's member `lower_bound` navigates its tree in O(log n).

    Prefer:

    ```cpp
    map.lower_bound(key);
    ```

    over generic `std::lower_bound(map.begin(), map.end(), ...)`.

    ### Worst-case requirements

    Real-time code may reject average/amortized guarantees even if throughput is excellent.
  source: 12_cpp_standard_template_library_stl.md
- id: '12.7'
  topic: Standard Template Library (STL)
  question: What do `size`, `capacity`, `reserve`, and `resize` mean for a vector?
  answer: |-
    ## Short answer

    `size` is the number of elements; `capacity` is storage available before reallocation; `reserve` changes capacity without changing size; `resize` changes the number of elements.

    ## Detailed answer

    ```cpp
    std::vector<int> values;
    values.reserve(100);
    ```

    After reserve:

    ```text
    capacity >= 100
    size == 0
    ```

    There are no elements to index yet.

    ```cpp
    values.resize(100);
    ```

    Now 100 elements exist, value/default-initialized as specified.

    ### Common error

    ```cpp
    values.reserve(10);
    // values[0] = 42; // invalid: size is still zero
    ```

    Use:

    ```cpp
    values.push_back(42);
    ```

    or resize first.

    ### Shrinking

    `clear()` destroys elements but need not reduce capacity.

    `shrink_to_fit()` is a non-binding request and can invalidate if reallocation occurs.
  source: 12_cpp_standard_template_library_stl.md
- id: '12.8'
  topic: Standard Template Library (STL)
  question: What are the key vector invalidation rules?
  answer: |-
    ## Short answer

    Reallocation invalidates all element pointers, references, and iterators. Erasure invalidates those at and after the erased position. Non-reallocating insertion invalidates handles at and after the insertion point.

    ## Detailed answer

    ### Vector

    - Reallocation: invalidates all element iterators, pointers, and references.
    - Insert without reallocation: invalidates at/after insertion point; earlier elements remain valid.
    - Erase: invalidates erased and following positions.
    - `reserve` can itself reallocate if requested capacity exceeds current capacity.

    ### Deque

    Rules vary by operation; insertions/erases can invalidate iterators broadly while reference behavior differs. Check the exact operation rather than assuming list-like stability.

    ### List/forward_list

    Insertion preserves existing iterators/references. Erasure invalidates only erased elements.

    ### Ordered associative containers

    Insertion preserves existing references/iterators. Erasure invalidates only erased elements.

    ### Unordered containers

    Rehash invalidates iterators. References/pointers to elements generally remain valid across rehash, but erasure invalidates the erased element.

    ### Borrowed views

    A span/string_view/iterator can dangle even while its handle object remains alive.
  source: 12_cpp_standard_template_library_stl.md
- id: '12.9'
  topic: Standard Template Library (STL)
  question: What invalidation behavior do node-based associative containers have?
  answer: |-
    ## Short answer

    Insertion into ordered associative containers normally preserves existing iterators and references; erasure invalidates only erased elements. Unordered rehash invalidates iterators, though references/pointers to elements generally remain valid.

    ## Detailed answer

    ### Vector

    - Reallocation: invalidates all element iterators, pointers, and references.
    - Insert without reallocation: invalidates at/after insertion point; earlier elements remain valid.
    - Erase: invalidates erased and following positions.
    - `reserve` can itself reallocate if requested capacity exceeds current capacity.

    ### Deque

    Rules vary by operation; insertions/erases can invalidate iterators broadly while reference behavior differs. Check the exact operation rather than assuming list-like stability.

    ### List/forward_list

    Insertion preserves existing iterators/references. Erasure invalidates only erased elements.

    ### Ordered associative containers

    Insertion preserves existing references/iterators. Erasure invalidates only erased elements.

    ### Unordered containers

    Rehash invalidates iterators. References/pointers to elements generally remain valid across rehash, but erasure invalidates the erased element.

    ### Borrowed views

    A span/string_view/iterator can dangle even while its handle object remains alive.
  source: 12_cpp_standard_template_library_stl.md
- id: '12.10'
  topic: Standard Template Library (STL)
  question: What are the main iterator categories?
  answer: |-
    ## Short answer

    Input, output, forward, bidirectional, random-access, and contiguous. Each category adds capabilities, and algorithms state the minimum category they require.

    ## Detailed answer

    Classic hierarchy:

    ```text
    Input / Output
        -> Forward
            -> Bidirectional
                -> Random Access
                    -> Contiguous (C++20 concept)
    ```

    ### Input iterator

    Single-pass reading.

    ### Output iterator

    Writes through traversal.

    ### Forward iterator

    Multi-pass forward traversal.

    ### Bidirectional iterator

    Adds decrement; used by list/set/map iterators.

    ### Random-access iterator

    Adds arithmetic, difference, ordering, indexing; vector/deque iterators.

    ### Contiguous iterator

    Random-access plus contiguous element layout; vector/array/string pointers/iterators under relevant rules.

    Algorithms require capabilities:

    ```text
    find          -> input iterator
    reverse       -> bidirectional iterator
    sort          -> random-access iterator
    ```

    C++20 iterator concepts refine the model and ranges may use different sentinel types for end.
  source: 12_cpp_standard_template_library_stl.md
- id: '12.11'
  topic: Standard Template Library (STL)
  question: Why can’t `std::sort` sort a `std::list`?
  answer: |-
    ## Short answer

    `std::sort` requires random-access iterators, while `list` provides bidirectional iterators. Use `list::sort`.

    ## Detailed answer

    ### Doubly linked list

    ```cpp
    std::list<int> values;
    ```

    Properties:

    - Bidirectional iterators.
    - O(1) insertion/erase given a valid position.
    - Stable iterators/references to other nodes.
    - O(1) splicing between compatible lists.
    - No random access.
    - Node allocation and pointer overhead per element.
    - Poor locality.

    ### Singly linked list

    ```cpp
    std::forward_list<int> values;
    ```

    Properties:

    - Forward iteration only.
    - Smaller node linkage.
    - Operations often use “before” positions (`insert_after`, `erase_after`).
    - No ordinary `size()` requirement historically due complexity/design goals.

    ### Why O(1) insertion may still be slower

    You must first reach the position, often O(n), and allocate a node. Vector's bulk memory movement can outperform lists due to locality.

    ### List-specific algorithms

    Because list iterators are not random-access:

    ```cpp
    values.sort();
    values.merge(other);
    values.unique();
    values.remove_if(predicate);
    ```

    Classic hierarchy:

    ```text
    Input / Output
        -> Forward
            -> Bidirectional
                -> Random Access
                    -> Contiguous (C++20 concept)
    ```

    ### Input iterator

    Single-pass reading.

    ### Output iterator

    Writes through traversal.

    ### Forward iterator

    Multi-pass forward traversal.

    ### Bidirectional iterator

    Adds decrement; used by list/set/map iterators.

    ### Random-access iterator

    Adds arithmetic, difference, ordering, indexing; vector/deque iterators.

    ### Contiguous iterator

    Random-access plus contiguous element layout; vector/array/string pointers/iterators under relevant rules.

    Algorithms require capabilities:

    ```text
    find          -> input iterator
    reverse       -> bidirectional iterator
    sort          -> random-access iterator
    ```

    C++20 iterator concepts refine the model and ranges may use different sentinel types for end.
  source: 12_cpp_standard_template_library_stl.md
- id: '12.12'
  topic: Standard Template Library (STL)
  question: What is the erase-remove pattern?
  answer: |-
    ## Short answer

    Algorithms such as `remove` move unwanted elements to the logical end and return a new end; the container’s `erase` then physically removes them. In C++20, `std::erase`/`std::erase_if` often express this directly.

    ## Detailed answer

    Algorithms do not know how to change a container's size.

    Classic:

    ```cpp
    auto new_end = std::remove_if(
        values.begin(),
        values.end(),
        predicate);

    values.erase(new_end, values.end());
    ```

    `remove_if` moves retained elements forward and returns a new logical end. It does not erase container elements.

    C++20 convenience:

    ```cpp
    std::erase_if(values, predicate);
    ```

    For list-like containers, member `remove_if` can unlink nodes directly.
  source: 12_cpp_standard_template_library_stl.md
- id: '12.13'
  topic: Standard Template Library (STL)
  question: Does `emplace_back` always outperform `push_back`?
  answer: |-
    ## Short answer

    No. It constructs from arguments in place and can avoid a temporary, but optimization and move costs may make performance equivalent; it can also permit conversions that are less explicit.

    ## Detailed answer

    ### `push_back`

    ```cpp
    values.push_back(Device{args});
    ```

    Takes an existing value and copies/moves it into the container.

    ### `emplace_back`

    ```cpp
    values.emplace_back(args);
    ```

    Forwards arguments to construct the element in container storage.

    ### Emplace is not always faster

    If an object already exists:

    ```cpp
    Device device;
    values.push_back(std::move(device));
    ```

    is clear and efficient.

    Emplace can:

    - Invoke explicit constructors unexpectedly.
    - Make conversions less visible.
    - Offer no advantage when a temporary is already created.
    - Still be followed by later vector reallocation/move.

    ### Map APIs

    ```cpp
    map.emplace(key, value);
    map.try_emplace(key, constructor_args...);
    map.insert_or_assign(key, value);
    ```

    `try_emplace` avoids constructing the mapped value when the key already exists in relevant cases.
  source: 12_cpp_standard_template_library_stl.md
- id: '12.14'
  topic: Standard Template Library (STL)
  question: What contract must a custom hash and equality function satisfy?
  answer: |-
    ## Short answer

    If two keys compare equal, they must produce the same hash. Unequal keys may collide, but excessive collisions hurt performance.

    ## Detailed answer

    ```cpp
    struct DeviceKey {
        int bus;
        int address;

        bool operator==(const DeviceKey&) const = default;
    };

    struct DeviceKeyHash {
        std::size_t operator()(const DeviceKey& key) const noexcept {
            std::size_t seed = std::hash<int>{}(key.bus);
            // combine address using a deliberate hash-combine strategy
            return seed;
        }
    };

    std::unordered_map<DeviceKey, Device, DeviceKeyHash> devices;
    ```

    A complete hash should incorporate all equality-relevant fields.

    Contract:

    ```text
    if equal(a, b), then hash(a) == hash(b)
    ```

    The reverse is not required; collisions are allowed.

    Avoid mutable key state that changes hash/equality while stored.

    Specializing `std::hash` for a user-defined type can be permitted under standard rules, but a separate hash functor is often explicit and local.
  source: 12_cpp_standard_template_library_stl.md
- id: '12.15'
  topic: Standard Template Library (STL)
  question: What is the main risk of ranges views?
  answer: |-
    ## Short answer

    Views are often lazy and non-owning, so the underlying range and any referenced callable state must remain alive and valid.

    ## Detailed answer

    Ranges algorithms accept whole ranges:

    ```cpp
    std::ranges::sort(values);
    auto found = std::ranges::find(values, target);
    ```

    Many support projections:

    ```cpp
    std::ranges::sort(devices, {}, &Device::priority);
    ```

    Views are lazy adaptors:

    ```cpp
    auto active_names =
        devices
        | std::views::filter(&Device::active)
        | std::views::transform(&Device::name);
    ```

    ### Benefits

    - Fewer mismatched begin/end errors.
    - Concepts state requirements.
    - Projections avoid custom comparator boilerplate.
    - Lazy composition avoids some temporary containers.

    ### Risks

    - Views may borrow and dangle.
    - Lazy work may repeat on repeated traversal.
    - Some ranges are single-pass.
    - Complex pipelines can obscure cost/control flow.
    - Compiler/library support varies by standard/toolchain.

    Ranges algorithms often return borrowed-aware result types; an iterator into a destroyed temporary may be represented as `std::ranges::dangling`.
  source: 12_cpp_standard_template_library_stl.md
- id: '12.16'
  topic: Standard Template Library (STL)
  question: Why does the initial value’s type matter in `std::accumulate`?
  answer: |-
    ## Short answer

    It determines the accumulator type. Starting a floating-point sum with `0` can accumulate as `int`; use a correctly typed initial value such as `0.0`.

    ## Detailed answer

    From `<numeric>`:

    ```cpp
    std::accumulate
    std::inner_product
    std::partial_sum
    std::adjacent_difference
    std::iota
    std::reduce
    std::transform_reduce
    std::exclusive_scan
    std::inclusive_scan
    ```

    ### Initial-value type matters

    ```cpp
    std::vector<std::int64_t> values;

    auto wrong = std::accumulate(values.begin(), values.end(), 0);
    auto right = std::accumulate(values.begin(), values.end(), std::int64_t{0});
    ```

    The accumulator type is derived from the initial value; `0` is `int` and may overflow/truncate.

    ### `reduce` versus `accumulate`

    `accumulate` is an ordered left fold. `reduce` permits reordering (especially with execution policies), so operations should be associative/commutative as required for intended results. Floating-point results may differ.
  source: 12_cpp_standard_template_library_stl.md
- id: '12.17'
  topic: Standard Template Library (STL)
  question: What do container adapters provide?
  answer: |-
    ## Short answer

    `stack` provides LIFO, `queue` provides FIFO, and `priority_queue` provides repeated access to the highest-priority element through a restricted underlying-container interface.

    ## Detailed answer

    Adapters provide restricted interfaces over another container.

    ### Stack

    ```cpp
    std::stack<int> stack;
    stack.push(1);
    stack.pop();
    stack.top();
    ```

    LIFO. Default underlying container is typically deque.

    ### Queue

    ```cpp
    std::queue<int> queue;
    queue.push(1);
    queue.pop();
    queue.front();
    queue.back();
    ```

    FIFO.

    ### Priority queue

    ```cpp
    std::priority_queue<int> priorities;
    ```

    Default is a max heap:

    ```cpp
    priorities.top(); // largest
    ```

    Min heap:

    ```cpp
    std::priority_queue<
        int,
        std::vector<int>,
        std::greater<int>
    > minimums;
    ```

    Adapters intentionally do not expose general iteration.
  source: 12_cpp_standard_template_library_stl.md
- id: '12.18'
  topic: Standard Template Library (STL)
  question: What extra questions matter before using STL facilities in embedded or real-time code?
  answer: |-
    ## Short answer

    Allocation timing, bounded capacity, iterator validity, exception policy, worst-case complexity, code size, allocator strategy, library support, and whether the operation is deterministic enough for the required context.

    ## Detailed answer

    Questions for every container/algorithm:

    - Does it allocate?
    - When can it reallocate?
    - What is worst-case complexity?
    - Can an operation throw?
    - What is per-element overhead?
    - Are addresses stable?
    - Is memory contiguous?
    - Can capacity be fixed/preallocated?
    - Is the allocator deterministic?
    - Does the implementation exist in the vendor library?

    ### Useful facilities

    ```cpp
    std::array
    std::span
    std::algorithm
    std::bitset
    ```

    These can support fixed storage and generic algorithms without heap ownership.

    `vector` may still be acceptable when constructed/pre-reserved during initialization and never grows on a real-time path, subject to project policy.

    Node/hash containers can fragment memory and create timing variability.
  source: 12_cpp_standard_template_library_stl.md
