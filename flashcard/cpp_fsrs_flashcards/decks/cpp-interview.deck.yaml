cards:
- id: '00.1'
  topic: C++ Study Plan
  question: What five areas should a C++ study plan cover?
  answer: |-
    ## Short answer

    Modern C++; data structures and algorithms; OOP and software design; operating systems, concurrency, and embedded systems; and embedded/autonomous-system design and debugging.

    ## Detailed answer

    A balanced plan should connect language knowledge to problem solving and system constraints. Modern C++ supplies safe ownership and expressive types; algorithms supply problem-solving patterns; OOP and design organize change; OS/concurrency explains execution and synchronization; embedded/system design adds timing, memory, hardware, failure recovery, and debugging constraints.

    Do not study these as isolated silos. For example, a producer-consumer exercise combines containers, ownership, concurrency, shutdown design, and complexity analysis.
  source: C++ study notes
- id: '00.2'
  topic: C++ Study Plan
  question: What is the recommended preparation-time split?
  answer: |-
    ## Short answer

    - Data structures and algorithms: 35%
    - Modern C++: 25%
    - Embedded, OS, and concurrency: 20%
    - OOP and design: 10%
    - System design, behavioral preparation, and applications: 10%

    ## Detailed answer

    The split is a starting budget, not a law. Use the largest block for coding practice because interviews require fluent implementation under time pressure. Keep modern C++ and systems work in the weekly loop so correct algorithms are also expressed with safe ownership, clear interfaces, and realistic concurrency assumptions.

    Rebalance using evidence: move time toward categories where timed practice, mock interviews, or review statistics show repeated misses.
  source: C++ study notes
- id: '00.3'
  topic: C++ Study Plan
  question: What should a strong coding-problem workflow look like?
  answer: |-
    ## Short answer

    Clarify requirements, give a brute-force solution, derive an optimized solution, state invariants, implement cleanly, test edge cases, and explain time and space complexity.

    ## Detailed answer

    You can solve most standard medium problems in approximately 25–35 minutes.

    You consistently:

    - Explain before coding
    - Use good variable names
    - Test edge cases
    - State complexity
    - Avoid compiler-level mistakes

    ---

    ### Concept diagram

    ```mermaid
    flowchart LR
        A[Clarify requirements] --> B[State brute force]
        B --> C[Derive optimized approach]
        C --> D[State invariant]
        D --> E[Implement]
        E --> F[Test edge cases]
        F --> G[Explain complexity]
    ```
  source: C++ study notes
- id: '00.4'
  topic: C++ Study Plan
  question: What are the Rule of Three, Rule of Five, and Rule of Zero?
  answer: |-
    ## Short answer

    - Rule of Three: if a type needs a custom destructor, copy constructor, or copy assignment, it often needs all three.
    - Rule of Five: add move constructor and move assignment.
    - Rule of Zero: prefer members that manage their own resources so the class declares none of these operations.

    ## Detailed answer

    These rules describe which special member functions a resource-owning type may need.

    - **Rule of Three:** if a type requires a custom destructor, copy constructor, or copy-assignment operator, it probably needs all three because those operations must agree on ownership.
    - **Rule of Five:** in modern C++, also consider the move constructor and move-assignment operator. Moves can transfer a resource instead of duplicating it.
    - **Rule of Zero:** the preferred design is to store resources in RAII members such as containers, strings, and smart pointers so the compiler-generated special members are already correct.

    ```cpp
    class Report {
    public:
        Report(std::string name, std::vector<int> values)
            : name_{std::move(name)}, values_{std::move(values)} {}

    private:
        std::string name_;
        std::vector<int> values_;
    }; // Rule of Zero: no custom destructor/copy/move code
    ```

    Do not implement all five mechanically. First decide whether the type should be copyable, movable, both, or neither. A unique operating-system handle, for example, is usually movable but not copyable.

    ### Concept diagram

    ```mermaid
    flowchart TD
        A[Does the type directly manage a resource?] -->|No| Z[Rule of Zero]
        A -->|Yes| B[Custom destructor/copy needed]
        B --> C[Rule of Three]
        C --> D[Add move operations]
        D --> E[Rule of Five]
    ```
  source: C++ study notes
- id: '00.5'
  topic: C++ Study Plan
  question: What is RAII?
  answer: |-
    ## Short answer

    Resource Acquisition Is Initialization ties resource ownership to object lifetime: acquire during construction, release during destruction. It provides deterministic cleanup during normal exit and exception unwinding.

    ## Detailed answer

    RAII makes cleanup a consequence of normal C++ lifetime rules. A constructor establishes a valid resource-owning object; its destructor releases the resource. When control leaves a scope—by normal return, early return, or exception—fully constructed local objects are destroyed in reverse order.

    A lock is the classic example:

    ```cpp
    void update(State& state, std::mutex& mutex) {
        std::lock_guard<std::mutex> lock{mutex};
        modify(state);
    } // lock is released automatically
    ```

    The same idea applies to memory (`std::unique_ptr`, containers), files (`std::fstream`), threads (`std::jthread`), and custom handles. RAII does not require dynamic allocation; an embedded program can use fixed-capacity objects and still use deterministic scope-based cleanup.

    A well-designed RAII type maintains a clear invariant: either construction succeeds and the object owns a valid resource, or construction fails without exposing a partially usable object. Destructors should release resources reliably and ordinarily must not throw.

    ### Concept diagram

    ```mermaid
    flowchart LR
        A[Enter scope] --> B[Construct RAII owner]
        B --> C[Use the resource]
        C --> D{How scope exits}
        D -->|Normal return| E[Destructor releases resource]
        D -->|Early return| E
        D -->|Exception| E
    ```
  source: C++ study notes
- id: '00.6'
  topic: C++ Study Plan
  question: When should you use `unique_ptr`, `shared_ptr`, and `weak_ptr`?
  answer: |-
    ## Short answer

    Use `unique_ptr` for exclusive ownership, `shared_ptr` only for genuine shared lifetime, and `weak_ptr` for non-owning observation of shared state or to break ownership cycles.

    ## Detailed answer

    Master:

    ```cpp
    std::unique_ptr
    std::shared_ptr
    std::weak_ptr
    std::make_unique
    std::make_shared
    ```

    ### `std::unique_ptr`

    Represents exclusive ownership.

    ```cpp
    auto sensor = std::make_unique<Sensor>();
    ```

    Ownership can move:

    ```cpp
    auto sensor2 = std::move(sensor);
    ```

    Afterward:

    ```cpp
    sensor == nullptr
    ```

    typically holds.

    Know why copying a `unique_ptr` is prohibited.

    ---

    ### `std::shared_ptr`

    Represents shared ownership.

    ```cpp
    auto sensor = std::make_shared<Sensor>();
    ```

    Understand:

    - Reference counting
    - Ownership semantics
    - Destruction behavior
    - Runtime overhead
    - Thread-safety limitations

    Do not use `shared_ptr` simply because ownership is unclear.

    Unclear ownership is often a design problem.

    ---

    ### `std::weak_ptr`

    Understand why it exists.

    Typical use:

    ```text
    Object A owns Object B
    Object B needs to refer back to Object A
    ```

    If both use `shared_ptr`, you may create an ownership cycle.

    A `weak_ptr` can break the cycle.

    ---
  source: C++ study notes
- id: '00.7'
  topic: C++ Study Plan
  question: What are the core SOLID principles?
  answer: |-
    ## Short answer

    Single Responsibility, Open/Closed, Liskov Substitution, Interface Segregation, and Dependency Inversion. They guide maintainable interfaces, but should be applied according to the design rather than mechanically.

    ## Detailed answer

    SOLID is a set of design heuristics, not a requirement to create many interfaces or classes.

    | Principle | Practical question |
    |---|---|
    | Single Responsibility | Does this unit have one cohesive reason to change? |
    | Open/Closed | Can expected variation be added through a stable extension point? |
    | Liskov Substitution | Can a derived implementation replace the base without surprising clients? |
    | Interface Segregation | Does each client depend only on operations it actually needs? |
    | Dependency Inversion | Does policy depend on abstractions rather than construction details? |

    ```cpp
    struct SensorReader {
        virtual Reading read() = 0;
        virtual ~SensorReader() = default;
    };

    class AlarmPolicy {
    public:
        explicit AlarmPolicy(SensorReader& sensor) : sensor_{sensor} {}
        bool should_alarm() { return sensor_.read().temperature > limit_; }
    private:
        SensorReader& sensor_;
        double limit_{80.0};
    };
    ```

    `AlarmPolicy` depends on the small `SensorReader` abstraction, so hardware and test implementations can be substituted. Apply the principles when they reduce coupling and clarify contracts; mechanical application can instead add indirection and complexity.
  source: C++ study notes
- id: '00.8'
  topic: C++ Study Plan
  question: Why prefer composition over inheritance?
  answer: |-
    ## Short answer

    Composition usually creates looser coupling, explicit ownership, and replaceable behavior. Use inheritance when there is a genuine substitutable “is-a” relationship or a required polymorphic interface.

    ## Detailed answer

    Composition builds a type from independently replaceable collaborators, which keeps ownership and dependencies visible. Inheritance permanently couples a derived type to a base contract and is appropriate when clients can safely substitute the derived object wherever the base is expected.

    ```cpp
    class ReportService {
    public:
        explicit ReportService(Renderer& renderer) : renderer_{renderer} {}
        void run(const Report& report) { renderer_.render(report); }
    private:
        Renderer& renderer_; // composed dependency; not owned
    };
    ```

    Prefer inheritance for an intentional polymorphic interface, not merely to reuse implementation.
  source: C++ study notes
- id: '00.9'
  topic: C++ Study Plan
  question: What algorithm patterns should be immediately recognizable?
  answer: |-
    ## Short answer

    Hashing, two pointers, sliding window, prefix sums, binary search, DFS/BFS, heaps, interval processing, greedy choice, backtracking, and dynamic programming.

    ## Detailed answer

    Recognize the signal behind each pattern: pair or partition constraints suggest two pointers; a contiguous subrange suggests sliding window or prefix sums; monotonic decisions suggest binary search; reachability suggests DFS/BFS; repeated best-next selection suggests a heap; overlapping subproblems suggest dynamic programming.

    In an interview, state the invariant before coding. For a sliding window, for example, explain what the current window represents, when it becomes invalid, and why moving the left boundary restores validity.
  source: C++ study notes
- id: '00.10'
  topic: C++ Study Plan
  question: What must be stated when discussing a concurrent design?
  answer: |-
    ## Short answer

    Shared state, synchronization mechanism, ownership and lifetime, ordering requirements, data-race prevention, deadlock risks, blocking behavior, and shutdown/cancellation behavior.

    ## Detailed answer

    Start by naming every piece of shared mutable state and which thread or task owns it. Then define how access is synchronized: mutex, atomic operation, message passing, immutable snapshot, or single-thread confinement. “It uses a mutex” is incomplete unless the protected invariant and locking scope are clear.

    Discuss ordering and progress properties as well:

    - Which events must happen-before other events?
    - Can operations block, starve, deadlock, or suffer priority inversion?
    - What wakes a waiting thread, and is the condition checked in a loop?
    - How are cancellation, shutdown, errors, and partially completed work handled?
    - Which objects must remain alive until background work finishes?

    ```cpp
    std::mutex mutex;
    std::condition_variable ready;
    bool stopping = false;
    std::queue<Job> jobs;

    ready.wait(lock, [&] { return stopping || !jobs.empty(); });
    ```

    Finally, state how the design will be tested: stress tests, race detectors, deterministic scheduling where possible, and explicit shutdown tests.
  source: C++ study notes
- id: '00.11'
  topic: C++ Study Plan
  question: What changes when evaluating code for embedded or real-time use?
  answer: |-
    ## Short answer

    Consider deterministic timing, bounded memory use, allocation policy, interrupt context, hardware access, concurrency, error recovery, watchdogs, and worst-case rather than average-case behavior.

    ## Detailed answer

    Embedded and real-time evaluation focuses on bounds and failure modes rather than only average throughput. Ask for worst-case execution time, maximum memory use, stack depth, allocation behavior, interrupt latency, scheduling policy, and the consequences of missing a deadline.

    Hardware access adds constraints that ordinary desktop code may not have:

    - memory-mapped I/O and the correct use of `volatile` or platform primitives;
    - interrupt-safe communication and minimal ISR work;
    - DMA/cache coherency and alignment requirements;
    - watchdog servicing and recovery after partial failure;
    - bounded queues and defined overload behavior;
    - no hidden unbounded allocation or blocking on critical paths.

    ```cpp
    // Sketch only: the platform API defines the required ordering semantics.
    volatile std::uint32_t* const status = status_register_address;
    const auto snapshot = *status;
    ```

    `volatile` describes observable accesses; it does not provide thread synchronization. Use the platform's atomic, barrier, or critical-section facilities where concurrency or device ordering requires them.
  source: C++ study notes
- id: '00.12'
  topic: C++ Study Plan
  question: When are you ready to apply what you have studied?
  answer: |-
    ## Short answer

    When you can solve unfamiliar problems while communicating clearly, write and debug modern C++, reason about ownership and concurrency, discuss embedded tradeoffs, and explain prior projects and failures with evidence.

    ## Detailed answer

    Readiness is demonstrated under realistic constraints, not by finishing a reading list. You should be able to clarify an unfamiliar problem, choose a defensible design, implement it without relying on accidental behavior, test edge cases, and explain complexity and tradeoffs aloud.

    Use timed problems and mock interviews as the final feedback loop. A weak result identifies the next practice target; it is not a reason to restart the entire curriculum.
  source: C++ study notes
- id: '01.1'
  topic: References vs Pointers
  question: What is the core difference between a pointer and a reference?
  answer: |-
    ## Short answer

    A pointer is an object that stores an address. A reference is an alias for another object.

    ## Detailed answer

    ```cpp
    int x = 10;

    int* p = &x;
    ```

    Access the object through dereferencing:

    ```cpp
    *p = 20;
    ```

    You explicitly say:

    > Follow this address.

    ```cpp
    int& r = x;
    ```

    No explicit dereference is required:

    ```cpp
    r = 20;
    ```

    It looks exactly as though you're manipulating `x`.

    ```cpp
    int x = 10;
    int& r = x;

    r++;

    std::cout << x;  // 11
    ```

    ---

    # 4. References Must Be Initialized

    This is valid:

    ```cpp
    int* p;
    ```

    Although `p` is uninitialized and using it would be dangerous.

    This is not valid:

    ```cpp
    int& r;
    ```

    A reference needs an object immediately:

    ```cpp
    int x = 10;
    int& r = x;
    ```

    The language is expressing:

    > A reference must refer to something.

    This is why references work well for APIs where an argument is required.

    ---

    # 5. Pointers Can Be Null

    A pointer can deliberately represent:

    > No object.

    ```cpp
    int* p = nullptr;
    ```

    Then you can check it:

    ```cpp
    if (p != nullptr) {
        std::cout << *p;
    }
    ```

    This makes pointers useful when the relationship is optional.

    For example:

    ```cpp
    void configure(Device* device)
    {
        if (device != nullptr) {
            device->configure();
        }
    }
    ```

    A normal reference cannot intentionally represent “nothing”:

    ```cpp
    void configure(Device& device)
    {
        device.configure();
    }
    ```

    The API tells the caller:

    > You must give me a `Device`.

    A useful default rule is:

    ```text
    T&  -> object required
    T*  -> object may be absent
    ```

    This is not universal, but it is a strong default.

    ---

    # 6. Can References Be Null?

    At the C++ language-model level, a valid reference must refer to an object.

    Do not do this:

    ```cpp
    int* p = nullptr;
    int& r = *p;
    ```

    This enters undefined-behavior territory.

    Do not treat “null references” as a valid C++ state.

    When you see:

    ```cpp
    T&
    ```

    design your reasoning around the idea that an actual object is required.

    ---

    # 7. References Cannot Be Reseated

    This distinction is extremely important.

    With a pointer:

    ```cpp
    int x = 10;
    int y = 20;

    int* p = &x;

    p = &y;
    ```

    Initially:

    ```text
    p -> x
    ```

    After reassignment:

    ```text
    p -> y
    ```

    Pointers can change what they point to.

    Now consider a reference:

    ```cpp
    int x = 10;
    int y = 20;

    int& r = x;

    r = y;
    ```

    This does **not** make `r` reference `y`.

    It means:

    ```cpp
    x = y;
    ```

    because `r` remains an alias for `x`.

    Afterward:

    ```cpp
    x == 20
    y == 20
    ```

    and:

    ```cpp
    &r == &x
    ```

    The reference remains bound to `x`.

    Conceptually:

    ```cpp
    int& r = x;    // binding happens here

    r = y;         // assignment to x, NOT rebinding
    ```

    This is one of the most important interview-level reference concepts.

    ---

    # 8. A Pointer Itself Is an Object

    ```cpp
    int x = 10;
    int* p = &x;
    ```

    `p` itself occupies storage.

    For example, on many 64-bit systems:

    ```cpp
    sizeof(p)
    ```

    will be 8 bytes.

    And:

    ```cpp
    &p
    ```

    is meaningful.

    You can have:

    ```cpp
    int** pp = &p;
    ```

    because `p` itself is an object.

    References have different language semantics. They are aliases rather than pointer-like objects in the C++ abstract machine.

    If:

    ```cpp
    int x;
    int& r = x;
    ```

    then:

    ```cpp
    sizeof(r)
    ```

    is:

    ```cpp
    sizeof(int)
    ```

    not “the size of a reference.”

    You're asking for the size of the referred-to expression.

    ---

    # 9. How Are References Implemented?

    The C++ language does not require a reference to be internally implemented as a pointer.

    However, compilers frequently implement references using addresses when necessary.

    For example:

    ```cpp
    void increment(int& x)
    {
        ++x;
    }
    ```

    may compile into machine code conceptually similar to:

    ```cpp
    void increment(int* x)
    {
        ++(*x);
    }
    ```

    At the ABI or machine-code level, an address may be passed in a register.

    But this does **not** mean:

    > A C++ reference is just a pointer.

    That confuses implementation with language semantics.

    A strong interview answer is:

    > References are aliases semantically. A compiler may implement them using addresses under the hood, but C++ gives references stronger semantic constraints than pointers, such as mandatory initialization and no reseating.

    ---

    # 10. Passing by Value vs Pointer vs Reference
  source: 01_cpp_references_vs_pointers.md
- id: '01.2'
  topic: References vs Pointers
  question: What contracts do `T&`, `const T&`, `T*`, and `const T*` express?
  answer: |-
    ## Short answer

    - `T&`: required, mutable, non-owning alias.
    - `const T&`: required, read-only through this alias, non-owning.
    - `T*`: nullable and reseatable address, normally non-owning.
    - `const T*`: nullable, reseatable pointer giving read-only access to `T`.

    ## Detailed answer

    These types communicate two independent API properties: whether the argument is required and whether mutation is allowed through that access path.

    | Type | Nullable? | Reseatable? | Mutation through it? | Typical meaning |
    |---|---:|---:|---:|---|
    | `T&` | No | No | Yes | required mutable borrow |
    | `const T&` | No | No | No | required read-only borrow |
    | `T*` | Yes | Yes | Yes | optional mutable borrow |
    | `const T*` | Yes | Yes | No | optional read-only borrow |

    None of these types normally owns the object. Use an owning value, container, or smart pointer when ownership transfer or sharing is part of the contract.
  source: 01_cpp_references_vs_pointers.md
- id: '01.3'
  topic: References vs Pointers
  question: What does `ref = other;` do?
  answer: |-
    ## Short answer

    It assigns `other` to the object already named by `ref`; it does not reseat the reference.

    ## Detailed answer

    A reference is bound during initialization and is not later reseated. Assignment through a reference therefore invokes assignment on the referred object.

    ```cpp
    int first = 1;
    int second = 9;
    int& ref = first;

    ref = second; // assigns 9 to first; ref still aliases first
    ```

    After the assignment, both `first` and `second` contain `9`, and `&ref == &first` remains true. By contrast, assigning a pointer changes the stored address:

    ```cpp
    int* ptr = &first;
    ptr = &second; // ptr is now reseated
    ```

    This distinction is why a reference expresses one stable alias while a pointer can represent a changing traversal or optional target.
  source: 01_cpp_references_vs_pointers.md
- id: '01.4'
  topic: References vs Pointers
  question: Can a valid reference be null or be reseated?
  answer: |-
    ## Short answer

    No. A reference must be initialized and cannot later be reseated. Invalid tricks can manufacture a bad reference, but using one has undefined behavior and is not a valid optional-state design.

    ## Detailed answer

    A reference must be bound to an object when it is initialized, and the language provides no operation that reseats it. This makes `T&` a good syntax-level expression of “required object.”

    ```cpp
    void update(Device& device);  // caller must provide a Device
    void update(Device* device);  // nullptr can represent absence
    ```

    Low-level tricks can form an invalid reference—for example, dereferencing a null pointer—but using the result has undefined behavior. That does not make null a supported reference state.

    A reference can still dangle after its target's lifetime ends. Non-nullability and lifetime safety are separate properties: the type prevents an intentional empty value, but the program must still guarantee that the referred object remains alive.
  source: 01_cpp_references_vs_pointers.md
- id: '01.5'
  topic: References vs Pointers
  question: Do raw pointers or references express ownership?
  answer: |-
    ## Short answer

    Normally no. Modern interfaces should express ownership with RAII types such as `unique_ptr`, `shared_ptr`, containers, or resource-owning classes.

    ## Detailed answer

    A raw pointer or reference normally describes access, not lifetime management. The caller must ensure the referred object outlives every use. Ownership should be explicit in the type: a value or container owns its state, `std::unique_ptr<T>` expresses exclusive ownership, and `std::shared_ptr<T>` expresses shared lifetime.

    A raw pointer can technically point to dynamically allocated storage, but the pointer type alone does not say who must release it. That ambiguity is why owning raw pointers are avoided in modern interfaces.
  source: 01_cpp_references_vs_pointers.md
- id: '01.6'
  topic: References vs Pointers
  question: Can pointers and references dangle?
  answer: |-
    ## Short answer

    Yes. Neither keeps the target alive. The target object must outlive every use, and container operations may invalidate existing handles.

    ## Detailed answer

    Both can dangle because neither extends the target's lifetime. Common causes include returning a handle to a local variable, retaining a handle after its owner is destroyed, vector reallocation, erasing a container element, and asynchronous callbacks that outlive captured objects.

    ```cpp
    const int& bad() {
        int local = 42;
        return local; // dangling immediately after return
    }
    ```

    A reference's non-null syntax is not a lifetime guarantee; lifetime must still be established by design.
  source: 01_cpp_references_vs_pointers.md
- id: '01.7'
  topic: References vs Pointers
  question: When should an input be passed by value?
  answer: |-
    ## Short answer

    For small, cheap-to-copy values, or when the function deliberately needs its own value. A by-value sink can then move from its parameter.

    ## Detailed answer

    Pass small scalar or cheaply copied value types by value because the callee receives an independent value and the interface is simple. Also pass by value when the function needs to store or transform its own copy; callers can copy lvalues or move rvalues into the parameter.

    ```cpp
    class Worker {
    public:
        explicit Worker(std::string name) : name_{std::move(name)} {}
    private:
        std::string name_;
    };
    ```

    This “value then move” sink pattern is often a good tradeoff when the function unconditionally retains the argument. It can be less suitable when copying an lvalue is expensive and the function may not keep it, or when separate `const T&` and `T&&` overloads are justified by measured performance.

    Do not apply a fixed byte-size rule blindly. Consider copy cost, ownership intent, ABI conventions, and whether the type is a lightweight view such as `std::span` or `std::string_view`.
  source: 01_cpp_references_vs_pointers.md
- id: '01.8'
  topic: References vs Pointers
  question: When should an API use a reference versus a pointer?
  answer: |-
    ## Short answer

    Use `const T&` for required read-only access, `T&` for required mutation, and `const T*` or `T*` when absence is meaningful.

    ## Detailed answer

    Choose the parameter type from the contract rather than from a blanket performance rule:

    | Contract | Typical parameter |
    |---|---|
    | Required, read-only borrow | `const T&` |
    | Required, mutable borrow | `T&` |
    | Optional, read-only borrow | `const T*` |
    | Optional, mutable borrow | `T*` |
    | Transfer exclusive ownership | `std::unique_ptr<T>` |
    | Share lifetime | `std::shared_ptr<T>` only when genuinely required |

    ```cpp
    void inspect(const Device& device);
    void reset(Device& device);
    void inspect_if_present(const Device* device);
    void install(std::unique_ptr<Device> device);
    ```

    References make required presence obvious and avoid repeated null checks. Pointers make optionality and reseating visible. Neither raw form normally owns the object, so document the lifetime relationship when it is not self-evident. For contiguous sequences, prefer a range/view type such as `std::span<T>` over a pointer-plus-unrelated-length pair.

    ### Concept diagram

    ```mermaid
    flowchart TD
        A[Borrowed parameter] --> B{May it be absent?}
        B -->|Yes| C{May callee mutate it?}
        C -->|Yes| D[T pointer]
        C -->|No| E[const T pointer]
        B -->|No| F{May callee mutate it?}
        F -->|Yes| G[T reference]
        F -->|No| H[const T reference]
    ```
  source: 01_cpp_references_vs_pointers.md
- id: '01.9'
  topic: References vs Pointers
  question: What should represent a borrowed contiguous buffer?
  answer: |-
    ## Short answer

    Prefer `std::span<T>` when available because it carries both address and length without ownership. A naked pointer alone does not describe the range size.

    ## Detailed answer

    Use `std::span<T>` for a borrowed contiguous sequence when C++20 is available. It carries a pointer and an element count together, supports arrays, vectors, and pointer/count sources, and does not own or extend the lifetime of the elements.

    ```cpp
    void normalize(std::span<float> samples) {
        for (float& sample : samples) {
            sample = std::clamp(sample, -1.0f, 1.0f);
        }
    }

    std::array<float, 128> buffer{};
    normalize(buffer);
    ```

    Use `std::span<const T>` for read-only access. A naked `T*` does not communicate the number of elements; a C-style pointer plus length can work at an ABI boundary, but the pair should be wrapped into a span as soon as practical. The caller must keep the underlying storage alive and avoid invalidating it while the span is used.
  source: 01_cpp_references_vs_pointers.md
- id: '01.10'
  topic: References vs Pointers
  question: What is the difference between `const T*` and `T* const`?
  answer: |-
    ## Short answer

    `const T*` is a reseatable pointer to read-only `T`. `T* const` is a fixed pointer to mutable `T`. `const T* const` fixes both access and pointer value.

    ## Detailed answer

    ```cpp
    const int* p = &x;
    ```

    Equivalent:

    ```cpp
    int const* p = &x;
    ```

    You cannot modify `x` through `p`:

    ```cpp
    *p = 10;   // error
    ```

    But you can change the pointer:

    ```cpp
    p = &y;
    ```

    Think:

    ```text
    pointer is mutable
    pointee is const
    ```

    ```cpp
    int* const p = &x;
    ```

    You can modify the object:

    ```cpp
    *p = 20;
    ```

    but cannot reseat the pointer:

    ```cpp
    p = &y;   // error
    ```

    Think:

    ```text
    pointer is const
    pointee is mutable
    ```
  source: 01_cpp_references_vs_pointers.md
- id: '01.11'
  topic: References vs Pointers
  question: Why are arrays of references disallowed, while pointer arrays are valid?
  answer: |-
    ## Short answer

    References are not ordinary reseatable objects with independent value semantics. Pointers are objects, so they can be stored, copied, assigned, and placed in arrays.

    ## Detailed answer

    An array element must be an object with its own storage, size, and assignable element semantics. References are aliases rather than objects, cannot be reseated, and do not satisfy those requirements. Pointers are ordinary objects, so an array can store and assign pointer values.

    Use `std::reference_wrapper<T>` when a reseatable, storable reference-like element is needed:

    ```cpp
    std::array<std::reference_wrapper<int>, 2> refs{x, y};
    refs[0].get() = 7;
    ```
  source: 01_cpp_references_vs_pointers.md
- id: '01.12'
  topic: References vs Pointers
  question: When is returning a reference safe?
  answer: |-
    ## Short answer

    Only when the referred-to object outlives the caller’s use—for example, an element of a still-live object or a valid static object. Never return a reference or pointer to a local automatic object.

    ## Detailed answer

    Returning a reference is safe only when the referred object is guaranteed to outlive the caller's use of the result. Typical safe sources are the object itself (`return *this`), a member of a sufficiently long-lived object, or an element in a container whose lifetime and invalidation rules are understood.

    Never return a reference to a local automatic object. Also document invalidation: a reference to a vector element may become invalid after reallocation even though the vector itself remains alive.
  source: 01_cpp_references_vs_pointers.md
- id: '02.1'
  topic: '`const` Syntax and Meaning'
  question: What is the best mental model for `const`?
  answer: |-
    ## Short answer

    `const` prevents mutation through a particular access path. It is a compile-time interface guarantee, not necessarily global or deep immutability.

    ## Detailed answer

    A useful definition is:

    > `const` prevents mutation through a particular access path.

    ```cpp
    int value = 10;
    const int& view = value;

    // view = 20; // error
    value = 20;   // valid
    ```

    `view` does not freeze `value`. It only refuses to provide a mutable operation through `view`.

    This distinction matters in APIs:

    ```cpp
    void inspect(const Sensor& sensor);
    ```

    The function promises not to mutate `sensor` through this reference. It does not prove that another thread or another alias cannot mutate the same `Sensor`.

    ### Why this model is better than "const means immutable"

    "Immutable" often suggests the value can never change. C++ `const` is usually shallower and more local:

    - Another non-const alias may modify the object.
    - A pointer member may point to mutable external data.
    - `mutable` members may change inside const member functions.
    - Hardware or another thread may change externally observed state.
  source: C++ study notes
- id: '02.2'
  topic: '`const` Syntax and Meaning'
  question: Why must a const object be initialized?
  answer: |-
    ## Short answer

    Because ordinary assignment is unavailable after initialization. Its initial state must be established when the object is created.

    ## Detailed answer

    ```cpp
    const int limit = 100;
    ```

    A const object must be given its state during initialization because ordinary assignment is unavailable afterward:

    ```cpp
    // const int limit; // error for a local scalar: no initializer
    // limit = 100;
    ```

    For class types, construction establishes the const object's initial state:

    ```cpp
    class Device {
    public:
        explicit Device(int id) : id_{id} {}

        int id() const { return id_; }

    private:
        int id_;
    };

    const Device device{42};
    ```

    The constructor can initialize the members. After construction, only operations allowed by the const interface may be called.

    ### Const data members

    ```cpp
    class Packet {
    public:
        Packet(int sequence, int payload)
            : sequence_{sequence},
              payload_{payload} {}

    private:
        const int sequence_;
        int payload_;
    };
    ```

    `sequence_` must be initialized in the member-initializer list. Assignment in the constructor body would be too late because the member already exists by then.

    ### Tradeoff

    A const data member can communicate a strong invariant, but it can also disable or complicate assignment for the containing class. Often a private ordinary member with no mutating public operation provides adequate encapsulation while leaving the type assignable.
  source: C++ study notes
- id: '02.3'
  topic: '`const` Syntax and Meaning'
  question: Are `const int*` and `int const*` different?
  answer: |-
    ## Short answer

    No. Both are pointers to const `int`.

    ## Detailed answer

    A pointer introduces two independently qualifiable objects:

    1. The pointed-to object.
    2. The pointer object itself.

    ### Pointer to const

    ```cpp
    int x = 10;
    int y = 20;

    const int* p = &x;
    // *p = 11; // error
    p = &y;     // valid
    ```

    The pointer is reseatable, but it provides read-only access to the `int`.

    These spellings are equivalent:

    ```cpp
    const int* p;
    int const* p;
    ```

    ### Const pointer

    ```cpp
    int x = 10;
    int y = 20;

    int* const p = &x;
    *p = 11;   // valid
    // p = &y; // error
    ```

    The pointer's stored address is fixed, but the pointed-to value is mutable.

    ### Const pointer to const

    ```cpp
    const int x = 10;
    const int* const p = &x;

    // *p = 11; // error
    // p = &y;  // error
    ```

    Neither the pointer nor the pointed-to object can be changed through `p`.

    ### Reading difficult declarations

    Start at the identifier and work outward:

    ```cpp
    const Widget* const handle;
    ```

    - `handle` is const.
    - It is a pointer.
    - It points to a const `Widget`.

    Type aliases can make const placement surprising:

    ```cpp
    using IntPtr = int*;

    int value = 0;
    IntPtr const p = &value; // int* const, not const int*
    ```

    `const` qualifies the alias as one complete type.

    ### Conversion direction

    A pointer to mutable data can convert to a pointer to const data:

    ```cpp
    int* mutable_ptr = &x;
    const int* read_only_ptr = mutable_ptr;
    ```

    The reverse is rejected because it would discard a safety guarantee:

    ```cpp
    const int* read_only_ptr = &x;
    // int* mutable_ptr = read_only_ptr; // error
    ```
  source: C++ study notes
- id: '02.4'
  topic: '`const` Syntax and Meaning'
  question: What is top-level versus low-level const?
  answer: |-
    ## Short answer

    Top-level const qualifies the object itself, such as the pointer in `T* const`. Low-level const qualifies an object reached through another type, such as the pointee in `const T*`.

    ## Detailed answer

    Top-level const qualifies the object itself:

    ```cpp
    const int value = 10; // value itself is const
    int* const p = &x;    // p itself is const
    ```

    Low-level const is nested inside another type:

    ```cpp
    const int* p = &value; // pointed-to int is const
    const int& r = value;  // referred-to int is const
    ```

    ### Copying drops top-level const

    ```cpp
    const int source = 10;
    int copy = source; // valid
    ```

    `copy` is a new object. The fact that `source` could not be modified does not require the copy to be const.

    Low-level const cannot be discarded implicitly:

    ```cpp
    const int* source_ptr = &source;
    // int* mutable_ptr = source_ptr; // error
    ```

    ### Function parameters

    For by-value parameters, top-level const is not part of the callable interface:

    ```cpp
    void f(int value);
    // void f(const int value); // redeclaration of the same function, not an overload
    ```

    Inside the function definition, adding const can still prevent accidental local modification:

    ```cpp
    void f(const int value) {
        // value = 2; // error inside this function
    }
    ```

    For pointers and references, const applies to the caller's object and does affect the interface:

    ```cpp
    void inspect(const Device& device);
    void update(Device& device);
    ```
  source: C++ study notes
- id: '02.5'
  topic: '`const` Syntax and Meaning'
  question: Can `const T&` bind to a mutable object or temporary?
  answer: |-
    ## Short answer

    Yes. It prevents mutation through that reference. Direct binding can also extend a temporary’s lifetime under the language’s lifetime-extension rules.

    ## Detailed answer

    ```cpp
    std::string name = "camera";
    const std::string& ref = name;
    ```

    `ref`:

    - Must be initialized.
    - Cannot be reseated.
    - Does not own `name`.
    - Cannot modify `name` through this reference.
    - Can still dangle if `name` dies first.

    ### Binding to mutable objects

    ```cpp
    int x = 10;
    const int& r = x;

    x = 20;
    std::cout << r; // 20
    ```

    The reference observes the same object. Const controls permission, not whether the value may change elsewhere.

    ### Binding to temporaries

    A const lvalue reference can bind to a temporary:

    ```cpp
    const std::string& text = std::string{"hello"};
    ```

    In this direct local binding, the temporary's lifetime is extended to the lifetime of `text`.

    A function parameter can also bind to a temporary:

    ```cpp
    void print(const std::string& text);

    print("hello");
    ```

    The temporary survives through the full expression containing the call, which is enough for `print`. Storing a pointer or reference to it for later would be dangerous.

    ### Why `const T&` is common

    For a large object, it avoids a copy while expressing required read-only borrowing:

    ```cpp
    void process(const std::vector<int>& values);
    ```

    For a small type such as `int`, pass by value is normally simpler:

    ```cpp
    void set_limit(int limit);
    ```
  source: C++ study notes
- id: '02.6'
  topic: '`const` Syntax and Meaning'
  question: Can free functions overload on top-level const of a by-value parameter?
  answer: |-
    ## Short answer

    No. `void f(int)` and `void f(const int)` are the same function type for overload purposes.

    ## Detailed answer

    Top-level const qualifies the object itself:

    ```cpp
    const int value = 10; // value itself is const
    int* const p = &x;    // p itself is const
    ```

    Low-level const is nested inside another type:

    ```cpp
    const int* p = &value; // pointed-to int is const
    const int& r = value;  // referred-to int is const
    ```

    ### Copying drops top-level const

    ```cpp
    const int source = 10;
    int copy = source; // valid
    ```

    `copy` is a new object. The fact that `source` could not be modified does not require the copy to be const.

    Low-level const cannot be discarded implicitly:

    ```cpp
    const int* source_ptr = &source;
    // int* mutable_ptr = source_ptr; // error
    ```

    ### Function parameters

    For by-value parameters, top-level const is not part of the callable interface:

    ```cpp
    void f(int value);
    // void f(const int value); // redeclaration of the same function, not an overload
    ```

    Inside the function definition, adding const can still prevent accidental local modification:

    ```cpp
    void f(const int value) {
        // value = 2; // error inside this function
    }
    ```

    For pointers and references, const applies to the caller's object and does affect the interface:

    ```cpp
    void inspect(const Device& device);
    void update(Device& device);
    ```
  source: C++ study notes
- id: '02.7'
  topic: '`const` Syntax and Meaning'
  question: What does a trailing `const` on a member function mean?
  answer: |-
    ## Short answer

    It makes the implicit object parameter const for that call, prevents ordinary direct mutation through `this`, and allows the function to be called on const objects.

    ## Detailed answer

    ```cpp
    class Sensor {
    public:
        int value() const {
            return value_;
        }

    private:
        int value_{};
    };
    ```

    The trailing const:

    ```cpp
    int value() const
    ```

    qualifies the implicit object parameter. A useful conceptual model is:

    ```cpp
    int value(const Sensor& self);
    ```

    Inside a const member function:

    - Ordinary data members cannot be modified.
    - Only other const member functions can normally be called.
    - `this` provides access to a const `Sensor`.

    A const object can call only const-qualified operations:

    ```cpp
    const Sensor sensor;
    int value = sensor.value();
    ```

    A non-const object can call both const and non-const operations.

    ### What const member functions do not guarantee

    They do not automatically guarantee:

    - No externally visible changes.
    - No mutation through pointer members.
    - Thread safety.
    - No I/O.
    - No changes to `mutable` members.

    They primarily enforce the C++ type-system rules for the object's direct state.
  source: C++ study notes
- id: '02.8'
  topic: '`const` Syntax and Meaning'
  question: Why provide const and non-const accessor overloads?
  answer: |-
    ## Short answer

    So mutable objects may receive writable access while const objects receive read-only access, for example `T& operator[](...)` and `const T& operator[](...) const`.

    ## Detailed answer

    A class can provide mutable and read-only access:

    ```cpp
    class Buffer {
    public:
        int& operator[](std::size_t index) {
            return data_[index];
        }

        const int& operator[](std::size_t index) const {
            return data_[index];
        }

    private:
        int data_[10]{};
    };
    ```

    Usage:

    ```cpp
    Buffer writable;
    writable[3] = 42;       // non-const overload returns int&
    int x = writable[3];    // still selects the non-const overload

    const Buffer read_only;
    int y = read_only[3];   // const overload returns const int&
    // read_only[3] = 42;   // error
    ```

    The object's constness selects the overload, not how the returned result will later be used.

    ### Conceptual overloads

    ```cpp
    int& subscript(Buffer& self, std::size_t index);
    const int& subscript(const Buffer& self, std::size_t index);
    ```

    For a mutable object, binding to `Buffer&` is the better match. For a const object, only `const Buffer&` is valid.

    ### Return type alone cannot overload

    ```cpp
    int& operator[](std::size_t);
    const int& operator[](std::size_t); // error: differs only by return type
    ```

    The trailing member-function const is what creates distinct overloads.

    ### Reducing duplication

    A simple function can be duplicated safely. More complicated implementations sometimes centralize the const version and carefully delegate from the non-const version, but clarity is usually more valuable than clever casting. C++23 explicit object parameters can also reduce duplication in supported codebases.
  source: C++ study notes
- id: '02.9'
  topic: '`const` Syntax and Meaning'
  question: What is logical constness, and what is `mutable` for?
  answer: |-
    ## Short answer

    Logical constness means the externally observable value does not change. `mutable` permits implementation-only state such as caches or mutexes to change in a const operation.

    ## Detailed answer

    Bitwise constness means direct non-mutable data members are unchanged. Logical constness asks whether the object's externally meaningful state is unchanged.

    A cache can change without changing the abstract value:

    ```cpp
    class Measurement {
    public:
        double converted() const {
            if (!cache_valid_) {
                cached_value_ = calculate();
                cache_valid_ = true;
            }
            return cached_value_;
        }

    private:
        double calculate() const;

        mutable bool cache_valid_{false};
        mutable double cached_value_{};
    };
    ```

    `mutable` permits those members to change in const member functions.

    Another legitimate use is synchronization:

    ```cpp
    class Counter {
    public:
        int value() const {
            std::lock_guard lock{mutex_};
            return value_;
        }

    private:
        mutable std::mutex mutex_;
        int value_{};
    };
    ```

    Locking the mutex changes the mutex's internal state but not the logical value of `Counter`.

    ### Tradeoff

    `mutable` can preserve a clean const API, but overuse can make `const` misleading. Do not mark business state mutable merely to avoid designing the right mutating operation.
  source: C++ study notes
- id: '02.10'
  topic: '`const` Syntax and Meaning'
  question: When is mutation after `const_cast` undefined behavior?
  answer: |-
    ## Short answer

    When the underlying object was originally declared const. Casting away const from an originally mutable object can be legal, but is usually a design smell.

    ## Detailed answer

    `const_cast` can add or remove cv-qualification:

    ```cpp
    void legacy_api(char* text);

    void call_legacy(const char* text) {
        legacy_api(const_cast<char*>(text));
    }
    ```

    This is safe only if `legacy_api` truly does not modify the characters and its signature is merely outdated.

    ### Originally mutable object

    ```cpp
    int value = 10;
    const int& read_only = value;
    int& mutable_again = const_cast<int&>(read_only);
    mutable_again = 20; // defined because the original object is non-const
    ```

    Although defined, this often indicates a poor interface.

    ### Originally const object

    ```cpp
    const int value = 10;
    int& dangerous = const_cast<int&>(value);
    dangerous = 20; // undefined behavior
    ```

    The cast can compile, but it cannot make an originally const object safely writable.
  source: C++ study notes
- id: '02.11'
  topic: '`const` Syntax and Meaning'
  question: How does plain `auto` treat top-level const and references?
  answer: |-
    ## Short answer

    Plain `auto` normally drops references and top-level const, similar to template by-value deduction. Write `auto&`, `const auto&`, or `auto&&` when those semantics matter.

    ## Detailed answer

    Plain `auto` usually drops top-level const and references:

    ```cpp
    const int value = 10;
    const int& ref = value;

    auto a = value; // int
    auto b = ref;   // int
    ```

    Use qualifiers explicitly when needed:

    ```cpp
    const auto& c = ref; // const int&
    auto& d = ref;       // const int&; referred-to const is preserved
    ```

    `decltype(auto)` preserves the declaration form more exactly:

    ```cpp
    decltype(auto) e = (ref); // const int&
    ```

    Parentheses matter with `decltype`.

    ### Template deduction

    For a by-value template parameter, top-level const is generally dropped:

    ```cpp
    template<class T>
    void by_value(T value);
    ```

    For reference parameters, referred-to const participates in deduction:

    ```cpp
    template<class T>
    void by_reference(T& value);
    ```

    Passing a `const int` makes `T` deduce as `const int`.
  source: C++ study notes
- id: '02.12'
  topic: '`const` Syntax and Meaning'
  question: Does `const` imply thread safety or replace `volatile` for MMIO?
  answer: |-
    ## Short answer

    No. `const` is not synchronization, and `volatile` serves a different purpose for observable accesses such as memory-mapped I/O. Neither makes concurrent non-atomic access race-free.

    ## Detailed answer

    A const member function is not automatically thread-safe:

    ```cpp
    class Statistics {
    public:
        int sample_count() const {
            return samples_.size();
        }

        void add_sample(int value) {
            samples_.push_back(value);
        }

    private:
        std::vector<int> samples_;
    };
    ```

    Calling `sample_count()` concurrently with `add_sample()` without synchronization can cause a data race, even though the first function is const.

    Const says that a function does not mutate ordinary members through its own access path. Thread safety concerns all concurrent accesses to shared state.

    `mutable std::mutex` is common because locking is an implementation detail of a logically const operation.

    `volatile` and `const` express different constraints:

    - `const` restricts program mutation through an access path.
    - `volatile` tells the compiler that accesses are observable and the value may change outside ordinary program flow.

    A read-only memory-mapped register might be represented as:

    ```cpp
    volatile const std::uint32_t* status =
        reinterpret_cast<volatile const std::uint32_t*>(status_address);
    ```

    The program should not write through this pointer, but every read must actually occur because hardware may change the value.

    A writable register might use:

    ```cpp
    volatile std::uint32_t* control =
        reinterpret_cast<volatile std::uint32_t*>(control_address);
    ```

    `volatile` is not an atomicity or thread-synchronization mechanism. It does not make compound operations safe between threads.
  source: C++ study notes
- id: '03.1'
  topic: Const Correctness
  question: What is const correctness?
  answer: |-
    ## Short answer

    It is the consistent design of types and APIs so read-only and mutable access are accurately expressed and enforced across parameters, members, call chains, and returned access.

    ## Detailed answer

    A single const declaration is syntax. Const correctness is a design property across declarations, definitions, call chains, and returned access.

    ```cpp
    class ImageProcessor {
    public:
        ImageProcessor(const Calibration& calibration)
            : calibration_{calibration} {}

        Result process(const Frame& frame) const;

    private:
        const Calibration& calibration_;
    };
    ```

    This interface communicates:

    - The processor borrows calibration rather than owning it.
    - Calibration is required because it is a reference.
    - Calibration is read-only through the processor.
    - Processing accepts a required read-only frame.
    - `process` does not logically mutate the processor.
    - The result is returned as a new value owned by the caller.

    If one helper is missing a const qualifier, the whole call chain may become unusable from a const object:

    ```cpp
    class ImageProcessor {
    public:
        Result process(const Frame& frame) const {
            return validate(frame); // validate must also be const
        }

    private:
        Result validate(const Frame& frame) const;
    };
    ```

    ### Tradeoff

    A very restrictive interface can be awkward if mutation is genuinely required. The goal is not to add const everywhere mechanically; it is to grant exactly the mutation each operation needs.
  source: 03_const_correctness.md
- id: '03.2'
  topic: Const Correctness
  question: What four questions should a parameter type answer?
  answer: |-
    ## Short answer

    Is the argument required? May it be modified? Is ownership transferred or shared? Is copying intended?

    ## Detailed answer

    Parameter types should answer four questions:

    1. Is an argument required?
    2. May the function modify it?
    3. Does the function own it?
    4. Is copying intended?

    ### Common contracts

    ```cpp
    void set_retry_count(int count);             // small value
    void inspect(const Packet& packet);          // required, read-only borrow
    void repair(Packet& packet);                 // required, mutable borrow
    void inspect_if_present(const Packet* packet); // optional, read-only borrow
    void take(std::unique_ptr<Packet> packet);    // ownership transfer
    ```

    `const Packet&` says that an object is required in ordinary use because references do not represent an empty state. It makes no copy and denies mutation through that reference.

    ### Output parameters

    A mutable reference can express an output:

    ```cpp
    bool decode(const Bytes& input, Packet& output);
    ```

    However, a returned object often composes better:

    ```cpp
    std::optional<Packet> decode(const Bytes& input);
    ```

    Use an output reference when it fits performance, ABI, embedded allocation, or multi-output constraints. Use a return value when it produces a clearer ownership and error model.

    ### Small types

    This is normally preferable:

    ```cpp
    void set_channel(int channel);
    ```

    to:

    ```cpp
    void set_channel(const int& channel);
    ```

    The reference adds indirection and lifetime coupling without avoiding meaningful work.
  source: 03_const_correctness.md
- id: '03.3'
  topic: Const Correctness
  question: Why should logically read-only member functions be `const`?
  answer: |-
    ## Short answer

    It documents the contract, allows calls on const objects, supports const propagation, and expands safe reuse of the type.

    ## Detailed answer

    A member function that does not logically modify the object should normally be const:

    ```cpp
    class Sensor {
    public:
        int value() const {
            return value_;
        }

        bool healthy() const {
            return error_count_ == 0;
        }

        void reset() {
            value_ = 0;
            error_count_ = 0;
        }

    private:
        int value_{};
        unsigned error_count_{};
    };
    ```

    Usage:

    ```cpp
    const Sensor sensor;
    int value = sensor.value(); // valid
    // sensor.reset();          // error
    ```

    The trailing const applies to the implicit object parameter. Conceptually:

    ```cpp
    int value(const Sensor& self);
    void reset(Sensor& self);
    ```

    ### Why getters should be const

    A getter without trailing const cannot be called through:

    - A const object.
    - A const reference.
    - A pointer-to-const.
    - A const container element.

    Missing one qualifier can make a large read-only API unusable.

    ### What a const member may do

    It may:

    - Read ordinary members.
    - Call other const member functions.
    - Modify local variables.
    - Modify `mutable` members.
    - Read or even mutate external objects through pointer/reference members if their types permit it.
    - Perform I/O.

    So trailing const is a type-system restriction, not a guarantee of purity.
  source: 03_const_correctness.md
- id: '03.4'
  topic: Const Correctness
  question: How does object constness affect overload resolution?
  answer: |-
    ## Short answer

    A mutable object can call const or non-const members, with the non-const match generally preferred. A const object can call only compatible const-qualified members.

    ## Detailed answer

    For an ordinary member function:

    ```cpp
    class Counter {
    public:
        int value() const;
        void increment();
    };
    ```

    a useful conceptual model is:

    ```cpp
    int value(const Counter& self);
    void increment(Counter& self);
    ```

    This model explains why:

    ```cpp
    const Counter counter;
    // counter.increment(); // cannot bind const Counter to mutable Counter&
    counter.value();        // can bind to const Counter&
    ```

    It also explains overload resolution:

    ```cpp
    void inspect();
    void inspect() const;
    ```

    A mutable object can call either in principle, but the non-const version is a better match because it does not add const qualification. A const object can call only the const version.

    ### Ref-qualified member functions

    Advanced APIs may also distinguish lvalue and rvalue objects:

    ```cpp
    class Payload {
    public:
        const std::string& data() const & {
            return data_;
        }

        std::string data() && {
            return std::move(data_);
        }

    private:
        std::string data_;
    };
    ```

    The first safely borrows from an lvalue. The second moves data out of a temporary/rvalue object.
  source: 03_const_correctness.md
- id: '03.5'
  topic: Const Correctness
  question: Can member overloads differ by return type alone?
  answer: |-
    ## Short answer

    No. Const/non-const accessors differ through the member function’s trailing `const`, which changes the implicit object parameter.

    ## Detailed answer

    The standard pattern is:

    ```cpp
    class Buffer {
    public:
        int& operator[](std::size_t index) {
            return data_[index];
        }

        const int& operator[](std::size_t index) const {
            return data_[index];
        }

    private:
        int data_[10]{};
    };
    ```

    ### Mutable object

    ```cpp
    Buffer writable;
    writable[3] = 42;
    int x = writable[3];
    ```

    Both expressions select:

    ```cpp
    int& operator[](std::size_t index);
    ```

    The compiler chooses the overload before considering what later happens to the returned reference. Reading the result does not cause selection of the const overload.

    ### Const object

    ```cpp
    const Buffer read_only;
    int x = read_only[3];
    // read_only[3] = 42; // error
    ```

    This selects:

    ```cpp
    const int& operator[](std::size_t index) const;
    ```

    ### Why the return types match the object

    Returning `int&` from the mutable overload allows callers to mutate the actual element. Returning `const int&` from the const overload prevents a const object from leaking mutable access to its internals.

    This would violate const correctness:

    ```cpp
    int& operator[](std::size_t index) const; // normally ill-formed
    ```

    Inside the const function, `data_[index]` behaves as a const lvalue, so it cannot bind to `int&`.

    ### Return types do not create overloads

    These conflict:

    ```cpp
    int& operator[](std::size_t index);
    const int& operator[](std::size_t index);
    ```

    Overload resolution cannot use the desired return type because many expressions ignore a return value or provide no unique expected type.

    ### Bounds tradeoff

    `operator[]` conventionally provides unchecked access, as with standard containers. A checked operation can be separate:

    ```cpp
    int& at(std::size_t index) {
        if (index >= 10) {
            throw std::out_of_range{"Buffer index"};
        }
        return data_[index];
    }
    ```

    In exception-free embedded code, the checked API might return a pointer, `std::optional<std::reference_wrapper<int>>`, an error code, or use a precondition/assertion.
  source: 03_const_correctness.md
- id: '03.6'
  topic: Const Correctness
  question: What should const and non-const direct accessors return?
  answer: |-
    ## Short answer

    When exposing direct access is appropriate, return `T&` from the non-const overload and `const T&` from the const overload.

    ## Detailed answer

    The standard pattern is:

    ```cpp
    class Buffer {
    public:
        int& operator[](std::size_t index) {
            return data_[index];
        }

        const int& operator[](std::size_t index) const {
            return data_[index];
        }

    private:
        int data_[10]{};
    };
    ```

    ### Mutable object

    ```cpp
    Buffer writable;
    writable[3] = 42;
    int x = writable[3];
    ```

    Both expressions select:

    ```cpp
    int& operator[](std::size_t index);
    ```

    The compiler chooses the overload before considering what later happens to the returned reference. Reading the result does not cause selection of the const overload.

    ### Const object

    ```cpp
    const Buffer read_only;
    int x = read_only[3];
    // read_only[3] = 42; // error
    ```

    This selects:

    ```cpp
    const int& operator[](std::size_t index) const;
    ```

    ### Why the return types match the object

    Returning `int&` from the mutable overload allows callers to mutate the actual element. Returning `const int&` from the const overload prevents a const object from leaking mutable access to its internals.

    This would violate const correctness:

    ```cpp
    int& operator[](std::size_t index) const; // normally ill-formed
    ```

    Inside the const function, `data_[index]` behaves as a const lvalue, so it cannot bind to `int&`.

    ### Return types do not create overloads

    These conflict:

    ```cpp
    int& operator[](std::size_t index);
    const int& operator[](std::size_t index);
    ```

    Overload resolution cannot use the desired return type because many expressions ignore a return value or provide no unique expected type.

    ### Bounds tradeoff

    `operator[]` conventionally provides unchecked access, as with standard containers. A checked operation can be separate:

    ```cpp
    int& at(std::size_t index) {
        if (index >= 10) {
            throw std::out_of_range{"Buffer index"};
        }
        return data_[index];
    }
    ```

    In exception-free embedded code, the checked API might return a pointer, `std::optional<std::reference_wrapper<int>>`, an error code, or use a precondition/assertion.

    A paired accessor can preserve constness:

    ```cpp
    class Device {
    public:
        Configuration& configuration() {
            return configuration_;
        }

        const Configuration& configuration() const {
            return configuration_;
        }

    private:
        Configuration configuration_;
    };
    ```

    ### Benefits

    - No copy of a potentially large object.
    - Mutable callers can modify it.
    - Const callers receive only read-only access.
    - The compiler propagates constness.

    ### Costs

    Returning a reference exposes internal representation and couples callers to the member's lifetime. It can also make invariants difficult to protect:

    ```cpp
    device.configuration().set_invalid_combination();
    ```

    A narrower interface may be better:

    ```cpp
    class Device {
    public:
        int sample_rate() const;
        bool set_sample_rate(int rate);
    };
    ```

    ### Return by value

    For a small or identity-independent value, return by value:

    ```cpp
    int id() const {
        return id_;
    }
    ```

    Returning `const int&` would add lifetime coupling for no meaningful performance benefit.
  source: 03_const_correctness.md
- id: '03.7'
  topic: Const Correctness
  question: Why is C++ const usually shallow?
  answer: |-
    ## Short answer

    A const object cannot modify its direct ordinary members, but a pointer member may still point to mutable external data. The handle is part of the const object; the pointee may not be.

    ## Detailed answer

    C++ const is normally shallow.

    ```cpp
    class Controller {
    public:
        explicit Controller(Device* device)
            : device_{device} {}

        void emergency_stop() const {
            device_->stop(); // may mutate the Device
        }

    private:
        Device* device_;
    };
    ```

    The const member function cannot reseat `device_` because the pointer member itself is part of the const `Controller`. But it may mutate the separate `Device` object because the pointer type is `Device*`.

    To provide read-only pointed-to access:

    ```cpp
    const Device* device_;
    ```

    Now `device_` points to const `Device`.

    ### Reference members

    A reference member behaves similarly:

    ```cpp
    class Monitor {
    public:
        explicit Monitor(Device& device) : device_{device} {}

        void poll() const {
            device_.refresh(); // possible if refresh is non-const
        }

    private:
        Device& device_;
    };
    ```

    The reference cannot be reseated anyway; constness of `Monitor` does not automatically add const to the referenced `Device`.

    ### Deep const

    Some designs need constness to propagate through an owning handle. Standard pointers do not provide deep const automatically. You may expose different view types or design operations so mutation remains controlled.
  source: 03_const_correctness.md
- id: '03.8'
  topic: Const Correctness
  question: How does const affect containers and smart pointers?
  answer: |-
    ## Short answer

    A const container exposes const element access. A const smart-pointer handle usually cannot be reseated, but it may still give mutable access to its pointee unless the pointee type is const.

    ## Detailed answer

    ### Const containers

    ```cpp
    const std::vector<int> values{1, 2, 3};

    int x = values[0];
    // values[0] = 10; // error
    ```

    A const vector provides const access to its elements and cannot change its size or capacity.

    Iterator types reflect this:

    ```cpp
    std::vector<int>::iterator mutable_it;
    std::vector<int>::const_iterator read_only_it;
    ```

    `cbegin()` and `cend()` explicitly request const iteration:

    ```cpp
    for (auto it = values.cbegin(); it != values.cend(); ++it) {
        // *it is const int&
    }
    ```

    `std::as_const` can request a const view of a mutable object:

    ```cpp
    for (const auto& value : std::as_const(values)) {
        // read-only access
    }
    ```

    ### Const smart pointer versus pointer to const

    ```cpp
    const std::unique_ptr<Device> owner = std::make_unique<Device>();
    owner->reset(); // allowed if Device::reset is non-const
    ```

    The `unique_ptr` handle cannot be moved or reset, but its pointee is still mutable.

    To make the pointee read-only through the handle:

    ```cpp
    std::unique_ptr<const Device> owner;
    ```

    The same distinction exists with `shared_ptr`.

    ### `std::span`

    ```cpp
    std::span<int> writable;
    std::span<const int> read_only;
    ```

    A `const std::span<int>` prevents changing the span descriptor but still yields mutable `int` elements. `std::span<const int>` provides read-only element access.
  source: 03_const_correctness.md
- id: '03.9'
  topic: Const Correctness
  question: What is const propagation?
  answer: |-
    ## Short answer

    A const operation must call other operations through const-compatible interfaces. One missing qualifier in a helper can make the full call chain unusable from const objects.

    ## Detailed answer

    Const correctness is contagious in a useful way.

    ```cpp
    class Pipeline {
    public:
        Report inspect() const {
            return build_report();
        }

    private:
        Report build_report() const {
            return collect_metrics();
        }

        Metrics collect_metrics() const;
    };
    ```

    Every operation in the read-only call chain must support const access.

    If a helper lacks const:

    ```cpp
    Metrics collect_metrics(); // missing const
    ```

    then a const caller cannot use it, even if the implementation happens not to mutate anything.

    ### Propagating through parameters

    ```cpp
    void render(const Scene& scene) {
        for (const Object& object : scene.objects()) {
            object.draw();
        }
    }
    ```

    For this to work cleanly:

    - `Scene::objects()` needs a const overload.
    - A const container must yield const elements.
    - `Object::draw()` should be const if drawing does not change logical object state.

    ### Design benefit

    The compiler reveals accidental mutation paths. Fixing the first missing const often uncovers other interfaces that did not accurately express read-only behavior.
  source: 03_const_correctness.md
- id: '03.10'
  topic: Const Correctness
  question: What lifetime obligation remains when a const accessor returns a view?
  answer: |-
    ## Short answer

    The source object and its storage must outlive the view. Const limits mutation; it does not create ownership or extend lifetime.

    ## Detailed answer

    Non-owning views make const and lifetime reasoning important:

    ```cpp
    void parse(std::string_view text);
    void transmit(std::span<const std::byte> bytes);
    ```

    These types:

    - Do not own their data.
    - Provide read-only element access in these declarations.
    - Usually copy cheaply.
    - Can dangle if the underlying storage dies or reallocates.

    ### Const does not fix lifetime

    ```cpp
    std::string_view bad() {
        std::string local = "message";
        return local; // dangling view
    }
    ```

    The view is read-only, but its data no longer exists.

    ### Tradeoff

    Views avoid copies and express ranges better than pointer-plus-size pairs. They require disciplined lifetime management and may not be appropriate when the callee needs to retain the data.
  source: 03_const_correctness.md
- id: '03.11'
  topic: Const Correctness
  question: When is `mutable` appropriate?
  answer: |-
    ## Short answer

    For logically invisible state such as a cache, statistics that are not part of value semantics, or a mutex. It should not hide changes to the object’s meaningful observable state.

    ## Detailed answer

    Logical constness means an operation does not change the abstract value users observe, even if implementation details change.

    ### Cache example

    ```cpp
    class Frame {
    public:
        std::uint32_t checksum() const {
            if (!checksum_valid_) {
                checksum_ = calculate_checksum();
                checksum_valid_ = true;
            }
            return checksum_;
        }

    private:
        std::uint32_t calculate_checksum() const;

        mutable bool checksum_valid_{false};
        mutable std::uint32_t checksum_{};
    };
    ```

    Caching does not change the frame's logical content.

    ### Mutex example

    ```cpp
    class Registry {
    public:
        std::optional<Device> find(int id) const {
            std::lock_guard lock{mutex_};
            // search devices_
        }

    private:
        mutable std::mutex mutex_;
        std::vector<Device> devices_;
    };
    ```

    Locking changes mutex state but is necessary to implement a logically read-only query.

    ### Misuse

    This is misleading:

    ```cpp
    class Account {
    public:
        void withdraw(int amount) const {
            balance_ -= amount;
        }

    private:
        mutable int balance_{};
    };
    ```

    Balance is meaningful state. The operation should be non-const.
  source: 03_const_correctness.md
- id: '03.12'
  topic: Const Correctness
  question: Why are const correctness and thread safety separate contracts?
  answer: |-
    ## Short answer

    Const methods can touch mutable state or externally shared objects, and other aliases can mutate the same object. Race freedom requires synchronization or atomic operations.

    ## Detailed answer

    Consider:

    ```cpp
    class Queue {
    public:
        std::size_t size() const {
            return values_.size();
        }

        void push(int value) {
            values_.push_back(value);
        }

    private:
        std::vector<int> values_;
    };
    ```

    `size()` being const does not make this safe:

    ```text
    Thread A: queue.size()
    Thread B: queue.push(42)
    ```

    Concurrent unsynchronized access can still be a data race.

    A thread-safe interface must use mutexes, atomics, immutability, confinement, or another synchronization strategy.

    ### Stronger design idea

    A truly immutable object can often be shared safely for reading after publication, provided its construction and publication are synchronized correctly. Ordinary const access to an otherwise mutable object is not the same guarantee.
  source: 03_const_correctness.md
- id: '04.1'
  topic: Constructors, Destructors, and Initialization
  question: What is the difference between allocation and construction?
  answer: |-
    ## Short answer

    Allocation obtains raw storage. Construction establishes a live object in that storage by initializing bases and members and executing the constructor when required.

    ## Detailed answer

    These terms describe different parts of an object's life.

    | Term | Meaning |
    |---|---|
    | Storage | Bytes with sufficient size and alignment |
    | Allocation | Obtaining storage |
    | Initialization | Giving an object or subobject its initial state |
    | Construction | Establishing a live class object, including base/member initialization and constructor execution |
    | Assignment | Replacing state of an object that already exists |
    | Destruction | Ending a class object's lifetime and running cleanup |
    | Deallocation | Returning storage |

    Consider:

    ```cpp
    Device device{42};
    ```

    For an automatic object, the implementation reserves storage, initializes the object's bases and members, and executes the constructor. It later runs the destructor at scope exit. The compiler may optimize the machine instructions, but these language-level effects must be preserved.

    Dynamic construction combines allocation and construction:

    ```cpp
    Device* device = new Device{42};
    ```

    The `new` expression conceptually:

    1. Calls an allocation function to obtain storage.
    2. Constructs `Device` in that storage.
    3. Produces a pointer to the object.

    `delete device` conceptually destroys the object and then deallocates its storage.

    Modern code usually represents exclusive dynamic ownership with:

    ```cpp
    auto device = std::make_unique<Device>(42);
    ```

    ### Construction does not always emit a function call

    For trivial types, construction may amount to simple stores or no instructions. "Construct" is an object-model term; it does not promise a literal runtime call.
  source: 04_constructors_destructors_initialization.md
- id: '04.2'
  topic: Constructors, Destructors, and Initialization
  question: What is the difference between initialization and assignment?
  answer: |-
    ## Short answer

    Initialization establishes an object’s first state as its lifetime begins. Assignment replaces the state of an already-live object.

    ## Detailed answer

    These terms describe different parts of an object's life.

    | Term | Meaning |
    |---|---|
    | Storage | Bytes with sufficient size and alignment |
    | Allocation | Obtaining storage |
    | Initialization | Giving an object or subobject its initial state |
    | Construction | Establishing a live class object, including base/member initialization and constructor execution |
    | Assignment | Replacing state of an object that already exists |
    | Destruction | Ending a class object's lifetime and running cleanup |
    | Deallocation | Returning storage |

    Consider:

    ```cpp
    Device device{42};
    ```

    For an automatic object, the implementation reserves storage, initializes the object's bases and members, and executes the constructor. It later runs the destructor at scope exit. The compiler may optimize the machine instructions, but these language-level effects must be preserved.

    Dynamic construction combines allocation and construction:

    ```cpp
    Device* device = new Device{42};
    ```

    The `new` expression conceptually:

    1. Calls an allocation function to obtain storage.
    2. Constructs `Device` in that storage.
    3. Produces a pointer to the object.

    `delete device` conceptually destroys the object and then deallocates its storage.

    Modern code usually represents exclusive dynamic ownership with:

    ```cpp
    auto device = std::make_unique<Device>(42);
    ```

    ### Construction does not always emit a function call

    For trivial types, construction may amount to simple stores or no instructions. "Construct" is an object-model term; it does not promise a literal runtime call.

    C++ has several initialization syntaxes whose differences matter.

    ### Default-initialization

    ```cpp
    Widget widget;
    ```

    For a class, this invokes a default constructor. For a local built-in scalar with no initializer:

    ```cpp
    int value; // indeterminate
    ```

    Reading the indeterminate value is invalid.

    ### Value-initialization

    ```cpp
    Widget widget{};
    int value{}; // zero
    ```

    Braces are a reliable way to request initialization. For scalar types, `{}` produces zero initialization.

    ### Direct-initialization

    ```cpp
    Widget widget(argument);
    Widget widget2{argument};
    ```

    The constructor is selected directly. Braces additionally reject narrowing conversions in list-initialization:

    ```cpp
    int x{3.5}; // error: narrowing
    ```

    ### Copy-initialization

    ```cpp
    Widget copy = original;
    ```

    Despite the `=`, this initializes a new object. It is not assignment.

    ```cpp
    Widget copy;
    copy = original; // assignment
    ```

    Copy-initialization does not use explicit converting constructors, whereas direct-initialization can.

    ### Aggregate initialization

    An aggregate can initialize public members directly:

    ```cpp
    struct Point {
        int x;
        int y;
    };

    Point point{10, 20};
    ```

    Adding private members, certain constructors, base conditions, or virtual functions can change aggregate status; exact rules depend on the C++ standard version.

    ### `auto` and initializer lists

    ```cpp
    auto a = 1;   // int
    auto b{1};    // int
    auto c = {1}; // std::initializer_list<int>
    ```

    Brace deduction has special cases. Do not assume all visually similar forms have the same type.
  source: 04_constructors_destructors_initialization.md
- id: '04.3'
  topic: Constructors, Destructors, and Initialization
  question: What does `Widget w = other;` mean?
  answer: |-
    ## Short answer

    It is copy-initialization of a new object, not assignment. `w = other;` is assignment only if `w` already exists.

    ## Detailed answer

    C++ has several initialization syntaxes whose differences matter.

    ### Default-initialization

    ```cpp
    Widget widget;
    ```

    For a class, this invokes a default constructor. For a local built-in scalar with no initializer:

    ```cpp
    int value; // indeterminate
